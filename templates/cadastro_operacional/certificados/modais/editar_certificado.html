<!-- Modal Editar Certificado -->
<div class="modal fade" id="modalEditarCertificado" tabindex="-1" aria-labelledby="modalEditarCertificadoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="POST" action="" id="form-editar-certificado" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="certificado_id_editar" name="id" value="">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalEditarCertificadoLabel"><i class="fas fa-edit"></i> Editar Certificado</h5>
                    <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="nome_editar" class="form-label">Nome *</label>
                            <input type="text" class="form-control" id="nome_editar" name="nome" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="tipo_id_editar" class="form-label">Tipo</label>
                            <select class="form-select" id="tipo_id_editar" name="tipo_id">
                                <option value="">Selecione um tipo</option>
                                <!-- Opções serão carregadas via JavaScript -->
                            </select>
                            <input type="hidden" id="tipo_editar" name="tipo" value="">
                        </div>
                        <div class="col-md-6">
                            <label for="data_editar" class="form-label">Data</label>
                            <input type="date" class="form-control" id="data_editar" name="data">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="data_vencimento_editar" class="form-label">Data de Vencimento</label>
                            <input type="date" class="form-control" id="data_vencimento_editar" name="data_vencimento">
                        </div>
                    </div>
                    
                    <!-- Campos dinâmicos baseados no tipo selecionado -->
                    <div id="campos_dinamicos_editar" style="display: none;">
                        <hr>
                        <h6 class="mb-3">Campos Específicos do Tipo</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered table-sm" id="campos_dinamicos_container_editar">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 30%;">Campo</th>
                                        <th style="width: 70%;">Valor</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Campos serão renderizados dinamicamente via JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Documentos Anexos Existentes</label>
                            <div id="documentos_existentes" class="list-group mb-2">
                                <!-- Documentos serão carregados via JavaScript -->
                            </div>
                            <label for="documentos_novos" class="form-label">Adicionar Novos Documentos</label>
                            <input type="file" class="form-control" id="documentos_novos" name="documento_0" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                            <small class="text-muted">Você pode selecionar múltiplos arquivos</small>
                        </div>
                    </div>
                    
                    <div class="row mb-3" id="dados_adicionais_container_editar" style="display: none;">
                        <div class="col-md-12">
                            <label for="dados_adicionais_editar" class="form-label">Dados Adicionais (JSON)</label>
                            <textarea class="form-control" id="dados_adicionais_editar" name="dados_adicionais" rows="5" placeholder='{"campo1": "valor1", "campo2": "valor2"}'></textarea>
                            <small class="text-muted" id="dados_adicionais_help_editar">Este campo é preenchido automaticamente com os campos específicos</small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    let tiposDisponiveis = [];
    
    // Função para renderizar campos dinâmicos baseados no tipo
    function renderizarCamposDinamicos(campos, dadosExistentes = {}) {
        const container = document.querySelector('#campos_dinamicos_container_editar tbody');
        const camposDiv = document.getElementById('campos_dinamicos_editar');
        
        if (!container || !camposDiv) return;
        
        // Limpar campos anteriores
        container.innerHTML = '';
        
        if (!campos || campos.length === 0) {
            camposDiv.style.display = 'none';
            return;
        }
        
        camposDiv.style.display = 'block';
        
        campos.forEach(campo => {
            const campoNome = campo.nome || '';
            const campoLabel = campo.label || campoNome;
            const campoTipo = campo.tipo || 'text';
            const campoObrigatorio = campo.obrigatorio || false;
            const valorExistente = dadosExistentes[campoNome] || '';
            
            const row = document.createElement('tr');
            
            let inputHtml = '';
            const inputId = `campo_${campoNome}_editar`;
            const inputName = `campo_${campoNome}`;
            const requiredAttr = campoObrigatorio ? 'required' : '';
            const valorAttr = valorExistente ? `value="${String(valorExistente).replace(/"/g, '&quot;')}"` : '';
            
            switch(campoTipo) {
                case 'textarea':
                    inputHtml = `<textarea class="form-control form-control-sm" id="${inputId}" name="${inputName}" rows="2" ${requiredAttr}>${valorExistente}</textarea>`;
                    break;
                case 'number':
                    inputHtml = `<input type="number" class="form-control form-control-sm" id="${inputId}" name="${inputName}" step="any" ${requiredAttr} ${valorAttr}>`;
                    break;
                case 'date':
                    inputHtml = `<input type="date" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr} ${valorAttr}>`;
                    break;
                case 'email':
                    inputHtml = `<input type="email" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr} ${valorAttr}>`;
                    break;
                case 'tel':
                    inputHtml = `<input type="tel" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr} ${valorAttr}>`;
                    break;
                case 'url':
                    inputHtml = `<input type="url" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr} ${valorAttr}>`;
                    break;
                case 'select':
                case 'lista':
                    let opcoesHtml = '<option value="">Selecione...</option>';
                    if (campo.opcoes && Array.isArray(campo.opcoes)) {
                        campo.opcoes.forEach(opcao => {
                            const opcaoValue = opcao.value || opcao.valor || '';
                            const opcaoLabel = opcao.label || opcao.texto || opcaoValue;
                            const selectedAttr = (valorExistente && valorExistente == opcaoValue) ? 'selected' : '';
                            opcoesHtml += `<option value="${opcaoValue}" ${selectedAttr}>${opcaoLabel}</option>`;
                        });
                    }
                    inputHtml = `<select class="form-select form-select-sm" id="${inputId}" name="${inputName}" ${requiredAttr}>${opcoesHtml}</select>`;
                    break;
                default:
                    inputHtml = `<input type="text" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr} ${valorAttr}>`;
            }
            
            row.innerHTML = `
                <td>
                    <label for="${inputId}" class="form-label mb-0 fw-normal">${campoLabel}${campoObrigatorio ? ' <span class="text-danger">*</span>' : ''}</label>
                </td>
                <td>
                    ${inputHtml}
                </td>
            `;
            
            container.appendChild(row);
        });
    }

    // Função para carregar campos do tipo selecionado
    function carregarCamposTipo(tipoId, dadosExistentes = {}) {
        if (!tipoId) {
            document.getElementById('campos_dinamicos_editar').style.display = 'none';
            document.getElementById('tipo_editar').value = '';
            return;
        }
        
        fetch(`{{ url_for('certificado.get_campos_tipo', tipo_id=0) }}`.replace('0', tipoId))
            .then(response => response.json())
            .then(data => {
                // Atualizar nome do tipo no campo hidden
                const tipoSelect = document.getElementById('tipo_id_editar');
                const tipoHidden = document.getElementById('tipo_editar');
                if (tipoSelect && tipoHidden) {
                    const selectedOption = tipoSelect.options[tipoSelect.selectedIndex];
                    tipoHidden.value = selectedOption ? selectedOption.text : '';
                }
                
                // Renderizar campos dinâmicos com dados existentes
                renderizarCamposDinamicos(data.campos, dadosExistentes);
            })
            .catch(error => {
                console.error('Erro ao carregar campos do tipo:', error);
            });
    }

    // Função para coletar dados dos campos dinâmicos
    function coletarDadosDinamicos() {
        const dados = {};
        const campos = document.querySelectorAll('#campos_dinamicos_container_editar input, #campos_dinamicos_container_editar textarea, #campos_dinamicos_container_editar select');
        
        campos.forEach(campo => {
            const name = campo.name;
            if (name && name.startsWith('campo_')) {
                const campoNome = name.replace('campo_', '');
                dados[campoNome] = campo.value;
            }
        });
        
        return dados;
    }

    // Função para carregar tipos no select
    function carregarTiposSelect(tipos) {
        const select = document.getElementById('tipo_id_editar');
        if (!select) return;
        
        tiposDisponiveis = tipos;
        select.innerHTML = '<option value="">Selecione um tipo</option>';
        tipos.forEach(tipo => {
            const option = document.createElement('option');
            option.value = tipo.id;
            option.textContent = tipo.nome;
            select.appendChild(option);
        });
    }

    // Expor funções para uso externo
    window.carregarCertificadoEditar = function(certificado, tipos, documentos) {
        // Carregar tipos no select
        if (tipos) {
            carregarTiposSelect(tipos);
        }
        
        // Preencher campos básicos
        document.getElementById('certificado_id_editar').value = certificado.id;
        document.getElementById('nome_editar').value = certificado.nome || '';
        document.getElementById('data_editar').value = certificado.data || '';
        document.getElementById('data_vencimento_editar').value = certificado.data_vencimento || '';
        
        // Selecionar tipo
        const tipoSelect = document.getElementById('tipo_id_editar');
        if (tipoSelect && certificado.tipo_id) {
            tipoSelect.value = certificado.tipo_id;
            // Carregar campos dinâmicos do tipo
            const dadosExistentes = certificado.dados_adicionais || {};
            carregarCamposTipo(certificado.tipo_id, dadosExistentes);
        }
        
        // Carregar documentos existentes
        const documentosDiv = document.getElementById('documentos_existentes');
        if (documentosDiv && documentos) {
            documentosDiv.innerHTML = '';
            documentos.forEach(doc => {
                const item = document.createElement('div');
                item.className = 'list-group-item d-flex justify-content-between align-items-center';
                item.innerHTML = `
                    <span>${doc.filename || 'Documento'}</span>
                    <div>
                        <a href="{{ url_for('certificado.download_documento', doc_id=0) }}`.replace('0', doc.id) + `" class="btn btn-sm btn-primary me-1" target="_blank">
                            <i class="fas fa-download"></i>
                        </a>
                        <button type="button" class="btn btn-sm btn-danger" onclick="excluirDocumento(${doc.id}, ${certificado.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                documentosDiv.appendChild(item);
            });
        }
        
        // Atualizar action do form
        const form = document.getElementById('form-editar-certificado');
        if (form) {
            form.action = `{{ url_for('certificado.editar', id=0) }}`.replace('0', certificado.id);
        }
    };

    // Inicializar quando o modal for aberto
    document.addEventListener('DOMContentLoaded', function() {
        const tipoSelect = document.getElementById('tipo_id_editar');
        if (tipoSelect) {
            tipoSelect.addEventListener('change', function() {
                const dadosExistentes = {};
                // Coletar dados existentes antes de trocar o tipo
                const camposAtuais = document.querySelectorAll('#campos_dinamicos_container_editar input, #campos_dinamicos_container_editar textarea, #campos_dinamicos_container_editar select');
                camposAtuais.forEach(campo => {
                    const name = campo.name;
                    if (name && name.startsWith('campo_')) {
                        const campoNome = name.replace('campo_', '');
                        dadosExistentes[campoNome] = campo.value;
                    }
                });
                carregarCamposTipo(this.value, dadosExistentes);
            });
        }
        
        // Formatar dados antes de enviar formulário
        const formEditar = document.getElementById('form-editar-certificado');
        if (formEditar) {
            formEditar.addEventListener('submit', function(e) {
                const dadosDinamicos = coletarDadosDinamicos();
                const dadosAdicionaisInput = document.getElementById('dados_adicionais_editar');
                if (dadosAdicionaisInput && Object.keys(dadosDinamicos).length > 0) {
                    dadosAdicionaisInput.value = JSON.stringify(dadosDinamicos);
                }
            });
        }
    });
})();
</script>
