<!-- Modal Produção --><div class="modal fade" id="producaoModal" tabindex="-1" role="dialog" aria-labelledby="producaoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="producaoModalLabel">Registrar Produção</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form id="form-producao">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body">
                    <div class="mb-3">
                        <p class="mb-1">Produto: <strong id="nome-produto-producao"></strong></p>
                        <p class="mb-1">Estoque Atual: <strong id="estoque-atual-producao"></strong></p>
                        <p class="mb-1">Quantidade Máxima: <strong id="quantidade-maxima-producao"></strong></p>
                    </div>
                    <input type="hidden" name="produto_id" id="produto_id_producao">
                    <div class="tabela-produtos-compostos table-responsive">
                        <table class="table table-bordered table-sm" id="tabela-componentes-producao">
                            <thead class="thead-light">
                                <tr>
                                    <th>Componente</th>
                                    <th>Quantidade p/ unidade</th>
                                    <th>Quantidade Total</th>
                                    <th>Estoque</th>
                                    <th>Disponível</th>
                                    <th>Valor Unitário</th>
                                    <th>Valor Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="mt-2 text-center">
                        <button type="button" class="btn btn-success btn-sm" id="btn-exportar-excel" title="Exportar para Excel" disabled>
                            <i class="fas fa-file-excel"></i> Exportar para Excel
                        </button>
                    </div>
                    
                    <div class="form-group mt-3">
                        <label for="quantidade_produzir">Quantidade a Produzir</label>
                        <input type="number" class="form-control" id="quantidade_produzir" name="quantidade" min="1" step="1" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary btn-send-producao">Confirmar Produção</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const produtoId = $('.btn-produzir').data('id');
       
        $('#tabela-produtos-compostos tbody').on('click', '.btn-produzir', function(e) {
            e.preventDefault();
            const produtoId = $(this).data('id');
            const produtoNome = $(this).data('nome');
            const produtoEstoque = $(this).data('estoque');

            $('#produto_id_producao').val(produtoId);
            $('#nome-produto-producao').text(produtoNome);
            $('#estoque-atual-producao').text(produtoEstoque);
            carregarComponentes(produtoId);
            $('#producaoModal').modal('show');
        });
        $('#producaoModal [data-dismiss="modal"]').on('click', function() {
            fecharModal('#producaoModal');
        });
        $('#quantidade_produzir').on('change', function() {
            const quantidade = $(this).val() || 1;
            const produtoId = $('#produto_id_producao').val();
            if (produtoId) {
                carregarComponentes(produtoId, quantidade);
            }
        });
        //carregarComponentes(produtoId);
    });
    function carregarComponentes(id,quantidade=1) {
            fetch(`/produto-composto/get_componentes/${id}/${quantidade}`,{
                headers: {
                    'X-CSRFToken': $('input[name="csrf_token"]').val()
                }
            })

            .then(response => response.json())
            .then(data => {
                console.log(data); 
                const tbody = document.querySelector('#tabela-componentes-producao tbody');
                const btnExportar = document.getElementById('btn-exportar-excel');
                tbody.innerHTML = '';
                // Desabilitar botão enquanto carrega
                if (btnExportar) btnExportar.disabled = true;
                
                if(data.success){
                data.componentes.forEach(componente => {
                    tbody.innerHTML += ` 
                        <tr>
                            <td>${componente.nome}</td>
                            <td>${componente.quantidade.replace('.', ',')}</td>
                            <td>${componente.quantidade_total.replace('.', ',')}</td>
                            <td>${componente.estoque.replace('.', ',')}</td>
                            <td>${componente.capacidade.replace('.', ',')}</td>
                            <td>${formatarMoeda(componente.valor_unitario)}</td>
                            <td>${formatarMoeda(componente.valor_total)}</td>
                            
                        </tr>
                    `;
                    });
                    tbody.innerHTML += `
                        <tr>
                            <td colspan="5">Total:</td>
                            <td>${formatarMoeda(data.valor_unitario)}</td>
                            <td>${formatarMoeda(data.valor_total)}</td>
                        </tr>
                    `;
                    
                    // Habilitar botão de exportar
                    if (btnExportar) btnExportar.disabled = false;
                } else {
                    // Desabilitar botão se não houver dados
                    if (btnExportar) btnExportar.disabled = true;
                }
            });
        }
     document.getElementById('form-producao').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const form = e.target;
        const formData = new FormData(form);
        const btn = form.querySelector('.btn-send-producao');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processando...';

        fetch('/produto-composto/produzir', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': formData.get('csrf_token')
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Fechar o modal
                $('#producaoModal').modal('hide');
                
                // Mostrar alerta de sucesso
                // (Você pode usar uma biblioteca como Toastr.js ou SweetAlert2 para isso)
                alert(data.message); 

                // Atualizar a tabela
                const produtoId = data.produto_id;
                const novoEstoque = data.novo_estoque;

                // Atualizar dados no array local
                const indexCompleto = produtosCompletos.findIndex(p => p.id == produtoId);
                if (indexCompleto > -1) {
                    produtosCompletos[indexCompleto].estoque = novoEstoque;
                }
                const indexFiltrado = produtosFiltrados.findIndex(p => p.id == produtoId);
                if (indexFiltrado > -1) {
                    produtosFiltrados[indexFiltrado].estoque = novoEstoque;
                }

                // Re-renderizar a tabela para refletir a mudança
                renderizarTabela();

            } else {
                alert('Erro: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Erro:', error);
            alert('Ocorreu um erro de comunicação com o servidor.');
        })
        .finally(() => {
            // Resetar o formulário e o botão
            form.reset();
            btn.disabled = false;
            btn.innerHTML = 'Confirmar Produção';
        });
    });
    
    // Função para exportar tabela para Excel
    const btnExportarExcel = document.getElementById('btn-exportar-excel');
    if (btnExportarExcel) {
        btnExportarExcel.addEventListener('click', function() {
            exportarParaExcel();
        });
    }
    
    function exportarParaExcel() {
        const table = document.getElementById('tabela-componentes-producao');
        const produtoNome = document.getElementById('nome-produto-producao').textContent || 'Producao';
        const quantidade = document.getElementById('quantidade_produzir').value || '1';
        
        // Verificar se a tabela tem dados
        const tbody = table.querySelector('tbody');
        if (!tbody || tbody.rows.length === 0) {
            alert('Não há dados para exportar. Carregue os componentes primeiro.');
            return;
        }
        
        // Criar workbook
        const wb = XLSX.utils.book_new();
        
        // Preparar dados para exportação
        const dados = [];
        
        // Adicionar informações do produto
        dados.push(['Produto:', produtoNome]);
        dados.push(['Quantidade a Produzir:', quantidade]);
        dados.push(['Estoque Atual:', document.getElementById('estoque-atual-producao').textContent || '']);
        dados.push(['Quantidade Máxima:', document.getElementById('quantidade-maxima-producao').textContent || '']);
        dados.push([]); // Linha em branco
        
        // Adicionar cabeçalhos
        const headers = [];
        table.querySelectorAll('thead th').forEach(th => {
            headers.push(th.textContent.trim());
        });
        dados.push(headers);
        
        // Adicionar linhas da tabela
        tbody.querySelectorAll('tr').forEach(tr => {
            const row = [];
            let colIndex = 0;
            tr.querySelectorAll('td').forEach(td => {
                let valor = td.textContent.trim();
                
                // Identificar se é coluna de valor (penúltima ou última coluna)
                const isValorUnitario = colIndex === headers.length - 2;
                const isValorTotal = colIndex === headers.length - 1;
                
                if (isValorUnitario || isValorTotal) {
                    // Remover formatação de moeda (R$, espaços) e converter para número
                    valor = valor.replace(/[R$\s]/g, '');
                    // Remover pontos de milhar e converter vírgula decimal para ponto
                    valor = valor.replace(/\./g, '').replace(',', '.');
                    // Converter para número se possível
                    const numValor = parseFloat(valor);
                    valor = isNaN(numValor) ? valor : numValor;
                } else {
                    // Para outras colunas, converter vírgula para ponto se for número
                    const numValor = parseFloat(valor.replace(',', '.'));
                    if (!isNaN(numValor)) {
                        valor = numValor;
                    }
                }
                
                row.push(valor);
                colIndex++;
            });
            dados.push(row);
        });
        
        // Criar worksheet
        const ws = XLSX.utils.aoa_to_sheet(dados);
        
        // Ajustar largura das colunas
        const colWidths = [];
        for (let i = 0; i < headers.length; i++) {
            let maxLength = headers[i].length;
            dados.forEach((row, idx) => {
                if (row[i] && idx > 4) { // Pular as linhas de informações iniciais
                    const cellValue = String(row[i] || '');
                    if (cellValue.length > maxLength) {
                        maxLength = cellValue.length;
                    }
                }
            });
            colWidths.push({ wch: Math.min(maxLength + 2, 50) });
        }
        ws['!cols'] = colWidths;
        
        // Adicionar worksheet ao workbook
        XLSX.utils.book_append_sheet(wb, ws, 'Componentes');
        
        // Gerar nome do arquivo
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '').replace('T', '_');
        const nomeArquivo = `producao_${produtoNome.replace(/[^a-zA-Z0-9]/g, '_')}_${timestamp}.xlsx`;
        
        // Exportar arquivo
        XLSX.writeFile(wb, nomeArquivo);
    }
</script>
{% endblock %}
