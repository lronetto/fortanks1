<div class="modal fade" id="modalNovoCalendario" tabindex="-1" aria-labelledby="modalNovoCalendarioLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="post" action="{{ url_for('cronograma.calendario_novo') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNovoCalendarioLabel">Novo calendário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" name="nome" required maxlength="160" placeholder="Ex.: Obra padrão, Expediente administrativo…">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dias úteis da semana</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check"><input class="form-check-input" type="checkbox" name="seg_util" id="nc_seg" value="1" checked><label class="form-check-label" for="nc_seg">Segunda</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" name="ter_util" id="nc_ter" value="1" checked><label class="form-check-label" for="nc_ter">Terça</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" name="qua_util" id="nc_qua" value="1" checked><label class="form-check-label" for="nc_qua">Quarta</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" name="qui_util" id="nc_qui" value="1" checked><label class="form-check-label" for="nc_qui">Quinta</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" name="sex_util" id="nc_sex" value="1" checked><label class="form-check-label" for="nc_sex">Sexta</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" name="sab_util" id="nc_sab" value="1"><label class="form-check-label" for="nc_sab">Sábado</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" name="dom_util" id="nc_dom" value="1"><label class="form-check-label" for="nc_dom">Domingo</label></div>
                        </div>
                        <div class="form-text">Marque os dias em que há expediente neste calendário.</div>
                    </div>
                    <div class="mb-0">
                        <label class="form-label">Observação</label>
                        <textarea class="form-control" name="observacao" rows="2" placeholder="Opcional"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
