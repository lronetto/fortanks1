<div class="modal fade" id="modalNovoFeriado" tabindex="-1" aria-labelledby="modalNovoFeriadoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="post" action="{{ url_for('cronograma.feriados_novo') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNovoFeriadoLabel">Novo feriado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" name="data" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" name="nome" required maxlength="200">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Tipo</label>
                            <select class="form-select" name="tipo">
                                <option value="nacional">Nacional</option>
                                <option value="estadual">Estadual</option>
                                <option value="municipal">Municipal</option>
                                <option value="facultativo">Facultativo</option>
                                <option value="ponto_facultativo">Ponto facultativo</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">UF</label>
                            <input type="text" class="form-control" name="uf" maxlength="2" placeholder="Ex.: SP">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Município</label>
                            <input type="text" class="form-control" name="municipio" maxlength="120">
                        </div>
                        <div class="col-md-6">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" name="recorrente" id="nf_recorrente" value="on">
                                <label class="form-check-label" for="nf_recorrente">Recorrente (anual)</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" name="ativo" id="nf_ativo" value="on" checked>
                                <label class="form-check-label" for="nf_ativo">Ativo</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Observação</label>
                            <textarea class="form-control" name="observacao" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
