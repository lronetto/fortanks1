<!-- Modal para Seleção de Material -->
<div class="modal fade" id="modalSelecionarMaterial" tabindex="-1" aria-labelledby="modalSelecionarMaterialLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalSelecionarMaterialLabel">Selecionar Material</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <label for="NomeMaterial">Nome Item Material Nota Fiscal</label>
                        <div id="NomeMaterial"></div>
                    </div>
                    
                </div>
                <div class="form-group mb-3">
                    <label for="buscarMaterial">Buscar material</label>
                    <input type="text" class="form-control" id="buscarMaterial" 
                           placeholder="Digite para buscar material por código ou descrição">
                </div>
                
                <input type="hidden" id="item_id_para_vincular">
                <input type="hidden" id="quantidade_para_vincular">
                <div class="table-responsive">
                    <table class="table table-bordered" id="tabelaMateriais">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Unidade</th>
                                <th width="80">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaMateriais">
                            <!-- Será preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div> 
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        $('#tabelaItensImportacao tbody').on('click', '.btn-vincular-material', function(e) {
            e.preventDefault();
            console.log('vincular material clicado');
            const id = $(this).data('item-id');
            const quantidade = $(this).data('quantidade');
            const nomeMaterial = $(this).data('material-nome');
            const unidadeMaterial = $(this).data('material-unidade');
            const descricaoMaterial = $(this).data('item-descricao');
            document.getElementById('NomeMaterial').textContent = descricaoMaterial;
            console.log('vincular material id', id);
            document.getElementById('item_id_para_vincular').value = id;
            document.getElementById('quantidade_para_vincular').value = quantidade;
            const buscarMaterial = document.getElementById('buscarMaterial');
            buscarMaterial.value = '';
            buscarMaterial.focus();
            document.getElementById('corpoTabelaMateriais').innerHTML = '';
            const modal = new bootstrap.Modal(document.getElementById('modalSelecionarMaterial'));
            modal.show();
        });
    
        
            // Buscar materiais
    let timeoutBusca;
    const buscarMaterial = document.getElementById('buscarMaterial');
    if (buscarMaterial) {
        buscarMaterial.addEventListener('keyup', function() {
            clearTimeout(timeoutBusca);
            const termo = this.value;
            
            if (termo.length < 3) return;
            
            timeoutBusca = setTimeout(function() {
                buscarMateriais(termo);
            }, 500);
        });
    }

    // Vincular material ao item
    document.addEventListener('click', async function(e) {
        if (e.target && e.target.closest('.btn-selecionar-material')) {
            const button = e.target.closest('.btn-selecionar-material');
            const materialId = button.dataset.materialId;
            const materialNome = button.dataset.materialNome;
            const materialUnidade = button.dataset.materialUnidade;
          
            const itemId = document.getElementById('item_id_para_vincular').value;
            
            // Obter a unidade do item
            const unidadeElemento = document.getElementById(`unidade_${itemId}`);
            const itemUnidade = unidadeElemento ? unidadeElemento.textContent : '';
            
            // Vincular material ao item
            document.getElementById(`material_id_${itemId}`).value = materialId;
            
            const materialNomeElemento = document.getElementById(`material_nome_${itemId}`);
            if (materialNomeElemento) materialNomeElemento.textContent = materialNome;
            
            const btnVincular = document.getElementById(`btn_vincular_${itemId}`);
            if (btnVincular) {
                btnVincular.innerHTML = '<i class="fas fa-edit"></i>';
                btnVincular.classList.remove('btn-primary');
                btnVincular.classList.add('btn-warning');
            }
            
            // Fechar modal de seleção
            const modalSelecionar = bootstrap.Modal.getInstance(document.getElementById('modalSelecionarMaterial'));
            if (modalSelecionar) modalSelecionar.hide();
            
            // Esperar o resultado da comparação antes de continuar
            const iguais = await compararUnidades(itemUnidade, materialUnidade);
            console.log('materialUnidade', materialUnidade);
            console.log('itemUnidade', itemUnidade);
            console.log('compararUnidades (iguais?)', iguais);
            console.log('itemId', itemId);
            console.log('materialId', materialId);

            
            // Verificar se precisa de conversão de unidades
            if (materialUnidade && itemUnidade && !iguais) {
                abrirModalConversao(itemId, materialId, itemUnidade, materialUnidade);
            }
        }
    });
    function buscarMateriais(termo) {
        const corpoTabela = document.getElementById('corpoTabelaMateriais');
        if (!corpoTabela) return;

        // Adiciona um feedback de carregamento
        corpoTabela.innerHTML = '<tr><td colspan="4" class="text-center">Buscando...</td></tr>';

        fetch(`/notas-fiscais/api/materiais?termo=${encodeURIComponent(termo)}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erro na requisição: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                corpoTabela.innerHTML = ''; // Limpa a tabela
                if (data.success && data.materiais.length > 0) {
                    data.materiais.forEach(material => {
                        const row = corpoTabela.insertRow();
                        row.innerHTML = `
                            <td>${material.codigo || ''}</td>
                            <td>${material.nome || material.descricao || ''}</td>
                            <td>${material.unidade || '-'}</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-primary btn-selecionar-material"
                                        data-material-id="${material.id}"
                                        data-material-nome="${material.nome || material.descricao}"
                                        data-material-unidade="${material.unidade || ''}">
                                    <i class="fas fa-check"></i>
                                </button>
                            </td>
                        `;
                    });
                } else {
                    corpoTabela.innerHTML = '<tr><td colspan="4" class="text-center">Nenhum material encontrado.</td></tr>';
                }
            })
            .catch(error => {
                console.error('Erro ao buscar materiais:', error);
                corpoTabela.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Erro ao carregar materiais.</td></tr>';
            });
    }
   
                

    // ===== MODAL DE CONVERSÃO DE UNIDADES =====
    // Abrir modal de conversão de unidades
    

    // Aplicar conversão de unidades
    
    });
</script>
{% endblock %}
