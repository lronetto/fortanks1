<!-- Modal para Seleção de Material -->
<div class="modal fade" id="modalSelecionarMaterial" tabindex="-1" aria-labelledby="modalSelecionarMaterialLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalSelecionarMaterialLabel">Selecionar Material</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <label for="NomeMaterial">Nome Item Material Nota Fiscal</label>
                        <div id="NomeMaterial"></div>
                    </div>
                    
                </div>
                <div class="form-group mb-3">
                    <label for="buscarMaterial">Buscar material</label>
                    <input type="text" class="form-control" id="buscarMaterial" 
                           placeholder="Digite para buscar material por código ou descrição">
                </div>
                
                <input type="hidden" id="item_id_para_vincular">
                <input type="hidden" id="quantidade_para_vincular">
                <div class="table-responsive">
                    <table class="table table-bordered" id="tabelaMateriais">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Unidade</th>
                                <th width="80">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaMateriais">
                            <!-- Será preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div> 
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        
    
        
            // Buscar materiais
    let timeoutBusca;
    const buscarMaterial = document.getElementById('buscarMaterial');
    if (buscarMaterial) {
        buscarMaterial.addEventListener('keyup', function() {
            clearTimeout(timeoutBusca);
            const termo = this.value;
            
            if (termo.length < 3) return;
            
            timeoutBusca = setTimeout(function() {
                buscarMateriais(termo);
            }, 500);
        });
    }

    // Vincular material ao item
    document.addEventListener('click', async function(e) {
        if (e.target && e.target.closest('.btn-selecionar-material')) {
            const button = e.target.closest('.btn-selecionar-material');
            const materialId = button.dataset.materialId;
            const materialNome = button.dataset.materialNome;
            const materialUnidade = button.dataset.materialUnidade;
          
            let itemId = document.getElementById('item_id_para_vincular').value;
            // Limpar itemId de espaços e caracteres extras
            itemId = String(itemId).trim();
            
            // Obter a unidade do item
            let itemUnidade = '';
            const unidadeElemento = document.getElementById(`unidade_${itemId}`);
            if (unidadeElemento) {
                // Tenta pegar textContent primeiro, depois innerText, depois innerHTML
                itemUnidade = unidadeElemento.textContent || unidadeElemento.innerText || unidadeElemento.innerHTML || '';
                itemUnidade = itemUnidade.trim();
            } else {
                // Fallback: buscar pela linha da tabela (coluna 3, índice 3)
                const linhaItem = document.querySelector(`#tabelaItensImportacao tr[id="item_${itemId}"]`);
                if (linhaItem && linhaItem.cells && linhaItem.cells.length > 3) {
                    itemUnidade = linhaItem.cells[3].textContent || linhaItem.cells[3].innerText || '';
                    itemUnidade = itemUnidade.trim();
                }
            }
            
            // Fechar modal de seleção primeiro
            const modalSelecionar = bootstrap.Modal.getInstance(document.getElementById('modalSelecionarMaterial'));
            if (modalSelecionar) modalSelecionar.hide();
            
            // Esperar o resultado da comparação antes de continuar
            iguais = false;
            fatorConversao = 0;
            const resultado = await compararUnidades(itemUnidade, materialUnidade);
            if (resultado.success) {
                fatorConversao = resultado.fator_conversao;
                iguais = true;
            }
            console.log('materialUnidade', materialUnidade);
            console.log('itemUnidade', itemUnidade);
            console.log('compararUnidades (iguais?)', iguais);
            console.log('itemId', itemId);
            console.log('materialId', materialId);
            console.log('fatorConversao', fatorConversao);
            
            // Verificar se precisa de conversão de unidades
            if (!fatorConversao) {
                abrirModalConversao(itemId, materialId, itemUnidade, materialUnidade);
            }
            else {
                 // Atualizar fator de conversão na tabela
                 const linhaItem = document.querySelector(`#tabelaItensImportacao tr[id="item_${itemId}"]`);
                if (linhaItem) {
                    const campoFatorConversao = document.getElementById(`fator_conversao_${itemId}`);
                    if (campoFatorConversao) {
                        campoFatorConversao.value = fatorConversao;
                    }
                    // A coluna "Fator de Conversão" é a 7ª coluna (índice 6)
                    const celulaFatorConversao = linhaItem.cells[6];
                    if (celulaFatorConversao) {
                        const fatorNum = parseFloat(fatorConversao);
                        if (!isNaN(fatorNum) && fatorNum > 0) {
                            const fatorFormatado = fatorNum.toLocaleString('pt-BR', {
                                minimumFractionDigits: 4,
                                maximumFractionDigits: 4
                            });
                            celulaFatorConversao.textContent = fatorFormatado;
                        }
                    }
                }

                vincularMaterialNoBackend(itemId, materialId, fatorConversao, materialNome);
               
            }
        }
    });
    
    // Função para vincular material no backend
    function vincularMaterialNoBackend(itemId, materialId, fatorConversao, materialNome) {
        // Limpar itemId de espaços e caracteres extras
        itemId = String(itemId).trim();
        materialId = String(materialId).trim();
        
        mostrarCarregando('Vinculando material...');
        
        const csrfToken = $('input[name="csrf_token"]').val();
        const formData = new FormData();
        formData.append('material_id', materialId);
        if (fatorConversao) {
            formData.append('fator_conversao', String(fatorConversao).trim());
        }
        
        fetch(`/notas-fiscais/api/vincular-material/${itemId}`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken
            },
            body: formData
        })
        .then(async response => {
            // Tentar obter a mensagem de erro do servidor
            const responseData = await response.json().catch(e => {
                console.error('Erro ao fazer parse do JSON:', e);
                return { success: false, message: 'Resposta inválida do servidor' };
            });
            
            if (!response.ok) {
                // Se houver uma mensagem de erro no JSON, usar ela
                const errorMessage = responseData.message || `Erro de rede: ${response.status}`;
                throw new Error(errorMessage);
            }
            
            return responseData;
        })
        .then(data => {
            if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                Swal.close();
            }
            
            if (data.success) {
                // Atualizar interface
                const materialNomeElemento = document.getElementById(`material_nome_${itemId}`);
                if (materialNomeElemento) materialNomeElemento.textContent = materialNome;
                
                // Atualizar fator de conversão na tabela
                const linhaItem = document.querySelector(`#tabelaItensImportacao tr[id="item_${itemId}"]`);
                if (linhaItem) {
                    const campoFatorConversao = document.getElementById(`fator_conversao_${itemId}`);
                    if (campoFatorConversao) {
                        campoFatorConversao.value = fatorConversao || 1;
                    }
                    // A coluna "Fator de Conversão" é a 7ª coluna (índice 6)
                    const celulaFatorConversao = linhaItem.cells[6];
                    if (celulaFatorConversao) {
                        const fatorNum = parseFloat(fatorConversao || 1);
                        if (!isNaN(fatorNum) && fatorNum > 0) {
                            const fatorFormatado = fatorNum.toLocaleString('pt-BR', {
                                minimumFractionDigits: 4,
                                maximumFractionDigits: 4
                            });
                            celulaFatorConversao.textContent = fatorFormatado;
                        }
                    }
                }
                
                // Recarregar itens da nota para atualizar a interface
                const notaId = document.getElementById('importacao_nf_id').value;
                if (notaId) {
                    carregarItensImportacao(notaId);
                }
                
                mostrarAlerta('Sucesso', data.message || `Material "${materialNome}" vinculado com sucesso!`, 'success');
            } else {
                mostrarAlerta('Erro', data.message || 'Erro ao vincular material.', 'error');
            }
        })
        .catch(error => {
            if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                Swal.close();
            }
            console.error('Erro ao vincular material:', error);
            mostrarAlerta('Erro', `Ocorreu um erro ao vincular o material: ${error.message}`, 'error');
        });
    }
    function buscarMateriais(termo) {
        const corpoTabela = document.getElementById('corpoTabelaMateriais');
        if (!corpoTabela) return;

        // Adiciona um feedback de carregamento
        corpoTabela.innerHTML = '<tr><td colspan="4" class="text-center">Buscando...</td></tr>';

        fetch(`/notas-fiscais/api/materiais?termo=${encodeURIComponent(termo)}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erro na requisição: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                corpoTabela.innerHTML = ''; // Limpa a tabela
                if (data.success && data.materiais.length > 0) {
                    data.materiais.forEach(material => {
                        const row = corpoTabela.insertRow();
                        row.innerHTML = `
                            <td>${material.codigo || ''}</td>
                            <td>${material.nome || material.descricao || ''}</td>
                            <td>${material.unidade || '-'}</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-primary btn-selecionar-material"
                                        data-material-id="${material.id}"
                                        data-material-nome="${material.nome || material.descricao}"
                                        data-material-unidade="${material.unidade || ''}">
                                    <i class="fas fa-check"></i>
                                </button>
                            </td>
                        `;
                    });
                } else {
                    corpoTabela.innerHTML = '<tr><td colspan="4" class="text-center">Nenhum material encontrado.</td></tr>';
                }
            })
            .catch(error => {
                console.error('Erro ao buscar materiais:', error);
                corpoTabela.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Erro ao carregar materiais.</td></tr>';
            });
    }
   
                

    // ===== MODAL DE CONVERSÃO DE UNIDADES =====
    // Abrir modal de conversão de unidades
    

    // Aplicar conversão de unidades
    
    });
</script>
{% endblock %}
