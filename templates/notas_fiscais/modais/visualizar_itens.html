<!-- Modal de Visualização de Itens -->
<div class="modal fade" id="modalVisualizarItens" tabindex="-1" aria-labelledby="modalVisualizarItensLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalVisualizarItensLabel">Itens da Nota Fiscal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <!-- Campo de filtro para busca por nome do item -->
                <div class="row mb-3">
                    <div class="col-md-12">
                        <div class="input-group">
                            <input type="text" class="form-control" id="filtroItensNota" placeholder="Filtrar por nome do item...">
                            <button class="btn btn-outline-primary" type="button" id="btnFiltrarItens">
                                <i class="fas fa-search"></i> Filtrar
                            </button>
                            <button class="btn btn-outline-secondary" type="button" id="btnLimparFiltroItens">
                                <i class="fas fa-times"></i> Limpar
                            </button>
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered" id="tabelaItens">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>CFOP</th>
                                <th>Descrição</th>
                                <th>Quantidade</th>
                                <th>Unidade</th>
                                <th>Valor Unit.</th>
                                <th>Valor Total</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaItens">
                            <!-- Será preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="btnImportarPendentesComMaterial" class="btn btn-success btn-importar-pendentes-auto" style="display: none;">
                    <i class="fas fa-file-import"></i> Importar Pendentes com Material (<span id="contadorPendentesVisualizacao">0</span>)
                </button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div> 
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Função para obter token CSRF
    function getCSRFToken() {
        const tokenGlobal = document.getElementById('csrf_token_global');
        if (tokenGlobal) {
            return tokenGlobal.value;
        }
        const tokenField = document.querySelector('input[name="csrf_token"]');
        if (tokenField) {
            return tokenField.value;
        }
        return '';
    }
    
    $("#tabelaNotasFiscaisContainer").on('click', '.visualizar-itens', function() {
        console.log('visualizar itens clicado');
        const notaId = $(this).data('id');
        carregarItensModal(notaId);
    });
    function carregarItensModal(notaId) {
        console.log(`Carregando itens para nota ID: ${notaId}`);
        
        // Armazenar notaId para uso posterior
        window.notaIdAtual = notaId;
        
        // Mostrar carregamento
        const corpoTabela = 'corpoTabelaItens'
        document.getElementById(corpoTabela).innerHTML = '<tr><td colspan="9" class="text-center">Carregando itens...</td></tr>';
        
        // Abrir o modal
        const modalId = 'modalVisualizarItens';
        const modal = new bootstrap.Modal(document.getElementById(modalId));
        modal.show();
        const url = `/notas-fiscais/api/itens/${notaId}`;
        fetch(url)
            .then(response => {
                console.log(`Resposta para ${url}:`, response.status);
                if (!response.ok) {
                    // Se esta URL falhou, tente a próxima
                    throw new Error(`Erro de rede: ${response.status}`);
                }
                return response.json().catch(e => {
                    console.error('Erro ao analisar JSON:', e);
                    throw new Error('Resposta inválida do servidor');
                });
            })
            .then(data => {
                console.log('Dados recebidos:', data);
                if (data.success) {
                    preencherTabelaVisualizacao(data.itens);
                    // Registrar URL bem-sucedida para uso futuro
                    console.log(`URL bem-sucedida: ${url}`);
                } else {
                    document.getElementById(corpoTabela).innerHTML = `<tr><td colspan="9" class="text-center text-danger">${data.message || 'Erro ao carregar itens.'}</td></tr>`;
                    atualizarContadorPendentesVisualizacao(0);
                }
            })
            .catch(error => {
                console.warn(`Falha ao usar ${url}:`, error);
                document.getElementById(corpoTabela).innerHTML = `<tr><td colspan="9" class="text-center text-danger">${error.message || 'Erro ao carregar itens.'}</td></tr>`;
                atualizarContadorPendentesVisualizacao(0);
            });
    }

    // Preenche a tabela de visualização de itens
    function preencherTabelaVisualizacao(itens) {
        if (!itens || itens.length === 0) {
            document.getElementById('corpoTabelaItens').innerHTML = '<tr><td colspan="9" class="text-center">Nenhum item encontrado.</td></tr>';
            atualizarContadorPendentesVisualizacao(0);
            return;
        }
        
        // Armazenar todos os itens em uma variável global para uso no filtro
        window.todosOsItensNota = itens;
        
        renderizarItensVisualizacao(itens);
        
        // Configurar eventos de filtro
        configurarFiltroItens();
        
        // Atualizar contador de pendentes
        atualizarContadorPendentesVisualizacao(itens);
    }
    
    // Função para renderizar os itens na tabela de visualização
    function renderizarItensVisualizacao(itens) {
        let html = '';
        
        itens.forEach(function(item) {
            const valorUnitario = parseFloat(item.valor_unitario).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const valorTotal = parseFloat(item.valor_total).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            
            let status = '';
            if (item.importado_estoque) {
                status = '<span class="badge bg-success">Importado</span>';
            } else if (item.material_id) {
                status = '<span class="badge bg-warning">Vinculado</span>';
            } else {
                status = '<span class="badge bg-danger">Pendente</span>';
            }
            
            // Botões de ação por item
            let acoes = '';
            if (!item.material_id) {
                // Se não tem material vinculado, mostrar botão para criar material
                acoes = `<button class="btn btn-sm btn-primary criar-material-btn" data-item-id="${item.id}" data-item-codigo="${item.codigo || ''}" data-item-descricao="${item.descricao || ''}" data-item-unidade="${item.unidade || ''}" data-item-ncm="${item.ncm || ''}" title="Criar material a partir deste item">
                    <i class="fas fa-plus-circle"></i> Criar Material
                </button>`;
            } else if (!item.importado_estoque) {
                // Se tem material vinculado mas não está importado, mostrar botão para importar
                acoes = `<button class="btn btn-sm btn-success importar-item-btn" data-item-id="${item.id}" data-item-descricao="${item.descricao || ''}" title="Importar este item para o estoque">
                    <i class="fas fa-file-import"></i> Importar
                </button>`;
            } else {
                // Se já está importado, não mostrar ação
                acoes = '<span class="text-muted">-</span>';
            }
            
            html += `
                <tr>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.cfop || '-'}</td>
                    <td>${item.descricao}</td>
                    <td>${item.quantidade}</td>
                    <td>${item.unidade}</td>
                    <td>R$ ${valorUnitario}</td>
                    <td>R$ ${valorTotal}</td>
                    <td>${status}</td>
                    <td>${acoes}</td>
                </tr>
            `;
        });
        
        document.getElementById('corpoTabelaItens').innerHTML = html;
        
        // Atualizar contador após renderizar
        atualizarContadorPendentesVisualizacao(itens);
        
        // Adicionar event listeners aos botões de criar material
        document.querySelectorAll('.criar-material-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const itemId = this.getAttribute('data-item-id');
                const itemCodigo = this.getAttribute('data-item-codigo');
                const itemDescricao = this.getAttribute('data-item-descricao');
                const itemUnidade = this.getAttribute('data-item-unidade');
                const itemNcm = this.getAttribute('data-item-ncm');
                
                criarMaterialDoItem({
                    id: itemId,
                    codigo: itemCodigo,
                    descricao: itemDescricao,
                    unidade: itemUnidade,
                    ncm: itemNcm
                });
            });
        });
        
        // Adicionar event listeners aos botões de importar item individual
        document.querySelectorAll('.importar-item-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const itemId = this.getAttribute('data-item-id');
                const itemDescricao = this.getAttribute('data-item-descricao');
                importarItemIndividual(itemId, itemDescricao);
            });
        });
    }
    function configurarFiltroItens() {
        const btnFiltrar = document.getElementById('btnFiltrarItens');
        const btnLimpar = document.getElementById('btnLimparFiltroItens');
        const inputFiltro = document.getElementById('filtroItensNota');
        
        // Evento de clique no botão de filtrar
        if (btnFiltrar) {
            btnFiltrar.addEventListener('click', function() {
                aplicarFiltroItens();
            });
        }
        
        // Evento de clique no botão de limpar filtro
        if (btnLimpar) {
            btnLimpar.addEventListener('click', function() {
                inputFiltro.value = '';
                renderizarItensVisualizacao(window.todosOsItensNota);
            });
        }
        
        // Evento de pressionar Enter no campo de filtro
        if (inputFiltro) {
            inputFiltro.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    aplicarFiltroItens();
                }
            });
        }
    }
    
    // Aplicar filtro aos itens da nota
    function aplicarFiltroItens() {
        const filtro = document.getElementById('filtroItensNota').value.toLowerCase().trim();
        
        if (!filtro) {
            renderizarItensVisualizacao(window.todosOsItensNota);
            return;
        }
        
        // Filtrar os itens pelo texto de busca
        const itensFiltrados = window.todosOsItensNota.filter(function(item) {
            // Buscar no código e na descrição do item
            return (
                (item.codigo && item.codigo.toLowerCase().includes(filtro)) || 
                (item.descricao && item.descricao.toLowerCase().includes(filtro))
            );
        });
        
        if (itensFiltrados.length === 0) {
            document.getElementById('corpoTabelaItens').innerHTML = 
                `<tr><td colspan="9" class="text-center">Nenhum item encontrado com o termo "${filtro}".</td></tr>`;
            atualizarContadorPendentesVisualizacao(0);
        } else {
            renderizarItensVisualizacao(itensFiltrados);
        }
    }
    
    // Função para atualizar o contador de itens pendentes na visualização
    function atualizarContadorPendentesVisualizacao(itens) {
        const contadorElement = document.getElementById('contadorPendentesVisualizacao');
        const btnElement = document.getElementById('btnImportarPendentesComMaterial');
        
        if (!contadorElement || !btnElement) return;
        
        // Se recebeu um número diretamente (quando não há itens)
        if (typeof itens === 'number') {
            contadorElement.textContent = itens.toString();
            btnElement.style.display = itens > 0 ? 'inline-block' : 'none';
            return;
        }
        
        if (!itens || itens.length === 0) {
            contadorElement.textContent = '0';
            btnElement.style.display = 'none';
            return;
        }
        
        // Contar itens pendentes: não importados E que já têm material vinculado
        const pendentes = itens.filter(function(item) {
            return !item.importado_estoque && item.material_id;
        });
        
        contadorElement.textContent = pendentes.length.toString();
        btnElement.style.display = pendentes.length > 0 ? 'inline-block' : 'none';
    }
    
    // Função para importar um item individual
    function importarItemIndividual(itemId, itemDescricao) {
        if (!itemId) {
            if (typeof mostrarAlerta === 'function') {
                mostrarAlerta('Erro', 'ID do item não encontrado.', 'error');
            } else {
                alert('ID do item não encontrado.');
            }
            return;
        }
        
        // Centro de custo agora é opcional
        const centroCustoId = prompt(`Digite o ID do Centro de Custo para importar o item (opcional):\n"${itemDescricao}"`);
        
        const observacao = prompt('Observação (opcional):') || '';
        
        const mensagemConfirmacao = centroCustoId && centroCustoId.trim() !== '' 
            ? `Deseja importar o item "${itemDescricao}" para o estoque?\n\nCentro de Custo: ${centroCustoId}`
            : `Deseja importar o item "${itemDescricao}" para o estoque?`;
        
        if (!confirm(mensagemConfirmacao)) {
            return;
        }
        
        if (typeof mostrarCarregando === 'function') {
            mostrarCarregando('Importando item para o estoque...');
        }
        
        // Obter token CSRF
        const csrfToken = getCSRFToken();
        
        // Preparar parâmetros (centro_custo_id só se fornecido)
        const params = new URLSearchParams();
        if (centroCustoId && centroCustoId.trim() !== '') {
            params.append('centro_custo_id', centroCustoId.trim());
        }
        if (observacao && observacao.trim() !== '') {
            params.append('observacao', observacao.trim());
        }
        
        fetch(`/notas-fiscais/api/importar-item-estoque/${itemId}`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: params
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`Erro de rede: ${response.status}`);
            }
            return response.json().catch(e => {
                console.error('Erro ao fazer parse do JSON:', e);
                throw new Error('Resposta inválida do servidor: não é um JSON válido');
            });
        })
        .then(data => {
            if (data.success) {
                if (typeof mostrarAlerta === 'function') {
                    mostrarAlerta('Sucesso', data.message || 'Item importado com sucesso!', 'success', function() {
                        // Recarregar os itens da nota para atualizar a interface
                        const notaId = window.notaIdAtual;
                        if (notaId) {
                            carregarItensModal(notaId);
                        }
                        // Recarregar a tabela de notas fiscais se a função existir
                        if (typeof carregarTabelaNotasFiscais === 'function') {
                            const params = $('#filtrosNotasFiscais').serialize();
                            carregarTabelaNotasFiscais(params);
                            if (typeof carregarTotalNotas === 'function') {
                                carregarTotalNotas(params);
                            }
                        }
                    });
                } else {
                    alert('Sucesso: Item importado com sucesso!');
                    const notaId = window.notaIdAtual;
                    if (notaId) {
                        carregarItensModal(notaId);
                    }
                }
            } else {
                if (typeof mostrarAlerta === 'function') {
                    mostrarAlerta('Erro', data.message || 'Erro ao importar item.', 'error');
                } else {
                    alert('Erro: ' + (data.message || 'Erro ao importar item.'));
                }
            }
        })
        .catch(error => {
            console.error('Erro ao importar item:', error);
            if (typeof mostrarAlerta === 'function') {
                mostrarAlerta('Erro', `Ocorreu um erro ao processar: ${error.message}`, 'error');
            } else {
                alert('Erro ao importar: ' + error.message);
            }
        })
        .finally(() => {
            if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                Swal.close();
            }
        });
    }
    
    // Função para importar itens pendentes que já têm material vinculado
    function importarPendentesComMaterial() {
        const notaId = window.notaIdAtual;
        
        if (!notaId) {
            if (typeof mostrarAlerta === 'function') {
                mostrarAlerta('Erro', 'ID da nota fiscal não encontrado.', 'error');
            } else {
                alert('ID da nota fiscal não encontrado.');
            }
            return;
        }
        
        // Centro de custo agora é opcional
        const centroCustoId = prompt('Digite o ID do Centro de Custo para importação (opcional):');
        
        const observacao = prompt('Observação (opcional):') || '';
        
        const mensagemConfirmacao = centroCustoId && centroCustoId.trim() !== ''
            ? `Deseja importar os itens pendentes que já têm material vinculado para o estoque?\n\nCentro de Custo: ${centroCustoId}`
            : `Deseja importar os itens pendentes que já têm material vinculado para o estoque?`;
        
        if (!confirm(mensagemConfirmacao)) {
            return;
        }
        
        if (typeof mostrarCarregando === 'function') {
            mostrarCarregando('Importando itens pendentes com material vinculado...');
        }
        
        // Obter token CSRF
        const csrfToken = getCSRFToken();
        
        // Preparar dados (centro_custo_id só se fornecido)
        const requestData = {
            nf_id: notaId,
            observacao: observacao.trim() || null
        };
        if (centroCustoId && centroCustoId.trim() !== '') {
            requestData.centro_custo_id = centroCustoId.trim();
        }
        
        fetch('/notas-fiscais/api/importar-pendentes-com-material', {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestData)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`Erro de rede: ${response.status}`);
            }
            return response.json().catch(e => {
                console.error('Erro ao fazer parse do JSON:', e);
                throw new Error('Resposta inválida do servidor: não é um JSON válido');
            });
        })
        .then(data => {
            if (data.success) {
                if (typeof mostrarAlerta === 'function') {
                    mostrarAlerta('Sucesso', data.message, 'success', function() {
                        // Recarregar os itens da nota para atualizar a interface
                        carregarItensModal(notaId);
                        // Recarregar a tabela de notas fiscais se a função existir
                        if (typeof carregarTabelaNotasFiscais === 'function') {
                            const params = $('#filtrosNotasFiscais').serialize();
                            carregarTabelaNotasFiscais(params);
                            if (typeof carregarTotalNotas === 'function') {
                                carregarTotalNotas(params);
                            }
                        }
                    });
                } else {
                    alert('Sucesso: ' + data.message);
                    carregarItensModal(notaId);
                }
            } else {
                if (typeof mostrarAlerta === 'function') {
                    mostrarAlerta('Erro', data.message, 'error');
                } else {
                    alert('Erro: ' + data.message);
                }
            }
        })
        .catch(error => {
            console.error('Erro ao importar pendentes:', error);
            if (typeof mostrarAlerta === 'function') {
                mostrarAlerta('Erro', `Ocorreu um erro ao processar: ${error.message}`, 'error');
            } else {
                alert('Erro ao importar: ' + error.message);
            }
        })
        .finally(() => {
            if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                Swal.close();
            }
        });
    }
    
    // Event listener para o botão de importar pendentes
    $(document).on('click', '#btnImportarPendentesComMaterial', function(e) {
        e.preventDefault();
        importarPendentesComMaterial();
    });
    
    // Função para criar material a partir do item da nota fiscal
    function criarMaterialDoItem(item) {
        // Primeiro, buscar materiais semelhantes
        buscarMateriaisSemelhantes(item).then(function(materiaisSemelhantes) {
            mostrarModalCriarMaterial(item, materiaisSemelhantes);
        }).catch(function(error) {
            console.error('Erro ao buscar materiais semelhantes:', error);
            // Mesmo com erro, mostrar modal para criar novo
            mostrarModalCriarMaterial(item, []);
        });
    }
    
    // Função para buscar materiais semelhantes
    function buscarMateriaisSemelhantes(item) {
        return new Promise(function(resolve, reject) {
            const params = new URLSearchParams();
            if (item.codigo) params.append('codigo', item.codigo);
            if (item.descricao) params.append('descricao', item.descricao);
            if (item.ncm) params.append('ncm', item.ncm);
            
            fetch(`/materiais/api/buscar-semelhantes?${params.toString()}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        resolve(data.materiais || []);
                    } else {
                        resolve([]);
                    }
                })
                .catch(error => {
                    reject(error);
                });
        });
    }
    
    // Função para mostrar modal de criar material
    function mostrarModalCriarMaterial(item, materiaisSemelhantes) {
        // Buscar categorias disponíveis
        const categorias = ['Matéria-prima', 'Insumo', 'Ferramenta', 'Equipamento', 'Material de Escritório', 'Serviço', 'EPI', 'Outro'];
        
        // HTML para materiais semelhantes
        let htmlMateriaisSemelhantes = '';
        if (materiaisSemelhantes && materiaisSemelhantes.length > 0) {
            htmlMateriaisSemelhantes = `
                <div class="alert alert-info mb-3">
                    <h6><i class="fas fa-info-circle"></i> Materiais Semelhantes Encontrados</h6>
                    <p class="mb-2">Foram encontrados ${materiaisSemelhantes.length} material(is) semelhante(s). Você pode selecionar um existente ou criar um novo.</p>
                </div>
                <div class="list-group mb-3" id="listaMateriaisSemelhantes">
            `;
            
            materiaisSemelhantes.forEach(function(mat, index) {
                const unidade = mat.unidade || 'Não informado';
                const ncm = mat.ncm || 'Não informado';
                const categoria = mat.categoria || 'Não informado';
                
                htmlMateriaisSemelhantes += `
                    <div class="list-group-item">
                        <div class="d-flex w-100 justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <h6 class="mb-1">${mat.nome || 'Sem nome'}</h6>
                                <p class="mb-1">
                                    <small><strong>Código:</strong> ${mat.codigo || 'Não informado'} | 
                                    <strong>NCM:</strong> ${ncm} | 
                                    <strong>Categoria:</strong> ${categoria} | 
                                    <strong>Unidade:</strong> ${unidade}</small>
                                </p>
                                ${mat.descricao ? `<p class="mb-1 text-muted"><small>${mat.descricao}</small></p>` : ''}
                                <small class="text-muted"><i class="fas fa-star"></i> ${mat.motivo} (Pontuação: ${mat.pontuacao})</small>
                            </div>
                            <button class="btn btn-sm btn-success ms-2 usar-material-existente" 
                                    data-material-id="${mat.id}" 
                                    data-material-nome="${mat.nome}"
                                    title="Usar este material">
                                <i class="fas fa-check"></i> Usar Este
                            </button>
                        </div>
                    </div>
                `;
            });
            
            htmlMateriaisSemelhantes += `
                </div>
                <div class="text-center mb-3">
                    <hr>
                    <p class="text-muted">ou</p>
                </div>
            `;
        }
        
        // Criar modal de confirmação com formulário
        const modalHtml = `
            <div class="modal fade" id="modalCriarMaterial" tabindex="-1" aria-labelledby="modalCriarMaterialLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header bg-primary text-white">
                            <h5 class="modal-title" id="modalCriarMaterialLabel">
                                <i class="fas fa-plus-circle"></i> Criar Material
                            </h5>
                            <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Fechar"></button>
                        </div>
                        <div class="modal-body">
                            ${htmlMateriaisSemelhantes}
                            <div id="formularioCriarMaterial">
                            <form id="formCriarMaterial">
                                <div class="mb-3">
                                    <label for="materialCodigo" class="form-label">Código</label>
                                    <input type="text" class="form-control" id="materialCodigo" name="codigo" value="${item.codigo || ''}">
                                </div>
                                <div class="mb-3">
                                    <label for="materialNome" class="form-label">Nome <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="materialNome" name="nome" value="${item.descricao || ''}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="materialDescricao" class="form-label">Descrição</label>
                                    <textarea class="form-control" id="materialDescricao" name="descricao" rows="2">${item.descricao || ''}</textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="materialCategoria" class="form-label">Categoria <span class="text-danger">*</span></label>
                                    <select class="form-select" id="materialCategoria" name="categoria" required>
                                        <option value="">Selecione uma categoria</option>
                                        ${categorias.map(cat => `<option value="${cat}">${cat}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="materialUnidade" class="form-label">Unidade</label>
                                    <input type="text" class="form-control" id="materialUnidade" name="unidade_nome" value="${item.unidade || ''}" placeholder="Ex: UN, KG, M">
                                </div>
                                <div class="mb-3">
                                    <label for="materialNCM" class="form-label">NCM</label>
                                    <input type="text" class="form-control" id="materialNCM" name="ncm" value="${item.ncm || ''}" maxlength="15">
                                </div>
                                <input type="hidden" id="itemIdOriginal" value="${item.id}">
                            </form>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" id="btnConfirmarCriarMaterial">
                                <i class="fas fa-save"></i> Criar Material
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        // Remover modal anterior se existir
        const modalExistente = document.getElementById('modalCriarMaterial');
        if (modalExistente) {
            modalExistente.remove();
        }
        
        // Adicionar modal ao body
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        // Mostrar modal
        const modal = new bootstrap.Modal(document.getElementById('modalCriarMaterial'));
        modal.show();
        
        // Event listeners para botões "Usar Este" dos materiais semelhantes
        document.querySelectorAll('.usar-material-existente').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const materialId = this.getAttribute('data-material-id');
                const materialNome = this.getAttribute('data-material-nome');
                const itemId = item.id;
                
                // Desabilitar botão durante processamento
                this.disabled = true;
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Vinculando...';
                
                // Vincular material ao item
                const formData = new FormData();
                formData.append('material_id', materialId);
                formData.append('csrf_token', getCSRFToken());
                
                fetch(`/notas-fiscais/api/vincular-material/${itemId}`, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(`Material "${materialNome}" vinculado com sucesso ao item!`);
                        modal.hide();
                        
                        // Recarregar itens para atualizar a tabela
                        const notaId = window.notaIdAtual || null;
                        if (notaId) {
                            carregarItensModal(notaId);
                        }
                    } else {
                        alert(`Erro ao vincular material: ${data.message}`);
                        this.disabled = false;
                        this.innerHTML = '<i class="fas fa-check"></i> Usar Este';
                    }
                })
                .catch(error => {
                    console.error('Erro ao vincular material:', error);
                    alert('Erro ao vincular material. Por favor, tente novamente.');
                    this.disabled = false;
                    this.innerHTML = '<i class="fas fa-check"></i> Usar Este';
                });
            });
        });
        
        // Event listener para o botão de confirmar
        document.getElementById('btnConfirmarCriarMaterial').addEventListener('click', function() {
            const form = document.getElementById('formCriarMaterial');
            const formData = new FormData(form);
            
            // Validar campos obrigatórios
            const nome = formData.get('nome');
            const categoria = formData.get('categoria');
            
            if (!nome || !categoria) {
                alert('Por favor, preencha todos os campos obrigatórios (Nome e Categoria).');
                return;
            }
            
            // Preparar dados para envio
            const dadosMaterial = {
                codigo: formData.get('codigo') || null,
                nome: nome,
                descricao: formData.get('descricao') || '',
                categoria: categoria,
                unidade_nome: formData.get('unidade_nome') || '',
                ncm: formData.get('ncm') || null
            };
            
            // Desabilitar botão durante o processamento
            const btnConfirmar = document.getElementById('btnConfirmarCriarMaterial');
            btnConfirmar.disabled = true;
            btnConfirmar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando...';
            
            // Fazer requisição para criar material
            fetch('/materiais/api/criar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify(dadosMaterial)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`Material "${data.material.nome}" criado com sucesso!`);
                    modal.hide();
                    
                    // Recarregar itens para atualizar a tabela
                    const notaId = window.notaIdAtual || null;
                    if (notaId) {
                        carregarItensModal(notaId);
                    }
                } else {
                    alert(`Erro ao criar material: ${data.message}`);
                    btnConfirmar.disabled = false;
                    btnConfirmar.innerHTML = '<i class="fas fa-save"></i> Criar Material';
                }
            })
            .catch(error => {
                console.error('Erro ao criar material:', error);
                alert('Erro ao criar material. Por favor, tente novamente.');
                btnConfirmar.disabled = false;
                btnConfirmar.innerHTML = '<i class="fas fa-save"></i> Criar Material';
            });
        });
        
        // Limpar modal quando fechar
        document.getElementById('modalCriarMaterial').addEventListener('hidden.bs.modal', function() {
            this.remove();
        });
    }
});
</script>
{% endblock %}
