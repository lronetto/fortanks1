<!-- Modal para Conversão de Unidades -->
<div class="modal fade" id="modalConversaoUnidades" tabindex="-1" aria-labelledby="modalConversaoUnidadesLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalConversaoUnidadesLabel">Conversão de Unidades</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle"></i> A unidade do item da nota fiscal (<strong id="unidadeNota"></strong>) 
                    é diferente da unidade do material no sistema (<strong id="unidadeMaterial"></strong>).
                </div>
                
                <form id="formConversao">
                    <input type="hidden" id="conversao_item_id" name="item_id">
                    <input type="hidden" id="conversao_material_id" name="material_id">
                    <input type="hidden" id="conversao_quantidade" name="quantidade">
                    <div class="form-group mb-3">
                        <label for="fator_conversao">Fator de Conversão</label>
                        <div class="input-group">
                            <input type="number" id="fator_conversao" name="fator_conversao" 
                                   class="form-control" step="0.0001" min="0.0001" required>
                            <span class="input-group-text" id="unidadeNovaDesc"></span>
                        </div>
                        <small class="form-text text-muted">
                            Exemplo: Se 1 <span id="unidadeOrigemEx"></span> equivale a 1000 <span id="unidadeDestinoEx"></span>, digite 1000.
                        </small>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="fator_conversao_resultado">Fator de Conversão Resultado</label>
                        <div class="input-group">
                            <input type="number" id="fator_conversao_resultado" name="fator_conversao_resultado">
                            <span class="input-group-text" id="unidadeNovaDesc"></span>
                        </div>
                        <small class="form-text text-muted">
                            <div id="exemplo_texto_resultado"></div>
                        </small>
                    </div>
                    <div class="form-group">
                        <label for="unidade_conversao_id">Usar Conversão Existente</label>
                        <select id="unidade_conversao_id" name="unidade_conversao_id" class="form-control">
                            <option value="">Selecione uma conversão existente</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="btnAplicarConversao" class="btn btn-primary">Aplicar Conversão</button>
            </div>
        </div>
    </div>
</div> 
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOMContentLoaded');
        console.log('fator_conversao');
        console.log('fator_conversao_resultado');
        $('#btnAplicarConversao').on('click', function() {
            const itemId = document.getElementById('conversao_item_id').value;
            const materialId = document.getElementById('conversao_material_id').value;
            const unidadeConversaoId = document.getElementById('unidade_conversao_id').value;
            const fatorConversao = document.getElementById('fator_conversao').value;

            if (!unidadeConversaoId && (!fatorConversao || fatorConversao <= 0)) {
                mostrarAlerta('Erro', 'Informe um fator de conversão válido ou selecione uma conversão existente.', 'error');
                return;
            }
            fetch('/notas-fiscais/api/aplicar_conversao', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': $('input[name="csrf_token"]').val(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    item_id: itemId,
                    material_id: materialId,
                    unidade_conversao_id: unidadeConversaoId,
                    fator_conversao: fatorConversao
                })
            })
            .then(response => {
                //console.log('response', response);
                if (!response.ok) {
                    throw new Error(`Erro de rede: ${response.status}`);
                }
                return response.json().catch(e => {
                    console.error('Erro ao fazer parse do JSON:', e);
                    throw new Error('Resposta inválida do servidor: não é um JSON válido');
                });
            })
            .then(data => {
                if (data.success) {
                    const modalConversao = bootstrap.Modal.getInstance(document.getElementById('modalConversaoUnidades'));
                    if (modalConversao) modalConversao.hide();
                    mostrarAlerta('Sucesso', 'Conversão aplicada com sucesso.', 'success');
                } else {
                    mostrarAlerta('Erro', data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Erro ao aplicar conversão:', error);
                mostrarAlerta('Erro', `Ocorreu um erro ao aplicar a conversão: ${error.message}`, 'error');
            })
            .finally(() => {
                if (typeof Swal !== 'undefined') {
                    Swal.close();
                }
            });
        });
    
    
        $('#fator_conversao').on('input', function() {
            console.log('fator_conversao input');
            const quantidade = $('#conversao_quantidade').val();
            console.log('quantidade', quantidade);
            const fatorConversao = $(this).val();
            const fatorConversaoResultado = fatorConversao * quantidade;
            console.log('fatorConversaoResultado', fatorConversaoResultado);
            $('#resultado_conversao').val(fatorConversaoResultado);
            $('#exemplo_texto_resultado').text('Exemplo: ' + fatorConversaoResultado + ' ' + $('#unidadeNovaDesc').text() + ' equivale a ' + quantidade + ' ' + $('#unidadeOrigemEx').text());
        });
        $('#fator_conversao_resultado').on('input', function() {
            console.log('fator_conversao_resultado input');
            const quantidade = $('#conversao_quantidade').val();
            console.log('quantidade', quantidade);
            const fatorConversaoResultado = $(this).val();
            const fatorConversao = fatorConversaoResultado / quantidade;
            console.log('fatorConversao', fatorConversao);
            $('#fator_conversao').val(fatorConversao);
            $('#exemplo_texto_resultado').text('Fator calculado: ' + fatorConversao + ' ' + $('#unidadeNovaDesc').text() + '/'+ $('#unidadeOrigemEx').text() );
        });
        
    });
    function abrirModalConversao(itemId, materialId, unidadeNota, unidadeMaterial) {
            console.log('abrir modal de conversão de unidades');
            document.getElementById('conversao_item_id').value = itemId;
            document.getElementById('conversao_material_id').value = materialId;
            console.log('conversao_item_id', itemId);
            const quantidade = document.getElementById('quantidade_para_vincular').value;
            console.log('quantidade', quantidade);
            document.getElementById('conversao_quantidade').value = quantidade;
            const unidadeNotaElemento = document.getElementById('unidadeNota');
            if (unidadeNotaElemento) unidadeNotaElemento.textContent = unidadeNota;
            console.log('unidadeNota', unidadeNota);
            const unidadeMaterialElemento = document.getElementById('unidadeMaterial');
            if (unidadeMaterialElemento) unidadeMaterialElemento.textContent = unidadeMaterial;
            console.log('unidadeMaterial', unidadeMaterial);
            const unidadeOrigemEx = document.getElementById('unidadeOrigemEx');
            if (unidadeOrigemEx) unidadeOrigemEx.textContent = unidadeNota;
            console.log('unidadeOrigemEx', unidadeNota);
            const unidadeDestinoEx = document.getElementById('unidadeDestinoEx');
            if (unidadeDestinoEx) unidadeDestinoEx.textContent = unidadeMaterial;
            console.log('unidadeDestinoEx', unidadeMaterial);
            const unidadeNovaDesc = document.getElementById('unidadeNovaDesc');
            if (unidadeNovaDesc) unidadeNovaDesc.textContent = unidadeMaterial;
            console.log('materialId', materialId);
            // Carregar conversões existentes
            //carregarConversoesMaterial(materialId);
            console.log('carregar conversões existentes');
            // Abrir modal usando Bootstrap 5
            const modal = new bootstrap.Modal(document.getElementById('modalConversaoUnidades'));
            modal.show();
        }
</script>
{% endblock %}
