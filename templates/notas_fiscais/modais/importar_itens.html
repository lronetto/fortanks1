<!-- Modal de Importação de Itens -->
<div class="modal fade" id="modalImportarItens" tabindex="-1" aria-labelledby="modalImportarItensLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalImportarItensLabel">Importar e Vincular Itens</h5>
                <button type="button" class="btn-close"  aria-label="Fechar"></button>
            </div>
            <form id="formImportacao">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="importacao_nf_id" name="nf_id">
                
                <div class="modal-body">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> Selecione os itens para importação e vincule-os aos materiais cadastrados no sistema.
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="observacao">Observação</label>
                        <textarea name="observacao" id="observacao" class="form-control" rows="2" 
                                  placeholder="Observação opcional"></textarea>
                    </div>
                    
                    <!-- Campo de filtro para busca por nome do item na importação -->
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <div class="input-group">
                                <input type="text" class="form-control" id="filtroItensImportacao" placeholder="Filtrar por nome do item...">
                                <button class="btn btn-outline-primary" type="button" id="btnFiltrarItensImportacao">
                                    <i class="fas fa-search"></i> Filtrar
                                </button>
                                <button class="btn btn-outline-secondary" type="button" id="btnLimparFiltroItensImportacao">
                                    <i class="fas fa-times"></i> Limpar
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-bordered" id="tabelaItensImportacao">
                            <thead>
                                <tr>
                                    <th width="40">
                                        <input type="checkbox" id="selecionarTodos">
                                    </th>
                                    <th>Código</th>
                                    <th>Descrição</th>
                                    <th>Unidade</th>
                                    <th>Quantidade</th>
                                    <th>Valor Unit.</th>
                                    <th>Fator de Conversão</th>
                                    <th>Material Vinculado</th>
                                    <th>Unidade do Material</th>
                                    <th width="120">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="corpoTabelaItensImportacao">
                                <!-- Será preenchido via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary btn-close">Fechar</button>
                    <button type="button" id="btnVincularEImportarAutomatico" class="btn btn-success btn-vincular-importar-auto">
                        <i class="fas fa-file-import"></i> Importar e Vincular Vinculados (<span id="contadorPendentes">0</span>)
                    </button>
                    <button type="button" id="btnImportar" class="btn btn-primary btn-importar-itens">
                        <i class="fas fa-file-import"></i> Importar Selecionados
                    </button>
                </div>
            </form>
        </div>
    </div>
</div> 
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        $('#tabelaItensImportacao tbody').on('click', '.btn-vincular-material', function(e) {
            e.preventDefault();
            console.log('vincular material clicado');
            let id = $(this).data('item-id');
            // Limpar id de espaços e caracteres extras
            id = String(id).trim();
            const quantidade = $(this).data('item-quantidade');
            const nomeMaterial = $(this).data('material-nome');
            const unidadeMaterial = $(this).data('material-unidade');
            const descricaoMaterial = $(this).data('item-descricao');
            document.getElementById('NomeMaterial').textContent = descricaoMaterial;
            console.log('vincular material id', id);
            document.getElementById('item_id_para_vincular').value = id;
            document.getElementById('quantidade_para_vincular').value = quantidade;
            const buscarMaterial = document.getElementById('buscarMaterial');
            buscarMaterial.value = '';
            buscarMaterial.focus();
            document.getElementById('corpoTabelaMateriais').innerHTML = '';
            const modal = new bootstrap.Modal(document.getElementById('modalSelecionarMaterial'));
            modal.show();
        });
        $("#tabelaNotasFiscaisContainer").on('click', '.importar-itens', function() {
            console.log('importar itens');
            const notaId = $(this).data('id');
            modal=new bootstrap.Modal(document.getElementById('modalImportarItens'));
            modal.show();
            document.getElementById('importacao_nf_id').value = notaId;
            
            // Carrega itens da nota para importação
            carregarItensImportacao(notaId);
        });
        $('#modalImportarItens').on('click', '.btn-importar-itens', function(e) {
            e.preventDefault();
            importarItens();
        });
        $('#modalImportarItens').on('click', '.btn-vincular-importar-auto', function(e) {
            e.preventDefault();
            vincularEImportarPendentes();
        });
        $('#modalImportarItens .btn-close').on('click', function () {
            fecharModal('#modalImportarItens');
        });

        $('#selecionarTodos').on('change', function() {
            const checkboxes = document.querySelectorAll('.item-checkbox');
            checkboxes.forEach(function(checkbox) {
                checkbox.checked = this.checked;
            });
        });

        // Evento para desvincular material
        $(document).on('click', '.btn-desvincular-material', function() {
            const itemId = $(this).data('item-id');
            desvincularMaterial(itemId);
        });
    });
    function carregarItensImportacao(notaId) {
        console.log(`Carregando itens para nota ID: ${notaId}`);
        
        // Mostrar carregamento
        const corpoTabela = 'corpoTabelaItensImportacao';
        document.getElementById(corpoTabela).innerHTML = '<tr><td colspan="7" class="text-center">Carregando itens...</td></tr>';
        
        // Abrir o modal
        const modalId = 'modalImportarItens';
        const modal = new bootstrap.Modal(document.getElementById(modalId));
        modal.show();
        
        const url = `/notas-fiscais/api/itens/${notaId}`;
                  
        fetch(url)
            .then(response => {
                console.log(`Resposta para ${url}:`, response.status);
                if (!response.ok) {
                    // Se esta URL falhou, tente a próxima
                    throw new Error(`Erro de rede: ${response.status}`);
                }
                return response.json().catch(e => {
                    console.error('Erro ao analisar JSON:', e);
                    throw new Error('Resposta inválida do servidor');
                });
            })
            .then(data => {
                console.log('Dados recebidos:', data);
                if (data.success) {
                    preencherTabelaImportacao(data.itens);
                    // Registrar URL bem-sucedida para uso futuro
                    console.log(`URL bem-sucedida: ${url}`);
                } else {
                    document.getElementById(corpoTabela).innerHTML = `<tr><td colspan="7" class="text-center text-danger">${data.message || 'Erro ao carregar itens.'}</td></tr>`;
                    atualizarContadorPendentes(0);
                }
            })
            .catch(error => {
                console.warn(`Falha ao usar ${url}:`, error);
                document.getElementById(corpoTabela).innerHTML = `<tr><td colspan="7" class="text-center text-danger">${error.message || 'Erro ao carregar itens.'}</td></tr>`;
                atualizarContadorPendentes(0);
            });
    }
    
    // Preenche a tabela de importação de itens
    function preencherTabelaImportacao(itens) {
        if (!itens || itens.length === 0) {
            document.getElementById('corpoTabelaItensImportacao').innerHTML = '<tr><td colspan="7" class="text-center">Nenhum item encontrado.</td></tr>';
            atualizarContadorPendentes(0);
            return;
        }
        
        // Armazenar todos os itens em uma variável global para uso no filtro
        window.todosOsItensImportacao = itens; // Filtrar para excluir itens já importados
        renderizarItensImportacao(window.todosOsItensImportacao);
        configurarFiltroItensImportacao();
        atualizarContadorPendentes(itens);
    }
    
    // Função para renderizar os itens na tabela de importação
    function renderizarItensImportacao(itens) {
        let html = '';
        let itemsParaMostrar = itens.length;
        
        if (itemsParaMostrar === 0) {
            html = '<tr><td colspan="7" class="text-center">Todos os itens já foram importados ou nenhum corresponde ao filtro.</td></tr>';
            document.getElementById('corpoTabelaItensImportacao').innerHTML = html;
            return;
        }
        
        itens.forEach(function(item) {
            const valorUnitario = parseFloat(item.valor_unitario).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            
            const materialNome = item.material_nome || 'Nenhum material vinculado';
            const btnClassVincular = item.material_id ? 'btn-warning' : 'btn-primary';
            const btnIconVincular = item.material_id ? '<i class="fas fa-edit"></i>' : '<i class="fas fa-link"></i>';
            
            html += `
                <tr id="item_${item.id}">
                    <td>
                        <input type="checkbox" class="item-checkbox" value="${item.id}" id="check_${item.id}">
                    </td>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.descricao}</td>
                    <td id="unidade_${item.id}">${item.unidade}</td>
                    <td id="quantidade">${item.quantidade}</td>
                    <td>R$ ${valorUnitario}</td>
                    <td>${item.fator_conversao_aplicado || '-'}</td>
                    <td id="material_nome_${item.id}">${materialNome}</td>
                    <td>${item.material_unidade || '-'}</td>
                    <td>`
            if(item.material_id === null) {
                html += `<button type="button" class="btn btn-sm btn-primary btn-vincular-material" 
                                data-item-id="${item.id}"
                                data-item-quantidade="${item.quantidade}"
                                data-item-descricao="${item.descricao}"
                                data-material-nome="${materialNome}"
                                data-material-unidade="${item.material_unidade}"
                                title="Vincular material">
                                <i class="fas fa-link"></i>
                            </button>
                            `;
                html += `
                        <button type="button" class="btn btn-sm btn-info btn-vincular-de-outras-notas" 
                                data-item-id="${item.id}"
                                data-item-codigo="${item.codigo || ''}"
                                data-item-descricao="${item.descricao || ''}"
                                data-item-unidade="${item.unidade || ''}"
                                title="Vincular material de outras notas fiscais">
                            <i class="fas fa-search"></i>
                        </button>`;
            }
            if(item.material_id !== null) {
                html += '<span class="badge bg-success">Vinculado</span>';
            } 
            if(item.importado_estoque === true) {
                html += '<span class="badge bg-success">Importado</span>';
            }
            // Se não tem material vinculado, adicionar botão para buscar material de outras notas
            if(!item.material_id) {
              
            }
            // Se tem material vinculado, adicionar botão de importar individual
            if(item.material_id) {
                html += `
                        <button type="button" class="btn btn-sm btn-success btn-importar-item-individual" 
                                data-item-id="${item.id}"
                                data-item-descricao="${item.descricao}"
                                data-material-id=""
                                data-material-vinc="false"
                                title="Importar este item para o estoque">
                            <i class="fas fa-file-import"></i>
                        </button>`;
                // Botão para importar todos os itens similares
                html += `
                        <button type="button" class="btn btn-sm btn-warning btn-importar-itens-similares" 
                                data-item-id="${item.id}"
                                data-item-codigo="${item.codigo || ''}"
                                data-item-descricao="${item.descricao || ''}"
                                title="Importar este item e todos os itens similares para o estoque">
                            <i class="fas fa-file-import"></i> Todos
                        </button>`;
                // Botão para vincular outros itens similares em todas as notas
                html += `
                        <button type="button" class="btn btn-sm btn-info btn-vincular-itens-similares" 
                                data-item-id="${item.id}"
                                data-item-codigo="${item.codigo || ''}"
                                data-item-descricao="${item.descricao || ''}"
                                data-material-id="${item.material_id}" 
                                data-material-vinc="false" 
                                data-fator-conversao="${item.fator_conversao_aplicado || ''}"
                                title="Vincular este material a outros itens similares em todas as notas fiscais">
                            <i class="fas fa-link"></i>
                        </button>`;
            }
            // Se tem material vinculado, adicionar botão de desvincular
            if(item.material_id) {
                html += `
                        <button type="button" class="btn btn-sm btn-danger btn-desvincular-material" 
                                data-item-id="${item.id}"
                                title="Desvincular material">
                            <i class="fas fa-unlink"></i>
                        </button>`;
            }
            html += `</div>`;
            html += `
                    </td>
                </tr>
            `;
        });
        
        document.getElementById('corpoTabelaItensImportacao').innerHTML = html;
        
        // Atualizar contador de pendentes após renderizar
        atualizarContadorPendentes(itens);
        
        // Adicionar event listeners aos botões de importar item individual
        document.querySelectorAll('.btn-importar-item-individual').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const itemId = this.getAttribute('data-item-id');
                const itemDescricao = this.getAttribute('data-item-descricao');
                importarItemIndividualImportacao(itemId, itemDescricao);
            });
        });
        
        // Adicionar event listeners aos botões de importar itens similares
        document.querySelectorAll('.btn-importar-itens-similares').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const itemId = this.getAttribute('data-item-id');
                const itemCodigo = this.getAttribute('data-item-codigo');
                const itemDescricao = this.getAttribute('data-item-descricao');
                importarItensSimilares(itemId, itemCodigo, itemDescricao);
            });
        });
        
        // Adicionar event listeners aos botões de vincular de outras notas
        document.querySelectorAll('.btn-vincular-de-outras-notas').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const itemId = this.getAttribute('data-item-id');
                const itemCodigo = this.getAttribute('data-item-codigo');
                const itemDescricao = this.getAttribute('data-item-descricao');
                const itemUnidade = this.getAttribute('data-item-unidade');
                buscarEVincularDeOutrasNotas(itemId, itemCodigo, itemDescricao, itemUnidade);
            });
        });
        
        // Adicionar event listeners aos botões de vincular itens similares
        document.querySelectorAll('.btn-vincular-itens-similares').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const itemId = this.getAttribute('data-item-id');
                const itemCodigo = this.getAttribute('data-item-codigo');
                const itemDescricao = this.getAttribute('data-item-descricao');
                const materialId = this.getAttribute('data-material-id');
                const fatorConversao = this.getAttribute('data-fator-conversao');
                vincularItensSimilaresTodasNotas(itemId, itemCodigo, itemDescricao, materialId, fatorConversao);
            });
        });
    }
    
    // Configurar eventos para o filtro de itens de importação
    function configurarFiltroItensImportacao() {
        const btnFiltrar = document.getElementById('btnFiltrarItensImportacao');
        const btnLimpar = document.getElementById('btnLimparFiltroItensImportacao');
        const inputFiltro = document.getElementById('filtroItensImportacao');
        
        // Evento de clique no botão de filtrar
        if (btnFiltrar) {
            btnFiltrar.addEventListener('click', function() {
                aplicarFiltroItensImportacao();
            });
        }
        
        // Evento de clique no botão de limpar filtro
        if (btnLimpar) {
            btnLimpar.addEventListener('click', function() {
                inputFiltro.value = '';
                renderizarItensImportacao(window.todosOsItensImportacao);
            });
        }
        
        // Evento de pressionar Enter no campo de filtro
        if (inputFiltro) {
            inputFiltro.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    aplicarFiltroItensImportacao();
                }
            });
        }
    }
    
    // Aplicar filtro aos itens da importação
    function aplicarFiltroItensImportacao() {
        const filtro = document.getElementById('filtroItensImportacao').value.toLowerCase().trim();
        
        if (!filtro) {
            renderizarItensImportacao(window.todosOsItensImportacao);
            return;
        }
        
        // Filtrar os itens pelo texto de busca
        const itensFiltrados = window.todosOsItensImportacao.filter(function(item) {
            // Buscar no código e na descrição do item
            return (
                (item.codigo && item.codigo.toLowerCase().includes(filtro)) || 
                (item.descricao && item.descricao.toLowerCase().includes(filtro))
            );
        });
        
        renderizarItensImportacao(itensFiltrados);
    }

    // Função para atualizar o contador de itens pendentes
    function atualizarContadorPendentes(itens) {
        const contadorElement = document.getElementById('contadorPendentes');
        if (!contadorElement) return;
        
        // Se recebeu um número diretamente (quando não há itens)
        if (typeof itens === 'number') {
            contadorElement.textContent = itens.toString();
            return;
        }
        
        if (!itens || itens.length === 0) {
            contadorElement.textContent = '0';
            return;
        }
        
        // Contar itens pendentes: não importados E que já têm material vinculado
        const pendentes = itens.filter(function(item) {
            return !item.importado_estoque && item.material_id;
        });
        
        contadorElement.textContent = pendentes.length.toString();
    }

    // Função para importar itens pendentes que já têm material vinculado
    function vincularEImportarPendentes() {
        const notaId = document.getElementById('importacao_nf_id').value;
        const observacao = document.getElementById('observacao').value;
        
        // Validar notaId
        if (!notaId) {
            mostrarAlerta('Erro', 'ID da nota fiscal não encontrado. Por favor, recarregue a página e tente novamente.', 'error');
            return;
        }
        
        if (!confirm('Deseja importar e vincular os itens pendentes? Para cada item já vinculado, o sistema irá vincular itens similares em outras notas e importar todos para o estoque.')) {
            return;
        }
        
        mostrarCarregando('Vinculando itens similares e importando para o estoque...');
        
        const requestData = {
            nf_id: notaId,
            observacao: observacao || null
        };
        
        console.log('Enviando requisição para importar pendentes:', requestData);
        
        fetch('/notas-fiscais/api/importar-pendentes-com-material', {
            method: 'POST',
            headers: {
                'X-CSRFToken': $('input[name="csrf_token"]').val(),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestData)
        })
        .then(async response => {
            // Tentar obter a mensagem de erro do servidor
            const responseData = await response.json().catch(e => {
                console.error('Erro ao fazer parse do JSON:', e);
                return { success: false, message: 'Resposta inválida do servidor' };
            });
            
            if (!response.ok) {
                // Se houver uma mensagem de erro no JSON, usar ela
                const errorMessage = responseData.message || `Erro de rede: ${response.status}`;
                throw new Error(errorMessage);
            }
            
            return responseData;
        })
        .then(data => {
            // Fechar modal de carregamento primeiro
            if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                Swal.close();
            }
            
            // Pequeno delay para garantir que o modal de carregamento foi fechado
            setTimeout(() => {
                if (data.success) {
                    // Montar mensagem com estatísticas detalhadas
                    let mensagemEstatisticas = data.message || 'Itens importados com sucesso!';
                    let usarHtml = false;
                    
                    // Sempre mostrar estatísticas se os dados estiverem presentes
                    if (data.hasOwnProperty('itens_ja_importados') || data.hasOwnProperty('itens_importados') || data.hasOwnProperty('itens_vinculados')) {
                        console.log('Estatísticas de vinculação e importação disponíveis:', {
                            vinculados: data.itens_vinculados,
                            ja_vinculados: data.itens_ja_vinculados,
                            ja_importados: data.itens_ja_importados,
                            importados_agora: data.itens_importados,
                            com_erro: data.itens_com_erro,
                            total_pendentes: data.total_pendentes
                        });
                        
                        const itensVinculados = data.itens_vinculados !== undefined ? data.itens_vinculados : 0;
                        const itensJaVinculados = data.itens_ja_vinculados !== undefined ? data.itens_ja_vinculados : 0;
                        const itensJaImportados = data.itens_ja_importados !== undefined ? data.itens_ja_importados : 0;
                        const itensImportadosAgora = data.itens_importados !== undefined ? data.itens_importados : 0;
                        const itensComErro = data.itens_com_erro !== undefined ? data.itens_com_erro : 0;
                        const totalPendentes = data.total_pendentes !== undefined ? data.total_pendentes : 0;
                        
                        mensagemEstatisticas = `<div style="text-align: left; padding: 10px;">
                            <strong style="font-size: 1.1em;">Processamento concluído com sucesso!</strong><br><br>
                            <div style="margin-left: 10px;">
                                <div style="margin-bottom: 8px; font-size: 1.05em;">📊 <strong>Estatísticas:</strong></div>
                                ${itensVinculados > 0 || itensJaVinculados > 0 ? `
                                <div style="margin-left: 20px; margin-bottom: 8px; font-size: 1em;">
                                    <strong style="color: #17a2b8;">🔗 Vinculação:</strong>
                                </div>
                                ${itensVinculados > 0 ? `
                                <div style="margin-left: 30px; margin-bottom: 5px; font-size: 1em;">
                                    • Itens vinculados agora: <strong style="color: #17a2b8;">${itensVinculados}</strong>
                                </div>` : ''}
                                ${itensJaVinculados > 0 ? `
                                <div style="margin-left: 30px; margin-bottom: 5px; font-size: 1em;">
                                    • Itens já vinculados: <strong style="color: #6c757d;">${itensJaVinculados}</strong>
                                </div>` : ''}
                                ` : ''}
                                <div style="margin-left: 20px; margin-bottom: 8px; margin-top: ${itensVinculados > 0 || itensJaVinculados > 0 ? '8px' : '0'}; font-size: 1em;">
                                    <strong style="color: #007bff;">📦 Importação:</strong>
                                </div>
                                ${itensJaImportados > 0 ? `
                                <div style="margin-left: 30px; margin-bottom: 5px; font-size: 1em;">
                                    • Itens já importados: <strong style="color: #28a745;">${itensJaImportados}</strong>
                                </div>` : ''}
                                <div style="margin-left: 30px; margin-bottom: 5px; font-size: 1em;">
                                    • Itens importados agora: <strong style="color: #007bff;">${itensImportadosAgora}</strong>
                                </div>
                                ${itensComErro > 0 ? 
                                    `<div style="margin-left: 30px; margin-bottom: 5px; font-size: 1em; color: #dc3545;">
                                        • Itens com erro: <strong>${itensComErro}</strong>
                                    </div>` : ''}
                                ${totalPendentes > 0 ? 
                                    `<div style="margin-left: 20px; margin-top: 8px; color: #666; font-size: 0.95em; border-top: 1px solid #ddd; padding-top: 8px;">
                                        Total de itens pendentes encontrados: <strong>${totalPendentes}</strong>
                                    </div>` : ''}
                            </div>
                        </div>`;
                        usarHtml = true;
                    }
                    
                    // Usar Swal.fire diretamente com HTML para garantir que as estatísticas sejam exibidas
                    if (usarHtml && typeof Swal !== 'undefined') {
                        console.log('Exibindo modal com estatísticas de importação:', mensagemEstatisticas);
                        Swal.fire({
                            title: 'Sucesso',
                            html: mensagemEstatisticas,
                            icon: 'success',
                            confirmButtonText: 'OK',
                            width: '500px',
                            allowOutsideClick: false,
                            allowEscapeKey: true,
                            showCloseButton: true
                        }).then(() => {

    // Função para buscar e vincular material de outras notas fiscais
    function buscarEVincularDeOutrasNotas(itemId, itemCodigo, itemDescricao, itemUnidade) {
        if (!itemId) {
            mostrarAlerta('Erro', 'ID do item não encontrado.', 'error');
            return;
        }
        
        mostrarCarregando('Buscando materiais vinculados em outras notas fiscais...');
        
        // Obter token CSRF
        const csrfToken = $('input[name="csrf_token"]').val();
        
        // Construir parâmetros da busca
        const params = new URLSearchParams();
        if (itemCodigo) params.append('codigo', itemCodigo);
        if (itemDescricao) params.append('descricao', itemDescricao);
        
        fetch(`/notas-fiscais/api/buscar-materiais-outras-notas?${params.toString()}`, {
            method: 'GET',
            headers: {
                'X-CSRFToken': csrfToken
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`Erro de rede: ${response.status}`);
            }
            return response.json().catch(e => {
                console.error('Erro ao fazer parse do JSON:', e);
                throw new Error('Resposta inválida do servidor: não é um JSON válido');
            });
        })
        .then(data => {
            if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                Swal.close();
            }
            
            if (data.success && data.materiais && data.materiais.length > 0) {
                mostrarModalSelecionarMaterialDeOutrasNotas(itemId, data.materiais, itemUnidade);
            } else {
                mostrarAlerta('Info', 'Nenhum material vinculado encontrado em outras notas fiscais com o mesmo código ou descrição.', 'info');
            }
        })
        .catch(error => {
            console.error('Erro ao buscar materiais de outras notas:', error);
            if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                Swal.close();
            }
            mostrarAlerta('Erro', `Ocorreu um erro ao buscar materiais: ${error.message}`, 'error');
        });
    }

    // Função para vincular material de outra nota
    function vincularMaterialDeOutraNota(itemId, materialId, fatorConversao, materialNome, unidadeMaterial, unidadeItem, itemCodigo, itemDescricao) {
        const notaId = document.getElementById('importacao_nf_id').value;
        
        if (!notaId) {
            mostrarAlerta('Erro', 'ID da nota fiscal não encontrado.', 'error');
            return;
        }
        
        if (!confirm(`Deseja vincular o material "${materialNome}" ao item atual e a todos os outros itens similares (mesmo código ou descrição) nesta nota fiscal?`)) {
            return;
        }
        
        mostrarCarregando('Vinculando material aos itens similares...');
        
        // Obter token CSRF
        const csrfToken = $('input[name="csrf_token"]').val();
        
        fetch(`/notas-fiscais/api/vincular-material-outras-notas`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                nf_id: notaId,
                item_id: itemId,
                material_id: materialId,
                fator_conversao: fatorConversao,
                codigo: itemCodigo,
                descricao: itemDescricao
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`Erro de rede: ${response.status}`);
            }
            return response.json().catch(e => {
                console.error('Erro ao fazer parse do JSON:', e);
                throw new Error('Resposta inválida do servidor: não é um JSON válido');
            });
        })
        .then(data => {
            if (data.success) {
                mostrarAlerta('Sucesso', data.message || `Material "${materialNome}" vinculado com sucesso!`, 'success', function() {
                    // Recarregar os itens da nota para atualizar a interface
                    if (notaId) {
                        carregarItensImportacao(notaId);
                    }
                    // Recarregar a tabela de notas fiscais se a função existir
                    if (typeof carregarTabelaNotasFiscais === 'function') {
                        params = $('#filtrosNotasFiscais').serialize();
                        carregarTabelaNotasFiscais(params);
                        if (typeof carregarTotalNotas === 'function') {
                            carregarTotalNotas(params);
                        }
                    }
                });
            } else {
                mostrarAlerta('Erro', data.message || 'Erro ao vincular material.', 'error');
            }
        })
        .catch(error => {
            console.error('Erro ao vincular material:', error);
            mostrarAlerta('Erro', `Ocorreu um erro ao processar: ${error.message}`, 'error');
        })
        .finally(() => {
            if (typeof Swal !== 'undefined' && Swal.isVisible()) {
                Swal.close();
            }
        });
    }

            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,

    // Função para importar itens selecionados
    function importarItens() {
        const formData = new FormData(document.getElementById('formImportacao'));
        const itensSelecionados = [];
        
        document.querySelectorAll('.item-checkbox:checked').forEach(function(checkbox) {
            const itemId = checkbox.value;
            const materialId = document.getElementById(`material_id_${itemId}`).value;
            const fatorConversaoElement = document.getElementById(`fator_conversao_${itemId}`);
            const fatorConversao = fatorConversaoElement ? fatorConversaoElement.value : null;
            itensSelecionados.push({
                item_id: itemId,
                material_id: materialId,
                fator_conversao: fatorConversao || null

    // Função para desvincular material do item
    function desvincularMaterial(itemId) {
        if (!confirm('Tem certeza que deseja desvincular o material deste item?')) {
            return;
        }

        mostrarCarregando('Desvinculando material...');

        fetch(`/notas-fiscais/api/desvincular-material/${itemId}`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': $('input[name="csrf_token"]').val(),
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`Erro de rede: ${response.status}`);
            }
            return response.json().catch(e => {
                console.error('Erro ao fazer parse do JSON:', e);
                throw new Error('Resposta inválida do servidor: não é um JSON válido');
            });
        })
        .then(data => {
            if (data.success) {
                mostrarAlerta('Sucesso', data.message, 'success', function() {
                    // Recarregar os itens da nota para atualizar a interface
                    const notaId = document.getElementById('importacao_nf_id').value;
                    carregarItensImportacao(notaId);
                });
            } else {
                mostrarAlerta('Erro', data.message, 'error');
            }
        })
        .catch(error => {
            console.error('Erro ao desvincular material:', error);
            mostrarAlerta('Erro', `Ocorreu um erro ao desvincular o material: ${error.message}`, 'error');
        })
        .finally(() => {
            if (typeof Swal !== 'undefined') {
                Swal.close();
            }
        });
    }
