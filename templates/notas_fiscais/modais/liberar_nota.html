<!-- Modal de Liberação de Nota Fiscal -->
<div class="modal fade" id="modalLiberarNota" tabindex="-1" aria-labelledby="modalLiberarNotaLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLiberarNotaLabel">Liberar Nota Fiscal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <form id="formLiberarNota">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="liberar_nf_id" name="nf_id">
                <div class="modal-body">
                    <p class="mb-3">Deseja liberar a nota fiscal <strong id="numeroNotaLiberar"></strong>?</p>
                    <div class="mb-3">
                        <label for="tipo_item_liberacao" class="form-label">Tipo de Item</label>
                        <select name="tipo_item" id="tipo_item_liberacao" class="form-select">
                            <option value="">Selecione...</option>
                            <option value="MP">Matéria Prima (MP)</option>
                            <option value="UC">Uso e consumo (UC)</option>
                            <option value="IM">Imobilizado (IM)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pedido de Compra (Fornecedor)</label>
                        <div class="row g-2">
                            <div class="col-12">
                                <input type="text" id="pedido_numero_liberacao" class="form-control" list="pedido_lista_liberacao" placeholder="Digite o número do pedido (ou deixe em branco)">
                                <datalist id="pedido_lista_liberacao">
                                    <!-- opções preenchidas via JS -->
                                </datalist>
                                <input type="hidden" id="pedido_id_liberacao">
                                <div class="form-text" id="pedidoFornecedorInfo">
                                    Você pode liberar a nota sem vincular a um pedido de compra. Para isso, deixe o campo em branco.
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label mt-2">Item do Pedido</label>
                                <div class="row g-2">
                                    <div class="col-md-7">
                                        <select id="pedido_item_id_liberacao" class="form-select" disabled>
                                            <option value="">Selecione o item...</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <input type="number" step="0.0001" min="0" id="quantidade_entrada_liberacao" class="form-control" placeholder="Quantidade" disabled>
                                    </div>
                                    <div class="col-md-2 d-grid">
                                        <button type="button" id="btnAdicionarItemLiberacao" class="btn btn-outline-primary" disabled>
                                            Adicionar
                                        </button>
                                    </div>
                                </div>
                                <div class="form-text" id="pedidoItemSaldoInfo"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label mt-2">Itens para entrada</label>
                                <div class="table-responsive">
                                    <table class="table table-sm table-bordered align-middle mb-0" id="tabelaItensLiberacao">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Item</th>
                                                <th class="text-end">Saldo</th>
                                                <th class="text-end">Qtd. Entrada</th>
                                                <th style="width: 1%;">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr id="linhaSemItensLiberacao">
                                                <td colspan="4" class="text-center text-muted">Nenhum item adicionado.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnConfirmarLiberacao" class="btn btn-info">
                        <i class="fas fa-unlock"></i> Liberar Nota Fiscal
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
