
<!-- Modal para Visualizar Documentos -->
<div class="modal fade" id="modalDocumentos" tabindex="-1" aria-labelledby="modalDocumentosLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalDocumentosLabel">Documentos da Nota Fiscal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <button type="button" class="btn btn-primary" id="btnAdicionarDocumento">
                        <i class="fas fa-plus"></i> Adicionar Documento
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered" id="tabelaDocumentos">
                        <thead>
                            <tr>
                                <th>Nome do Arquivo</th>
                                <th>Tipo</th>
                                <th>Data de Upload</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaDocumentos">
                            <!-- Documentos serão carregados via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Adicionar Documento -->
<div class="modal fade" id="modalAdicionarDocumento" tabindex="-1" aria-labelledby="modalAdicionarDocumentoLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalAdicionarDocumentoLabel">Adicionar Documento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form id="formAdicionarDocumento">
                    <input type="hidden" id="notaFiscalId" name="nota_fiscal_id">
                    {% if csrf_token %}
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    {% endif %}
                    <div class="mb-3">
                        <label for="tipoDocumento" class="form-label">Tipo do Documento</label>
                        <select class="form-select" id="tipoDocumento" name="tipo" required>
                            <option value="">Selecione...</option>
                            <option value="1">Contrato</option>
                            <option value="2">Ordem de Compra</option>
                            <option value="3">Outros</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="arquivo" class="form-label">Arquivo</label>
                        <input type="file" class="form-control" id="arquivo" name="arquivo" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnSalvarDocumento">Salvar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Visualizar Documento -->
<div class="modal fade" id="modalVisualizarDocumento" tabindex="-1" aria-labelledby="modalVisualizarDocumentoLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalVisualizarDocumentoLabel">Visualizar Documento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <iframe id="documentoViewer" style="width: 100%; height: 80vh; border: none;"></iframe>
            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script>
// Função para carregar documentos
// Expor função globalmente para uso com DataTables
window.carregarDocumentos = function(notaId) {
    console.log('carregarDocumentos chamado com notaId:', notaId);
    var tbody = $('#listaDocumentos');
    if (!tbody.length) {
        console.error('Elemento #listaDocumentos não encontrado');
        return;
    }
    
    tbody.empty();
    tbody.append('<tr><td colspan="4" class="text-center">Carregando documentos...</td></tr>');
    
    $.ajax({
        url: `/notas-fiscais/api/documentos/${notaId}`,
        type: 'GET',
        success: function(response) {
            console.log('Resposta da API:', response);
            tbody.empty();
            
            if (response.success && response.documentos && response.documentos.length > 0) {
                response.documentos.forEach(function(doc) {
                    var uploadedAt = doc.uploaded_at ? new Date(doc.uploaded_at).toLocaleDateString('pt-BR') : 'N/A';
                    var row = `
                        <tr>
                            <td>${doc.filename || 'Sem nome'}</td>
                            <td>${getTipoDocumento(doc.tipo)}</td>
                            <td>${uploadedAt}</td>
                            <td>
                                ${doc.tipo !== 10 ? `
                                <button class="btn btn-sm btn-primary visualizar-pdf" data-id="${doc.id}" title="Visualizar">
                                    <i class="fas fa-eye"></i>
                                </button>
                                ` : ''}
                                ${doc.tipo !== 10 ? `
                                <button class="btn btn-sm btn-danger excluir-doc" data-id="${doc.id}" title="Excluir">
                                    <i class="fas fa-trash"></i>
                                </button>
                                ` : ''}
                                <button class="btn btn-sm btn-primary download" data-id="${doc.id}" data-tipo="${doc.tipo}" title="Download">
                                    <i class="fas fa-download"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.append(row);
                });
            } else {
                tbody.append('<tr><td colspan="4" class="text-center">Nenhum documento encontrado.</td></tr>');
            }
        },
        error: function(xhr, status, error) {
            console.error('Erro ao carregar documentos:', error);
            console.error('Status:', xhr.status);
            console.error('Response:', xhr.responseText);
            tbody.empty();
            var errorMsg = 'Erro ao carregar documentos.';
            if (xhr.status === 404) {
                errorMsg = 'Nota fiscal não encontrada.';
            } else if (xhr.status === 500) {
                errorMsg = 'Erro interno do servidor. Tente novamente.';
            }
            tbody.append(`<tr><td colspan="4" class="text-center text-danger">${errorMsg}</td></tr>`);
        }
    });
};

document.addEventListener('DOMContentLoaded', function() {

    // Eventos delegados para os botões dentro da tabela de documentos
    $(document).on('click', '#tabelaDocumentos .visualizar-pdf', function() {
        console.log('visualizar pdf clicado');
        const docId = $(this).data('id');
        console.log('ID do documento:', docId);
        abrirPdfNota(docId);
    });
    $(document).on('click', '#tabelaDocumentos .download-xml', function() {
        console.log('download xml clicado');
        const notaId = $(this).data('id');
        downloadXmlNota(notaId);
    });
    
    $(document).on('click', '#tabelaDocumentos .download', function() {
        console.log('download clicado');
        const docId = $(this).data('id');
        const tipo = $(this).data('tipo');
        if (tipo === 10) {
            $(this).attr('title', 'Download xml');
            downloadXmlNota(docId);
        } else {
            $(this).attr('title', 'Download pdf');
            downloadPdfNota(docId);
        }
    });
    // Manipular clique no botão de download PDF da tabela de notas fiscais
    $("#tabelaNotasFiscaisContainer").on('click', '.download-pdf-nota', function() {
        const notaId = $(this).data('id');
        const numeroNf = $(this).data('numero');
        console.log('Download PDF clicado para nota:', notaId, 'Número:', numeroNf);
        downloadPdfNota(notaId, numeroNf);
    });
    
    // Manipular clique no botão de adicionar documento
    $('#btnAdicionarDocumento').on('click', function() {
        const modalElement = document.getElementById('modalAdicionarDocumento');
        if (modalElement) {
            const modal = new bootstrap.Modal(modalElement);
            modal.show();
        }
    });

    // Manipular clique no botão de salvar documento
    $('#btnSalvarDocumento').on('click', function() {
        var formData = new FormData($('#formAdicionarDocumento')[0]);
        
        // Garantir que o token CSRF esteja presente
        var csrfToken = $('meta[name="csrf-token"]').attr('content');
        if (!csrfToken) {
            csrfToken = $('#formAdicionarDocumento input[name="csrf_token"]').val();
        }
        if (csrfToken) {
            formData.append('csrf_token', csrfToken);
        }
        
        $.ajax({
            url: '/notas-fiscais/api/documentos',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                if (response.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Sucesso!',
                        text: 'Documento adicionado com sucesso!'
                    });
                    $('#modalAdicionarDocumento').modal('hide');
                    carregarDocumentos($('#notaFiscalId').val());
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Erro!',
                        text: response.message || 'Erro ao adicionar documento.'
                    });
                }
            },
            error: function(xhr, status, error) {
                console.error('Erro ao adicionar documento:', error);
                var errorMsg = 'Erro ao adicionar documento.';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    errorMsg = xhr.responseJSON.message;
                }
                Swal.fire({
                    icon: 'error',
                    title: 'Erro!',
                    text: errorMsg
                });
            }
        });
    });

});

// Função para fazer download do XML da nota fiscal
function downloadXmlNota(notaId) {
    $.ajax({
        url: `/notas-fiscais/xml/${notaId}`,
        type: 'GET',
        success: function(response) {
            if (response.xml) {
                var url = URL.createObjectURL(new Blob([response.xml], { type: 'application/xml' }));
                var a = document.createElement('a');
                a.href = url;
                a.download = `nf ${notaId}.xml`;
                a.click();
                URL.revokeObjectURL(url);
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Erro!',
                    text: 'XML não encontrado.'
                });
            }
        },
        error: function(xhr, status, error) {
            console.error('Erro ao baixar XML:', error);
            Swal.fire({
                icon: 'error',
                title: 'Erro!',
                text: 'Erro ao baixar XML da nota fiscal.'
            });
        }
    });
}

// Função para fazer download do PDF da nota fiscal
function downloadPdfNota(docId) {
    window.location.href = `/notas-fiscais/api/documentos/${docId}/download`;
}


// Função para abrir PDF em modal
function abrirPdfNota(docId) {
    console.log('abrirPdfNota chamado com docId:', docId);
    const iframe = document.getElementById('documentoViewer');
    if (!iframe) {
        console.error('Elemento documentoViewer não encontrado');
        return;
    }
    
    iframe.src = '';
    const modalEl = document.getElementById('modalVisualizarDocumento');
    if (!modalEl) {
        console.error('Modal modalVisualizarDocumento não encontrado');
        return;
    }
    
    const modal = new bootstrap.Modal(modalEl);
    modal.show();

    // Remove mensagens/elementos antigos
    let oldMsg = modalEl.querySelector('.pdf-erro-msg');
    if (oldMsg) oldMsg.remove();
    let oldSpinner = modalEl.querySelector('#pdfLoadingSpinner');
    if (oldSpinner) oldSpinner.remove();

    // Exibe loading
    iframe.style.display = 'none';
    let loading = document.createElement('div');
    loading.id = 'pdfLoadingSpinner';
    loading.className = 'd-flex justify-content-center align-items-center';
    loading.style.height = '100%';
    loading.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando PDF...</span></div>';
    iframe.parentNode.appendChild(loading);

    fetch(`/notas-fiscais/pdf/${docId}`)
        .then(response => {
            if (!response.ok) {
                throw new Error(`Erro ao buscar PDF: ${response.status} ${response.statusText}`);
            }
            return response.blob();
        })
        .then(blob => {
            const url = URL.createObjectURL(blob);
            iframe.src = url;
            iframe.onload = () => {
                iframe.style.display = '';
                if (loading) loading.remove();
            };
            iframe.onerror = () => {
                if (loading) loading.remove();
                iframe.style.display = 'none';
                let msg = document.createElement('div');
                msg.className = 'text-danger text-center mt-3 pdf-erro-msg';
                msg.innerText = 'Erro ao carregar o PDF.';
                iframe.parentNode.appendChild(msg);
            };
        })
        .catch((error) => {
            console.error('Erro ao carregar PDF:', error);
            if (loading) loading.remove();
            iframe.style.display = 'none';
            let msg = document.createElement('div');
            msg.className = 'text-danger text-center mt-3 pdf-erro-msg';
            msg.innerText = 'Não foi possível carregar o PDF da nota fiscal.';
            iframe.parentNode.appendChild(msg);
        });
}

// Função para obter o nome do tipo de documento
function getTipoDocumento(tipo) {
    const tipos = {
        1: 'Nota Original',
        2: 'Nota Carimbada',
        3: 'Outros',
        10: 'XML'
    };
    return tipos[tipo] || 'Desconhecido';
}



// Manipular clique no botão de excluir documento
$(document).on('click', '.excluir-doc', function() {
    var docId = $(this).data('id');
    
    Swal.fire({
        title: 'Tem certeza?',
        text: "Esta ação não poderá ser revertida!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
    }).then((result) => {
        if (result.isConfirmed) {
            // Obter token CSRF
            var csrfToken = $('meta[name="csrf-token"]').attr('content');
            if (!csrfToken) {
                csrfToken = $('input[name="csrf_token"]').first().val();
            }
            
            $.ajax({
                url: `/notas-fiscais/api/documentos/${docId}`,
                type: 'DELETE',
                headers: csrfToken ? {'X-CSRF-Token': csrfToken} : {},
                data: csrfToken ? {csrf_token: csrfToken} : {},
                success: function(response) {
                    if (response.success) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Sucesso!',
                            text: 'Documento excluído com sucesso!'
                        });
                        carregarDocumentos($('#notaFiscalId').val());
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Erro!',
                            text: response.message || 'Erro ao excluir documento.'
                        });
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Erro ao excluir documento:', error);
                    var errorMsg = 'Erro ao excluir documento.';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMsg = xhr.responseJSON.message;
                    }
                    Swal.fire({
                        icon: 'error',
                        title: 'Erro!',
                        text: errorMsg
                    });
                }
            });
        }
    });
});
</script>
{% endblock %}
