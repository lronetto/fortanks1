<script>
// JS para notas, avulsos, modais, etc. (baseado no novo.html)
let notasSelecionadas = [];
let avulsos = [];
let paginaNotas = 1;
let totalPaginasNotas = 1;
const notasPorPagina = 25;

function formatarMoeda(valor) {
    return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    }).format(valor);
}

function atualizarTotal() {
    let total = 0;
    notasSelecionadas.forEach(nota => {
        total += parseFloat(nota.valor);
    });
    avulsos.forEach(avulso => {
        total += parseFloat(avulso.valor);
    });
    const totalEl = document.getElementById('valorTotal');
    if (totalEl) totalEl.textContent = formatarMoeda(total);
}

function filtrarNotas(page = 1) {
    paginaNotas = page;
    const spinner = document.getElementById('spinnerNotas');
    if (spinner) spinner.style.display = '';
    const filtros = {
        numero: document.getElementById('filtroNumero')?.value,
        fornecedor: document.getElementById('filtroFornecedor')?.value,
        data_inicial: document.getElementById('filtroDataInicial')?.value,
        data_final: document.getElementById('filtroDataFinal')?.value,
        valor_minimo: document.getElementById('filtroValorMinimo')?.value,
        valor_maximo: document.getElementById('filtroValorMaximo')?.value,
        valor_exato: document.getElementById('filtroValorExato')?.value,
        pagamento: document.getElementById('filtroPagamento') ? document.getElementById('filtroPagamento').value : '',
        page: paginaNotas,
        per_page: notasPorPagina,
        ids: notasSelecionadas.map(n => n.id),
        notas_selecionadas: notasSelecionadas
    };
    fetch('/reembolsos/buscar_notas', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrf_token]')?.value
        },
        body: JSON.stringify(filtros)
    })
    .then(response => response.json())
    .then(data => {
        const tbody = document.querySelector('#tabelaNotas tbody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (data.notas && Array.isArray(data.notas)) {
            data.notas.forEach(nota => {
                const checked = notasSelecionadas.some(n => n.id === parseInt(nota.id)) ? 'checked' : '';
                const notaSelecionada = notasSelecionadas.find(n => n.id === parseInt(nota.id)) || {};
                const descricao = notaSelecionada.descricao || '';
                const centro_custo_id = notaSelecionada.centro_custo_id || '';
                let centroCustoOptions = '<option value="">Selecione...</option>';
                if (window.centrosCusto) {
                    window.centrosCusto.forEach(function(centro) {
                        centroCustoOptions += `<option value="${centro.id}">${centro.codigo} - ${centro.nome}</option>`;
                    });
                }
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" class="nota-checkbox" value="${nota.id}" ${checked}></td>
                    <td>${nota.numero_nf}</td>
                    <td><a href="#" onclick="abrirPdfNota(${nota.id}, '${nota.chave_acesso}'); return false;">${nota.nome_emitente}</a></td>
                    <td>${new Date(nota.data_emissao).toLocaleDateString()}</td>
                    <td>${formatarMoeda(nota.valor_total)}</td>
                    <td>${nota.pagamento ? '<span class="badge bg-success ms-1" title="Pago"><i class="fas fa-check"></i></span>' : ''}
                        ${nota.upload > 0 ? '<span class="badge bg-info ms-1" title="Documentos anexados"><i class="fas fa-paperclip"></i></span>' : ''}</td>
                    <td><input type="text" class="form-control nota-descricao" data-id="${nota.id}" value="${descricao}"></td>
                    <td><select class="form-control nota-centro-custo" data-id="${nota.id}">${centroCustoOptions}</select></td>
                    <td><button type="button" class="btn btn-primary btn-sm" onclick="abrirModalDocumentos(${nota.id})"><i class="fas fa-paperclip"></i></button></td>
                `;
                tbody.appendChild(tr);
                // Setar valor selecionado se existir
                const selectCentro = tr.querySelector('.nota-centro-custo');
                if (selectCentro && centro_custo_id) {
                    selectCentro.value = centro_custo_id;
                }
            });
            totalPaginasNotas = data.pages;
            renderPaginacaoNotas();
            adicionarListenersNotas();
        } else {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">Erro ao carregar notas</td></tr>';
        }
    })
    .catch(error => {
        const tbody = document.querySelector('#tabelaNotas tbody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="8" class="text-center">Erro ao carregar notas</td></tr>';
    })
    .finally(() => {
        if (spinner) spinner.style.display = 'none';
    });
}

function renderPaginacaoNotas() {
    const paginacao = document.getElementById('paginacaoNotas');
    if (!paginacao) return;
    paginacao.innerHTML = '';
    if (totalPaginasNotas <= 1) return;
    let html = '';
    html += `<li class="page-item${paginaNotas === 1 ? ' disabled' : ''}"><a class="page-link" href="#" onclick="filtrarNotas(${paginaNotas - 1}); return false;">Anterior</a></li>`;
    let start = Math.max(1, paginaNotas - 2);
    let end = Math.min(totalPaginasNotas, paginaNotas + 2);
    if (paginaNotas <= 3) { end = Math.min(5, totalPaginasNotas); }
    if (paginaNotas > totalPaginasNotas - 2) { start = Math.max(1, totalPaginasNotas - 4); }
    for (let i = start; i <= end; i++) {
        html += `<li class="page-item${paginaNotas === i ? ' active' : ''}"><a class="page-link" href="#" onclick="filtrarNotas(${i}); return false;">${i}</a></li>`;
    }
    html += `<li class="page-item${paginaNotas === totalPaginasNotas ? ' disabled' : ''}"><a class="page-link" href="#" onclick="filtrarNotas(${paginaNotas + 1}); return false;">Próxima</a></li>`;
    paginacao.innerHTML = html;
}

function adicionarListenersNotas() {
    document.querySelectorAll('.nota-checkbox').forEach(cb => {
        cb.addEventListener('change', function(e) {
            const notaId = parseInt(this.value);
            const tr = this.closest('tr');
            const descricao = tr.querySelector('.nota-descricao').value;
            const valor = parseFloat(tr.querySelector('td:nth-child(5)').textContent.replace(/[^\d,-]/g, '').replace(',', '.'));
            const centro_custo_id = tr.querySelector('.nota-centro-custo').value;
            let nota = { id: notaId, descricao, valor, centro_custo_id };
            if (this.checked) {
                if (!notasSelecionadas.find(n => n.id === notaId)) notasSelecionadas.push(nota);
            } else {
                notasSelecionadas = notasSelecionadas.filter(n => n.id !== notaId);
            }
            atualizarTotal();
        });
    });
    document.querySelectorAll('.nota-descricao').forEach(input => {
        input.addEventListener('input', function(e) {
            const notaId = parseInt(this.dataset.id);
            const nota = notasSelecionadas.find(n => n.id === notaId);
            if (nota) nota.descricao = this.value;
        });
    });
    document.querySelectorAll('.nota-centro-custo').forEach(select => {
        select.addEventListener('change', function(e) {
            const notaId = parseInt(this.dataset.id);
            const nota = notasSelecionadas.find(n => n.id === notaId);
            if (nota) nota.centro_custo_id = this.value;
        });
    });
}

function abrirModalDocumentos(notaId) {
    document.getElementById('notaIdDocumentos').value = notaId;
    carregarDocumentos(notaId);
    $('#modalDocumentos').modal('show');
}

function carregarDocumentos(notaId) {
    fetch(`/reembolsos/nota/${notaId}/documentos`)
        .then(response => response.json())
        .then(data => {
            const lista = document.getElementById('listaDocumentos');
            lista.innerHTML = '';
            data.forEach(doc => {
                const item = document.createElement('div');
                item.className = 'list-group-item d-flex justify-content-between align-items-center';
                item.innerHTML = `
                    <div>
                        <i class="fas fa-file me-2"></i>
                        ${doc.filename}
                    </div>
                    <div>
                        <button class="btn btn-sm btn-info me-2" onclick="visualizarDocumento(${doc.id}, '${doc.mimetype}')">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-primary me-2" onclick="downloadDocumento(${doc.id})">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="excluirDocumento(${doc.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                lista.appendChild(item);
            });
        })
        .catch(error => {
            console.error('Erro ao carregar documentos:', error);
            alert('Erro ao carregar documentos');
        });
}

function salvarDocumentos() {
    const notaId = document.getElementById('notaIdDocumentos').value;
    const formData = new FormData();
    formData.append('nota_id', notaId);
    const anexos = document.getElementById('anexos');
    for (let i = 0; i < anexos.files.length; i++) {
        formData.append('anexos', anexos.files[i]);
    }
    fetch('/reembolsos/nota/documentos', {
        method: 'POST',
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrf_token]')?.value
        },
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            carregarDocumentos(notaId);
            document.getElementById('anexos').value = '';
        } else {
            throw new Error(data.error || 'Erro ao salvar documentos');
        }
    })
    .catch(error => {
        console.error('Erro ao salvar documentos:', error);
        alert('Erro ao salvar documentos');
    });
}

function excluirDocumento(documentoId) {
    if (!confirm('Tem certeza que deseja excluir este documento?')) {
        return;
    }
    fetch(`/reembolso/documento/${documentoId}`, {
        method: 'DELETE'
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const notaId = document.getElementById('notaIdDocumentos').value;
            carregarDocumentos(notaId);
        } else {
            throw new Error(data.error || 'Erro ao excluir documento');
        }
    })
    .catch(error => {
        console.error('Erro ao excluir documento:', error);
        alert('Erro ao excluir documento');
    });
}

function downloadDocumento(documentoId) {
    window.location.href = `/reembolso/documento/${documentoId}/download`;
}

function visualizarDocumento(documentoId, mimetype) {
    const iframe = document.getElementById('iframeDocumento');
    iframe.src = '';
    const modalEl = document.getElementById('modalVisualizarDocumento');
    const modal = new bootstrap.Modal(modalEl);
    modal.show();
    let oldMsg = modalEl.querySelector('.documento-erro-msg');
    if (oldMsg) oldMsg.remove();
    let oldSpinner = modalEl.querySelector('#documentoLoadingSpinner');
    if (oldSpinner) oldSpinner.remove();
    iframe.style.display = 'none';
    let loading = document.createElement('div');
    loading.id = 'documentoLoadingSpinner';
    loading.className = 'd-flex justify-content-center align-items-center';
    loading.style.height = '100%';
    loading.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando documento...</span></div>';
    iframe.parentNode.appendChild(loading);
    fetch(`/reembolsos/documento/${documentoId}/download`)
        .then(response => {
            if (!response.ok) throw new Error('Erro ao buscar documento');
            return response.blob();
        })
        .then(blob => {
            const url = URL.createObjectURL(blob);
            iframe.src = url;
            iframe.onload = () => {
                iframe.style.display = '';
                if (loading) loading.remove();
            };
        })
        .catch(() => {
            if (loading) loading.remove();
            iframe.style.display = 'none';
            let msg = document.createElement('div');
            msg.className = 'text-danger text-center mt-3 documento-erro-msg';
            msg.innerText = 'Não foi possível carregar o documento.';
            iframe.parentNode.appendChild(msg);
        });
}

function selecionarTodosNotas(checkbox) {
    const checkboxes = document.querySelectorAll('.nota-checkbox');
    checkboxes.forEach(cb => {
        cb.checked = checkbox.checked;
        const tr = cb.closest('tr');
        const notaId = parseInt(cb.value);
        const descricao = tr.querySelector('.nota-descricao').value;
        const valor = parseFloat(tr.querySelector('td:nth-child(5)').textContent.replace(/[^0-9,-]/g, '').replace(',', '.'));
        const centro_custo_id = tr.querySelector('.nota-centro-custo').value;
        let nota = { id: notaId, descricao, valor, centro_custo_id };
        if (checkbox.checked) {
            if (!notasSelecionadas.find(n => n.id === notaId)) notasSelecionadas.push(nota);
        } else {
            notasSelecionadas = notasSelecionadas.filter(n => n.id !== notaId);
        }
    });
    atualizarTotal();
}

document.addEventListener('DOMContentLoaded', function() {
    // Definir valor padrão do filtro de pagamento para 'selecionados' no modo edição
    if (window.modo === 'editar') {
        const filtroPagamento = document.getElementById('filtroPagamento');
        if (filtroPagamento) filtroPagamento.value = 'selecionados';
    }
    const notasInput = document.getElementById('notas_selecionadas');
    const avulsosInput = document.getElementById('avulsos_data');
    try {
        if (notasInput && notasInput.value && notasInput.value !== '[]') {
            notasSelecionadas = JSON.parse(notasInput.value).map(n => ({...n, id: parseInt(n.id)}));
        }
        if (avulsosInput && avulsosInput.value && avulsosInput.value !== '[]') {
            avulsos = JSON.parse(avulsosInput.value);
            // atualizarTabelaAvulsos(); // Se necessário
        }
    } catch (e) { /* ignora erro de parse */ }
    filtrarNotas();
    document.getElementById('formReembolso').addEventListener('submit', function(e) {
        e.preventDefault();
        if (notasSelecionadas.length === 0 && avulsos.length === 0) {
            alert('Selecione pelo menos uma nota fiscal ou adicione um documento avulso.');
            return;
        }
        document.getElementById('notas_selecionadas').value = JSON.stringify(notasSelecionadas);
        document.getElementById('avulsos_data').value = JSON.stringify(avulsos);
        this.submit();
    });
});
</script>
