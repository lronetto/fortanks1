{% block styles %}{% endblock %}


    <div class="modal fade" id="modalNovoReembolso" tabindex="-1" aria-labelledby="modalNovoReembolsoLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalNovoReembolsoLabel">Novo Reembolso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="modal-body">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="centro_custo_id" class="form-label">Centro de Custo</label>
              {{ form.centro_custo_id(class="form-select") }}
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label mb-1"><strong>Buscar Notas Fiscais</strong></label>
            <div class="row g-2 align-items-end mb-2">
              <div class="col-md-4">
                <label class="form-label small mb-1" for="busca_numero_nf">Número</label>
                <input type="text" id="busca_numero_nf" class="form-control form-control-sm" placeholder="Número da Nota">
              </div>
              <div class="col-md-4">
                <label class="form-label small mb-1" for="busca_fornecedor_nf">Fornecedor</label>
                <input type="text" id="busca_fornecedor_nf" class="form-control form-control-sm" placeholder="Fornecedor">
              </div>
              <div class="col-md-4">
                <label class="form-label small mb-1" for="busca_data_nf">Data</label>
                <input type="date" id="busca_data_nf" class="form-control form-control-sm" placeholder="Data de Emissão">
              </div>
            </div>
            <select id="notas_fiscais" name="notas_fiscais" class="form-select" multiple></select>
            <small class="form-text text-muted">Preencha um ou mais campos acima e clique no campo abaixo para buscar.</small>
          </div>
          <hr class="my-3">
          <div class="mb-3">
            <label class="form-label mb-1"><strong>Documentos Avulsos</strong></label>
            <div id="documentosAvulsosContainer"></div>
            <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="btnAddDocumentoAvulso">
              <i class="fas fa-plus"></i> Adicionar Documento Avulso
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% block scripts %}
<script>
$(document).ready(function() {

  // Buscar fornecedores ao abrir o modal
  $('#modalNovoReembolso').on('show.bs.modal', function () {
    fetch('/reembolsos/fornecedores_avulsos')
      .then(r => r.json())
      .then(lista => {
        const datalist = document.getElementById('datalistFornecedores');
        datalist.innerHTML = '';
        lista.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f;
          datalist.appendChild(opt);
        });
      });
  });
    // --- Select2 para busca de notas fiscais com filtros separados ---
    $('#notas_fiscais').select2({
        theme: 'bootstrap4',
        placeholder: 'Selecione as notas fiscais...',
        minimumInputLength: 0,
        dropdownParent: $('#modalNovoReembolso'),
        ajax: {
            url: '/reembolsos/buscar_notas',
            dataType: 'json',
            delay: 300,
            data: function(params) {
                return {
                    numero: $('#busca_numero_nf').val(),
                    fornecedor: $('#busca_fornecedor_nf').val(),
                    data_ini: $('#busca_data_nf').val(),
                    data_fim: $('#busca_data_nf').val()
                };
            },
            processResults: function(data) {
                return {
                    results: data.map(function(nf) {
                        return {
                            id: nf.id,
                            text: nf.numero_nf + ' | ' + nf.fornecedor + ' | ' + nf.data_emissao + ' | R$ ' + nf.valor_total.toFixed(2)
                        };
                    })
                };
            },
            cache: true
        },
        multiple: true,
        width: '100%'
    });
    // Atualizar o select2 ao mudar qualquer campo de filtro
    $('#busca_numero_nf, #busca_fornecedor_nf, #busca_data_nf').on('input change', function() {
        $('#notas_fiscais').val(null).trigger('change');
        //$('#notas_fiscais').select2('open');
    });

    // --- Adição dinâmica de documentos avulsos ---
    let docIndex = 0;
    $('#btnAddDocumentoAvulso').on('click', function(e) {
        e.preventDefault();
        docIndex++;
        const docHtml = `
        <div class="card mb-2 p-2 documento-avulso-item">
            <div class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Descrição</label>
                    <input type="text" name="documentos_avulsos-${docIndex}-descricao" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Valor</label>
                    <input type="number" step="0.01" min="0" name="documentos_avulsos-${docIndex}-valor" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Anexos</label>
                    <input type="file" name="documentos_avulsos-${docIndex}-anexos" class="form-control" multiple accept=".pdf,image/*">
                </div>
                <div class="col-md-1 text-end">
                    <button type="button" class="btn btn-danger btn-sm btnRemoveDocumentoAvulso"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>`;
        $('#documentosAvulsosContainer').append(docHtml);
    });
    // Remover documento avulso
    $('#documentosAvulsosContainer').on('click', '.btnRemoveDocumentoAvulso', function() {
        $(this).closest('.documento-avulso-item').remove();
    });
});
</script> 
{% endblock %}
