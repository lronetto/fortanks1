<div class="modal fade" id="modal-produto-composto" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">{% if produto %}Editar Produto Composto{% else %}Novo Produto Composto{% endif %}</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="produto_id" name="id" value="">
                    <input type="hidden" name="remover_imagem" id="remover_imagem_hidden" value="0">

                    <div class="row">
                        <div class="col-md-8">
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <label for="nome">Nome do Produto</label>
                                    <input type="text" class="form-control" id="nome" name="nome" value="" required>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="tempo_producao">Tempo de Produção (horas)</label>
                                    <input type="number" step="0.01" class="form-control" id="tempo_producao" name="tempo_producao" value="">
                                </div>
                                 <div class="form-group col-md-6">
                                    <label for="status">Status</label>
                                    <select class="form-control" id="status" name="status">
                                        <option value="Ativo">Ativo</option>
                                        <option value="Inativo">Inativo</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="traco" name="traco">
                                    <label class="form-check-label" for="traco">
                                        É Traço
                                    </label>
                                </div>
                            </div>
                             <div class="form-group">
                                <label for="descricao">Descrição</label>
                                <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Imagem do Produto</label>
                                <div id="image-upload-container" class="text-center p-3 border-2" style="border: 2px dashed #c1c7d0; border-radius: 5px; cursor: pointer;">
                                    <img id="image-preview" src="{{ url_for('produto_composto.imagem_produto', id=produto.id) if produto and produto.imagem else url_for('static', filename='img/logo.png') }}" alt="Preview" class="img-fluid mb-2" style="max-height: 150px;">
                                    <p class="text-muted small mb-1">Arraste a imagem aqui ou clique para selecionar</p>
                                    <input type="file" id="image-input" accept="image/*" class="d-none">
                                </div>
                                <button type="button" class="btn btn-outline-danger btn-sm btn-block mt-2" id="btn-remover-imagem">
                                    Remover Imagem
                                </button>
                            </div>
                        </div>
                    </div>

                    <hr>
                    
                    <h6 class="font-weight-bold">Componentes</h6>
                    
                    <div class="form-row align-items-end mb-3">
                        <div class="col-md-7">
                            <label for="select-item-estoque">Adicionar Item</label>
                            <select class="form-control" id="select-item-estoque" style="width: 100%;">
                                <!-- Options will be loaded by Select2 -->
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="quantidade-item">Quantidade</label>
                            <input type="number" step="0.00001" class="form-control" id="quantidade-item" placeholder="Qtd.">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-success btn-block" id="btn-adicionar-item">
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </div>
                    </div>

                    <table class="table table-sm table-bordered" id="tabela-componentes">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th style="width: 15%;">Quantidade</th>
                                <th style="width: 15%;">Data Início</th>
                                <th style="width: 15%;">Data Término</th>
                                <th style="width: 10%;" class="text-center">Ação</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                    </table>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary btn-send-produto-composto">Salvar Produto</button>
                </div>
            
        </div>
    </div>
</div> 
{% block scripts %}
<script>
    let modalContainer,imageDataUrl;
    document.addEventListener('DOMContentLoaded', function() {
        modalContainer = $('#modal-produto-composto');
        imageDataUrl = null;

        $('#modal-produto-composto').on('paste.produtoComposto', handlePaste);
        // 17. Handler para modal carregado via AJAX
        $('#modal-produto-composto [data-dismiss="modal"]').on('click', function() {
                console.log('Handler direto - Botão fechar clicado');
                fecharModal('#modal-produto-composto');
            });
        
        $('#modal-produto-composto').on('click', '#btn-adicionar-item', function() {
            adicionarComponenteTabela();
        });
        $('.container-fluid').on('click', '#btn-novo-produto', function(e) {
            e.preventDefault();
            $('#produto_id').val('');
            $('#nome').val('');
            $('#tempo_producao').val('');
            $('#status').val('Ativo');
            $('#traco').prop('checked', false);
            $('#descricao').val('');
            $('#image-preview').attr('src', '/static/img/logo.png');
            $('#remover_imagem_hidden').val('0');
            $('#tabela-componentes tbody').empty();
            inicializarSelect2();
            $('#modal-produto-composto').modal('show');
        });
        $('#tabela-produtos-compostos tbody').on('click', '.btn-editar', function(e) {
            console.log('btn-editar');
            e.preventDefault();
            const produtoId = $(this).data('id');
            const produtoNome = $(this).data('nome');
            abrirModalForm(produtoId);
        });
        $('#modal-produto-composto').on('click', '.btn-send-produto-composto', function(e) {
            e.preventDefault();
            console.log('btn-send-produto-composto');
            salvarProduto();
        });
        $('#tabela-componentes tbody').on('click', '.btn-remover-item', function() {
            $(this).closest('tr').remove();
        });
       
        imagem();
        
        function imagem() {
            var isClicking = false;
            $(document).off('click', '#image-upload-container').on('click', '#image-upload-container', function(e) {
                if (isClicking) return; // Evitar múltiplos cliques
                
                e.preventDefault();
                e.stopPropagation();
                console.log('Área de upload clicada'); // Debug
                
                // Usar método nativo do DOM
                var fileInput = document.getElementById('image-input');
                if (fileInput) {
                    console.log('Input file encontrado, clicando...');
                    isClicking = true;
                    fileInput.click();
                    
                    // Resetar após um tempo
                    setTimeout(function() {
                        isClicking = false;
                    }, 1000);
                } else {
                    console.error('Input file não encontrado');
                }
            });

            $(document).off('change', '#image-input').on('change', '#image-input', function(e) {
                console.log('Arquivo selecionado:', e.target.files[0]); // Debug
                if (e.target.files && e.target.files[0]) {
                    handleFile(e.target.files[0]);
                }
            });

            // 10. Lógica de Drag and Drop
            $('#modal-produto-composto').on('dragover', '#image-upload-container', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $(this).addClass('bg-light');
            });

            $('#modal-produto-composto').on('dragleave', '#image-upload-container', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $(this).removeClass('bg-light');
            });

            $('#modal-produto-composto').on('drop', '#image-upload-container', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $(this).removeClass('bg-light');
                console.log('Arquivo dropado:', e.originalEvent.dataTransfer.files[0]); // Debug
                if (e.originalEvent.dataTransfer.files && e.originalEvent.dataTransfer.files[0]) {
                    handleFile(e.originalEvent.dataTransfer.files[0]);
                }
            });

            // 11. Lógica para remover imagem
            $('#modal-produto-composto').on('click', '#btn-remover-imagem', function() {
                $('#remover_imagem_hidden').val('1');
                $('#image-preview').attr('src', '/static/img/logo.png'); // Placeholder
                //$(this).hide();
                imageDataUrl = null;
                $('#image-input').val(''); // Limpa o input file
            });
        }
        
        function abrirModalForm(produtoId) {
            const url = '/produto-composto/get_produto_composto/'+produtoId;
            const modal = $('#modal-produto-composto');
            // Carrega o conteúdo do modal
            fetch(url)
            .then(response => response.json())
            .then(data => {
                $('#produto_id').val(data.produtos[0].id);
                $('#nome').val(data.produtos[0].nome);
                $('#tempo_producao').val(data.produtos[0].tempo_producao);
                $('#status').val(data.produtos[0].status);
                $('#descricao').val(data.produtos[0].descricao);
                
                // Tratar traco do produto composto (campo direto do banco)
                const tracoProduto = data.produtos[0].traco === true || data.produtos[0].traco === 1 || data.produtos[0].traco === '1';
                $('#traco').prop('checked', tracoProduto);
                
                // Tratar imagem corretamente
                if (data.produtos[0].imagem) {
                    imageDataUrl = data.produtos[0].imagem;
                    $('#image-preview').attr('src', '/produto-composto/imagem/'+data.produtos[0].id);
                    $('#remover_imagem_hidden').val('0'); // Não remover imagem existente
                } else {
                    imageDataUrl = null;
                    $('#image-preview').attr('src', '/static/img/logo.png');
                    $('#remover_imagem_hidden').val('0');
                }
                inicializarSelect2();
                $('#tabela-componentes tbody').empty();
                data.produtos[0].componentes.forEach(componente => {
                    // Extrair datas do campo dados_adicionais (JSON)
                    let dataInicio = null;
                    let dataTermino = null;
                    if (componente.dados_adicionais) {
                        try {
                            const dados = typeof componente.dados_adicionais === 'string' 
                                ? JSON.parse(componente.dados_adicionais) 
                                : componente.dados_adicionais;
                            dataInicio = dados.data_inicio || null;
                            dataTermino = dados.data_termino || null;
                        } catch (e) {
                            console.error('Erro ao parsear dados_adicionais:', e);
                        }
                    }
                    adicionarLinhaTabela(
                        componente.estoque_id,
                        componente.quantidade,
                        componente.nome,
                        null,
                        dataInicio,
                        dataTermino
                    );
                });
               
                
                
                
                // Inicializa o Select2 após o modal ser carregado
                modal.modal('show');
               // Adiciona o listener de paste no documento quando o modal abre
                
 
                // Garante a remoção do listener quando o modal é fechado
                modal.on('hidden.bs.modal', function () {
                    $(document).off('paste.produtoComposto');
                });
            });
            
        }
        
        function inicializarSelect2() {
            $('#select-item-estoque').select2({
                placeholder: "Selecione um item",
                width: '100%',
                dropdownParent: $('#modal-produto-composto'),
                ajax: {
                    url: "/produto-composto/api/itens-estoque",
                    dataType: 'json',
                    delay: 250,
                    data: function(params) {
                        return {
                            q: params.term // search term
                        };
                    },
                    processResults: function(data) {
                        return {
                            results: data.results
                        };
                    },
                    cache: true
                }
            });
        }
        
        function handlePaste(e) {
            // Acessa os itens da área de transferência
            const items = (e.clipboardData || e.originalEvent.clipboardData)?.items;
            if (!items) return;

            for (const item of items) {
                // Verifica se o item é um arquivo de imagem
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    // Impede a ação padrão do navegador (colar texto/imagem)
                    e.preventDefault();
                    const file = item.getAsFile();
                    if (file) {
                        // Usa a nossa função existente para lidar com o arquivo
                        handleFile(file);
                    }
                    // Para após encontrar a primeira imagem
                return;
            }
            }
        }
    
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Por favor, selecione um arquivo de imagem (ex: PNG, JPG).');
                return;
            }
            
            if (file.size > 2 * 1024 * 1024) { // 2MB
                alert('A imagem é muito grande. O tamanho máximo permitido é 2MB.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                $('#image-preview').attr('src', e.target.result);
                $('#btn-remover-imagem').show();
                $('#remover_imagem_hidden').val('0'); // Se o usuário remover e dps add outra
                imageDataUrl = e.target.result;
            }
            reader.readAsDataURL(file);
        }
        
        function adicionarLinhaTabela(estoqueId,quantidade,nomeItem,tipo,dataInicio,dataTermino) {
            console.log('adicionarLinhaTabela');
            // Formatar datas para exibição (YYYY-MM-DD)
            const dataInicioFormatada = dataInicio ? new Date(dataInicio).toISOString().split('T')[0] : '';
            const dataTerminoFormatada = dataTermino ? new Date(dataTermino).toISOString().split('T')[0] : '';
            
            const newRow = `
                <tr data-estoque-id="${estoqueId}" data-tipo="${tipo}">
                    <td>${nomeItem}</td>
                    <td><input type="text" class="form-control form-control-sm quantidade-componente" value="${quantidade}"></td>
                    <td><input type="date" class="form-control form-control-sm data-inicio-componente" value="${dataInicioFormatada}"></td>
                    <td><input type="date" class="form-control form-control-sm data-termino-componente" value="${dataTerminoFormatada}"></td>
                    <td class="text-center">
                        <button type="button" class="btn btn-danger btn-sm btn-remover-item"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;

            $('#tabela-componentes tbody').append(newRow);
        }
    
        function adicionarComponenteTabela() {
            const select = $('#select-item-estoque');
            const selectedOption = select.select2('data')[0];
            const quantidade = $('#quantidade-item').val();

            if (!selectedOption || !quantidade || parseFloat(quantidade) <= 0) {
                alert('Por favor, selecione um item e insira uma quantidade válida.');
                return;
            }
            
            const estoqueId = selectedOption.id;
            const nomeItem = selectedOption.text;
            const tipo = selectedOption.tipo;

            // Verifica se o item já foi adicionado
            if ($(`#tabela-componentes tbody tr[data-estoque-id="${estoqueId}"]`).length > 0) {
                alert('Este item já foi adicionado.');
                return;
            }
            
            adicionarLinhaTabela(estoqueId,quantidade,nomeItem,tipo,null,null);

            // Limpa os campos
            select.val(null).trigger('change');
            $('#quantidade-item').val('');
        }

        function salvarProduto() {
            const produtoId = $('#produto_id').val();
            
            // Coleta de dados dos componentes
            const componentes = [];
            $('#tabela-componentes tbody tr').each(function() {
                const row = $(this);
                const quantidadeValor = row.find('.quantidade-componente').val();
                
                // Garantir que a quantidade seja tratada como número decimal
                const quantidade = parseFloat(quantidadeValor) || 0;
                
                console.log(`Componente - Estoque ID: ${row.data('estoque-id')}, Valor original: "${quantidadeValor}", Valor convertido: ${quantidade}`);
                
                const estoqueId = row.data('estoque-id');
                const tipo = row.data('tipo');
                
                // Coletar datas
                const dataInicio = row.find('.data-inicio-componente').val() || null;
                const dataTermino = row.find('.data-termino-componente').val() || null;
                
                // Criar objeto de dados adicionais
                const dadosAdicionais = {};
                if (dataInicio) dadosAdicionais.data_inicio = dataInicio;
                if (dataTermino) dadosAdicionais.data_termino = dataTermino;
                
                componentes.push({
                    // Pode ser number (estoque_id) ou string (ex: "material:123")
                    estoque_id: String(estoqueId),
                    quantidade: quantidade,
                    tipo: tipo,
                    dados_adicionais: Object.keys(dadosAdicionais).length > 0 ? dadosAdicionais : null
                });
            });

            // Coletar traco do produto composto (campo direto do banco)
            const traco = $('#traco').is(':checked') ? 1 : 0;

            const dadosProduto = {
                id: produtoId || null,
                nome: $('#nome').val(),
                descricao: $('#descricao').val(),
                tempo_producao: $('#tempo_producao').val() || null,
                status: $('#status').val(),
                traco: traco,
                componentes: componentes,
                imagem: imageDataUrl || null, // Envia a imagem em base64 ou null se não houver
                remover_imagem: $('#remover_imagem_hidden').val() === '1'
            };

            console.log('Dados a serem enviados:', dadosProduto);
            console.log('ImageDataUrl:', imageDataUrl);

            fetch('/produto-composto/salvar',{
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token() }}'
                },
                body: JSON.stringify(dadosProduto)
            })
            .then(response => response.json())
            .then(data => {
                    if (data.success) {
                        // Fechar modal corretamente
                        fecharModal('#modal-produto-composto');
                        
                        // Mostrar mensagem de sucesso
                        showAlert('success', data.message);
                        
                        // Recarregar a tabela via AJAX
                        carregarProduto(0);
                    } else {
                        showAlert('danger', 'Erro: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Erro ao salvar:', error);
                    showAlert('danger', 'Erro ao salvar produto composto. Tente novamente.');
                });
        }

        function showAlert(type, message) {
            // Remover alertas anteriores
            $('.alert').remove();
            
            // Criar novo alerta
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            `;
            
            // Inserir no topo da página
            $('.container-fluid').prepend(alertHtml);
            
            // Auto-remover após 5 segundos
            setTimeout(function() {
                $('.alert').fadeOut();
            }, 5000);
        }

        function recarregarTabela() {
            fetch('/produto-composto/')
            .then(response => response.text())
            .then(data => {
                // Extrair apenas o conteúdo da tabela do HTML retornado
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = data;
                const novaTabela = tempDiv.querySelector('#tabela-produtos-compostos tbody').innerHTML;
                
                // Atualizar o conteúdo da tabela
                document.querySelector('#tabela-produtos-compostos tbody').innerHTML = novaTabela;
                
                // Mostrar mensagem de sucesso
                showAlert('success', 'Tabela atualizada com sucesso!');
            })
            .catch(error => {
                console.error('Erro ao recarregar tabela:', error);
                showAlert('warning', 'Tabela salva, mas houve erro ao atualizar a visualização.');
            });
        }
        });
</script>
{% endblock %}
