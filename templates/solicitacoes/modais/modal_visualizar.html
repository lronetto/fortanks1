<!-- Modal de Visualização -->
<div class="modal fade" id="visualizarModal" tabindex="-1" aria-labelledby="visualizarModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="visualizarModalLabel">Solicitação #</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Data de Solicitação:</strong><p id="data_solicitacao"></p></p>
                        <p><strong>Data de Necessidade:</strong><p id="data_necessidade"></p></p>
                        <p><strong>Centro de Custo:</strong><p id="centro_custo"></p></p>
                        <p><strong>Solicitante:</strong><p id="solicitante"></p></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Status:</strong> 
                            <span class="badge" id="status">
                                
                            </span>
                        </p>
                        <p><strong>Aprovador:</strong><p id="aprovador"></p></p>
                        <p><strong>Data de Aprovação:</strong><p id="data_aprovacao"></p></p>
                    </div>
                </div>
                
                <div class="mt-3">
                    <h6>Observações:</h6>
                    <p class="text-muted" id="observacoes"></p>
                </div>
                
                <div class="mt-4">
                    <h6>Itens da Solicitação:</h6>
                    <div class="table-responsive">
                        <table class="table table-sm" id="tabelaItensVisualizar">
                            <thead>
                                <tr>
                                    <th>Material</th>
                                    <th>Quantidade</th>
                                    <th>Unidade</th>
                                    <th>Codigo SOX</th>
                                    <th>Observações</th>
                                </tr>
                            </thead>
                            <tbody>

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-info" id="btnExportarPDF">
                    <i class="fas fa-file-pdf"></i> Exportar PDF
                </button>
                    <button type="button" class="btn btn-warning btn-editar" data-bs-toggle="modal" data-bs-target="#editarModal" data-id="" data-bs-dismiss="modal" id="btnVisualizarEditar">
                        <i class="fas fa-edit"></i> Editar
                    </button>
                    <button type="button" class="btn btn-success btn-aprovar" 
                    data-bs-toggle="modal" 
                    data-bs-target="#aprovarModal" 
                    data-bs-dismiss="modal" 
                    data-id="" 
                    id="btnVisualizarAprovar">
                        <i class="fas fa-check"></i> Aprovar
                    </button>
                    <button type="button" class="btn btn-danger btn-rejeitar" data-bs-toggle="modal" data-bs-target="#rejeitarModal" data-id="" data-bs-dismiss="modal" id="btnVisualizarRejeitar">
                        <i class="fas fa-times"></i> Rejeitar
                    </button>
                    <button type="button" class="btn btn-secondary btn-cancelar" data-bs-toggle="modal" data-bs-target="#cancelarModal" data-bs-dismiss="modal" id="btnVisualizarCancelar">
                        <i class="fas fa-ban"></i> Cancelar
                    </button>

                <button type="button" class="btn btn-sm btn-primary"
                        data-bs-toggle="modal"
                        data-id=""
                        data-bs-target="#enviarEmailAprovacaoModal"
                        data-bs-dismiss="modal"
                        title="Enviar Email de Aprovação">
                    <i class="fas fa-envelope"></i> Enviar Email
                </button>

                <button type="button" class="btn btn-sm btn-secondary btn-enviar-pdf-email"
                        data-bs-toggle="modal"
                        data-id=""
                        data-bs-target="#enviarPdfEmailModal"
                        data-bs-dismiss="modal"
                        title="Enviar PDF por Email">
                    <i class="fas fa-file-export"></i> Enviar PDF
                </button>
            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    visualizarButtons = document.querySelectorAll('.btn-visualizar');
    visualizarButtons.forEach(button => {
        button.addEventListener('click', function() {
            console.log('teste');
            const id = this.getAttribute('data-id');
            $(".btn-enviar-pdf-email").attr('data-id', id);
            $('#btnExportarPDF').attr('data-id', id);
            $('#btnVisualizarEditar').attr('data-id', id);
            $('#btnVisualizarAprovar').attr('data-id', id);
            $('#btnVisualizarRejeitar').attr('data-id', id);
            $('#btnVisualizarCancelar').attr('data-id', id);
            $('#btnEnviarEmail').attr('data-id', id);
            $('#btnEnviarPDF').attr('data-id', id);
            carregarDadosSolicitacaoVisualizar(id)
        });
    });
    let itensSolicitacoes = [];
    function carregarDadosSolicitacaoVisualizar(id) {
        console.log(id);
        const modal = $('#visualizarModal');
        const tabelaItens = $('#tabelaItensVisualizar tbody');
        tabelaItens.empty();
        tabelaItens.append('<tr><td colspan="5">Carregando...</td></tr>');
        // Carregar dados via AJAX
        $.get('/solicitacoes/'+id+'/dados', function(data) {
            console.log(data);
            // Preencher dados do formulário
            $('#editar_data_necessidade').val(data.data_necessidade);
            $('#editar_centro_custo_id').val(data.centro_custo_id);
            $('#editar_observacoes').val(data.observacoes);
            console.log('teste1');
            // Limpar e preencher itens
            preencherDadosSolicitacaoVisualizar(data);
            console.log('teste2');
            

        }).fail(function(jqXHR) {
            if (jqXHR.status === 403) {
                alert('Você não tem permissão para editar esta solicitação.');
                modal.modal('hide');
            } else {
                alert('Erro ao carregar dados da solicitação. Tente novamente.');
            }
        });
    };
    function preencherDadosSolicitacaoVisualizar(data) {
        console.log(data);
        $('#visualizarModalLabel').text('Solicitação #'+data.id);
        $('#data_solicitacao').text(data.data_solicitacao);
        $('#data_necessidade').text(data.data_necessidade);
        $('#centro_custo').text(data.centro_custo_codigo + ' - ' + data.centro_custo_nome);
        $('#solicitante').text(data.solicitante_nome);
        $('#status').text(data.status);
        $('#aprovador').text(data.aprovador_nome);
        const tabelaItens = $('#tabelaItensVisualizar tbody');
        tabelaItens.empty();
        for (let i = 0; i < data.itens.length; i++) {
            tabelaItens.append(`<tr id="item${data.itens[i].id}">
                <td>${data.itens[i].material.nome}</td>
                <td>${data.itens[i].quantidade}</td>
                <td>${data.itens[i].material.unidade_obj.nome}</td>
                <td>${data.itens[i].material.codigo}</td>
                <td>${data.itens[i].observacoes}</td>
            </tr>`);
        }
    };

});

</script>
{% endblock %}
