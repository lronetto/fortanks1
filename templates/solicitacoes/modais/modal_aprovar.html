<!-- Modal de Aprovação -->
<div class="modal fade" id="aprovarModal" tabindex="-1" aria-labelledby="aprovarModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="aprovarModalLabel">Confirmar Aprovação</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form action="" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-success">Confirmar Aprovação</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const aprovarModal = document.getElementById('aprovarModal');
        const aprovarButtons = document.querySelectorAll('.btn-aprovar');
        aprovarButtons.forEach(button => {
            button.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                $('.modal-body p').text('Tem certeza que deseja aprovar a solicitação <strong>#' + id + '</strong>?');
                $('.modal-footer form').attr('action', '/solicitacoes/' + id + '/aprovar');
                $('#aprovarModal').attr('data-id', id);
            });
        });
    });
</script>
{% endblock %}
