<!-- Modal de Rejeição -->
{% if solicitacao.status == 'Pendente' and current_user.is_gerente_ou_superior %}
<div class="modal fade" id="rejeitarModal{{ solicitacao.id }}" tabindex="-1" aria-labelledby="rejeitarModalLabel{{ solicitacao.id }}" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="rejeitarModalLabel{{ solicitacao.id }}">Confirmar Rejeição</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja rejeitar a solicitação <strong>#{{ solicitacao.numero }}</strong>?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form action="{{ url_for('solicitacao.rejeitar', id=solicitacao.id) }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-danger">Confirmar Rejeição</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endif %}

{% block scripts %}
<!-- Nenhum script JS específico para este modal -->
{% endblock %}
