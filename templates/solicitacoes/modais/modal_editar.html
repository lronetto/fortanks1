<!-- Modal de Edição de Solicitação -->
<div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-warning text-white">
                <h5 class="modal-title" id="editarModalLabel">Editar Solicitação </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p>Carregando dados da solicitação...</p>
                </div>
                <form method="POST" action="" id="formEditarSolicitacao" style="display: none;">
                    <input type="hidden" name="id" value="">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="card mb-4">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">Informações da Solicitação</h5>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group mb-3">
                                                <label for="editar_data_necessidade">Data de Necessidade</label>
                                                <input type="date" class="form-control" id="editar_data_necessidade" name="editar_data_necessidade" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group mb-3">
                                                <label for="editar_centro_custo_id">Centro de Custo</label>
                                                <select class="form-control" id="editar_centro_custo_id" name="editar_centro_custo_id" required>
                                                    <option value="">Selecione...</option>
                                                    {% for centro in centros_custo %}
                                                    <option value="{{ centro.id }}">
                                                        {{ centro.codigo }} - {{ centro.nome }}
                                                    </option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="form-group mb-3">
                                                <label for="editar_observacoes">Observações</label>
                                                <textarea class="form-control" id="editar_observacoes" name="editar_observacoes" rows="3"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">Itens da Solicitação</h5>
                                </div>
                                <div class="card-body">
                                    <div class="row mb-3">
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="editar_material_id">Material</label>
                                                <select class="form-control material-select" id="editar_material_id" data-id="">
                                                    <option value="">Selecione...</option>
                                                    {% for material in materiais %}
                                                    <option value="{{ material.id }}" data-unidade_id="{{ material.unidade_obj.id }}" data-unidade_nome="{{ material.unidade_obj.nome }}">
                                                        {{ material.nome }}
                                                    </option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label for="editar_quantidade">Quantidade</label>
                                                <input type="number" class="form-control" id="editar_quantidade" step="0.01">
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label for="editar_unidade">Unidade</label>
                                                <input type="text" class="form-control" id="editar_unidade" data-unidade_id="" readonly>
                                            </div>
                                        </div>
                                        <div class="col-md-2">
                                            <div class="form-group">
                                                <label>&nbsp;</label>
                                                <button type="button" class="btn btn-primary w-100 btn-adicionar-item" data-id="">
                                                    <i class="fas fa-plus"></i> Adicionar
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="table-responsive">
                                        <table class="table table-striped" id="tabelaItensEdicao">
                                            <thead>
                                                <tr>
                                                    <th>Material</th>
                                                    <th>Quantidade</th>
                                                    <th>Unidade</th>
                                                    <th>Observações</th>
                                                    <th>Ações</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <!-- Itens serão carregados via AJAX -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary btn-salvar-edicao" data-id="">
                    <i class="fas fa-save"></i> Salvar Alterações
                </button>
            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script>
     
document.addEventListener('DOMContentLoaded', function() {
    const form = $('#formEditarSolicitacao');
    let itensSolicitacoes = [];
    editButtons = document.querySelectorAll('.btn-editar');
    editButtons.forEach(button => {
        button.addEventListener('click', function() {
            const id = this.getAttribute('data-id');
            $('input[name="id"]').val(id);
            carregarDadosSolicitacao(id)
        });
    });
    function carregarDadosSolicitacao(id) {
        const modal = $('#editarModal');
        const form = modal.find('form');
        const spinner = modal.find('.spinner-border').parent();
        
        // Limpar itens anteriores
        itensSolicitacoes = [];
        
        // Mostrar spinner e esconder formulário
        spinner.show();
        form.hide();
        
        // Carregar dados via AJAX
        $.get('/solicitacoes/'+id+'/dados', function(data) {
            // Preencher dados do formulário
            $('#editar_data_necessidade').val(data.data_necessidade);
            $('#editar_centro_custo_id').val(data.centro_custo_id);
            $('#editar_observacoes').val(data.observacoes || '');
            
            // Limpar e preencher itens (normalizar estrutura)
            itensSolicitacoes = data.itens.map(item => ({
                material_id: item.material_id,
                material: {
                    nome: item.material?.nome || '',
                    unidade_obj: {
                        nome: item.material?.unidade_obj?.nome || ''
                    }
                },
                quantidade: item.quantidade,
                unidade_id: item.unidade_id,
                observacoes: item.observacoes || ''
            }));
            
            atualizarTabelaItensEdicao(itensSolicitacoes);
            
            // Esconder spinner e mostrar formulário
            spinner.hide();
            form.show();
        }).fail(function(jqXHR) {
            if (jqXHR.status === 403) {
                alert('Você não tem permissão para editar esta solicitação.');
                modal.modal('hide');
            } else {
                alert('Erro ao carregar dados da solicitação. Tente novamente.');
            }
        });
    };
    function atualizarTabelaItensEdicao(itens) {
        const tabela = $(`#tabelaItensEdicao tbody`);
        tabela.empty();
        
        if (!itens || itens.length === 0) {
            tabela.append('<tr><td colspan="5" class="text-center">Nenhum item adicionado.</td></tr>');
            return;
        }
        
        itens.forEach((item, index) => {
            const tr = $('<tr>');
            
            // Normalizar estrutura de dados - suporta tanto itens do servidor quanto itens adicionados manualmente
            const materialNome = item.material?.nome || item.material_nome || '';
            const unidadeNome = item.material?.unidade_obj?.nome || item.unidade_nome || '';
            
            tr.append(`<td>${materialNome}</td>`);
            
            // Célula de quantidade editável
            const tdQuantidade = $('<td>');
            const inputQuantidade = $('<input>')
                .attr('type', 'number')
                .attr('step', '0.01')
                .attr('min', '0.01')
                .addClass('form-control form-control-sm')
                .val(item.quantidade || '')
                .on('change', function() {
                    const novaQuantidade = parseFloat($(this).val());
                    if (isNaN(novaQuantidade) || novaQuantidade <= 0) {
                        alert('A quantidade deve ser um número maior que zero.');
                        $(this).val(itensSolicitacoes[index].quantidade);
                        return;
                    }
                    itensSolicitacoes[index].quantidade = novaQuantidade;
                })
                .on('blur', function() {
                    // Garantir que o valor seja atualizado mesmo se o usuário apenas clicar fora
                    const valor = parseFloat($(this).val());
                    if (!isNaN(valor) && valor > 0) {
                        itensSolicitacoes[index].quantidade = valor;
                    }
                });
            tdQuantidade.append(inputQuantidade);
            tr.append(tdQuantidade);
            
            tr.append(`<td>${unidadeNome}</td>`);
            
            const tdObs = $('<td>');
            const inputObs = $('<input>')
                .attr('type', 'text')
                .addClass('form-control form-control-sm')
                .val(item.observacoes || '')
                .on('change', function() {
                    itensSolicitacoes[index].observacoes = $(this).val();
                });
            tdObs.append(inputObs);
            tr.append(tdObs);
            
            const tdAcoes = $('<td>');
            const btnRemover = $('<button>')
                .addClass('btn btn-sm btn-danger')
                .html('<i class="fas fa-trash"></i>')
                .on('click', function() {
                    if (confirm('Tem certeza que deseja remover este item?')) {
                        itensSolicitacoes.splice(index, 1);
                        atualizarTabelaItensEdicao(itensSolicitacoes);
                    }
                });
            tdAcoes.append(btnRemover);
            tr.append(tdAcoes);
            
            tabela.append(tr);
        });
}
// Scripts específicos para edição de solicitação
    // Inicializar select2 para o select de material
    $('#editar_material_id').select2({
        dropdownParent: $('#editarModal'),
        width: '100%',
        placeholder: 'Selecione um material'
    });

    // Atualizar unidade ao selecionar material
    $('#editar_material_id').change(function() {
        const unidade_id = $(this).find('option:selected').data('unidade_id') || '';
        const unidade_nome = $(this).find('option:selected').data('unidade_nome') || '';
        $('#editar_unidade').val(unidade_nome);
        $('#editar_unidade').data('unidade_id', unidade_id);
    });
   
    // Carregar dados da solicitação quando o modal for aberto
    

    // Adicionar item à solicitação em edição
    $('.btn-adicionar-item').click(function() {
        const materialSelect = $('#editar_material_id');
        const quantidade = $('#editar_quantidade').val();
        const unidade_id = $('#editar_unidade').data('unidade_id');
        const unidade_nome = $('#editar_unidade').val();
        
        if (!materialSelect.val() || !quantidade) {
            alert('Selecione um material e informe a quantidade.');
            return;
        }
        
        const materialNome = materialSelect.find('option:selected').text();
        const materialId = materialSelect.val();
        
        if (!itensSolicitacoes) {
            itensSolicitacoes = [];
        }
        
        // Verificar se o material já foi adicionado
        const materialJaExiste = itensSolicitacoes.some(item => {
            const itemMaterialId = item.material_id || item.material?.id;
            return itemMaterialId == materialId;
        });
        
        if (materialJaExiste) {
            alert('Este material já foi adicionado à solicitação.');
            return;
        }
        
        // Adicionar item com estrutura normalizada (compatível com itens do servidor)
        itensSolicitacoes.push({
            material_id: materialId,
            material: {
                nome: materialNome,
                unidade_obj: {
                    nome: unidade_nome
                }
            },
            quantidade: parseFloat(quantidade),
            unidade_id: unidade_id,
            observacoes: ''
        });
        
        atualizarTabelaItensEdicao(itensSolicitacoes);
        
        // Limpar campos
        materialSelect.val('').trigger('change');
        $('#editar_quantidade').val('');
        $('#editar_unidade').val('');
        $('#editar_unidade').data('unidade_id', '');
    });

    // Salvar edição de solicitação
    $('.btn-salvar-edicao').click(function() {
        const id = $('input[name="id"]').val()
        form.attr('action', '/solicitacoes/'+id+'/editar');
        
        // Verificar se há itens
        if (!itensSolicitacoes || itensSolicitacoes.length === 0) {
            alert('Adicione pelo menos um item à solicitação.');
            return;
        }
        
        // Adicionar os itens ao formulário
        form.find('input[name^="editar_material_id"], input[name^="editar_quantidade"], input[name^="editar_unidade"], input[name^="editar_observacoes_item"]').remove();
        
        itensSolicitacoes.forEach((item, index) => {
            const materialId = item.material_id || item.material?.id || '';
            const quantidade = item.quantidade || '';
            const unidadeId = item.unidade_id || '';
            const observacoes = (item.observacoes || '').replace(/"/g, '&quot;');
            
            form.append(`<input type="hidden" name="editar_material_id[]" value="${materialId}">`);
            form.append(`<input type="hidden" name="editar_quantidade[]" value="${quantidade}">`);
            form.append(`<input type="hidden" name="editar_unidade[]" value="${unidadeId}">`);
            form.append(`<input type="hidden" name="editar_observacoes_item[]" value="${observacoes}">`);
        });
        
        // Submeter o formulário
        form.submit();
    });
});


</script>
{% endblock %}
