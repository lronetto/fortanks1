<!-- Modal Visualizar Certificado -->
<div class="modal fade" id="modalVisualizarCertificado" tabindex="-1" aria-labelledby="modalVisualizarCertificadoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title" id="modalVisualizarCertificadoLabel"><i class="fas fa-eye"></i> Detalhes do Certificado</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <dl class="row" id="detalhes_certificado">
                    <!-- Detalhes serão carregados via JavaScript -->
                </dl>
                
                <hr>
                
                <h6 class="mb-3">Documentos Anexos</h6>
                <div id="documentos_visualizacao" class="list-group">
                    <!-- Documentos serão carregados via JavaScript -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>
