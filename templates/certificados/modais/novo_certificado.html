<!-- Modal Novo Certificado -->
<div class="modal fade" id="modalNovoCertificado" tabindex="-1" aria-labelledby="modalNovoCertificadoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('certificado.novo') }}" id="form-novo-certificado" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalNovoCertificadoLabel"><i class="fas fa-plus-circle"></i> Novo Certificado</h5>
                    <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="nome" class="form-label">Nome *</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="tipo_id" class="form-label">Tipo</label>
                            <select class="form-select" id="tipo_id" name="tipo_id">
                                <option value="">Selecione um tipo</option>
                                {% for tipo in tipos %}
                                <option value="{{ tipo.id }}">{{ tipo.nome }}</option>
                                {% endfor %}
                            </select>
                            <input type="hidden" id="tipo" name="tipo" value="">
                        </div>
                        <div class="col-md-6">
                            <label for="data" class="form-label">Data</label>
                            <input type="date" class="form-control" id="data" name="data">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="data_vencimento" class="form-label">Data de Vencimento</label>
                            <input type="date" class="form-control" id="data_vencimento" name="data_vencimento">
                        </div>
                    </div>
                    
                    <!-- Campos dinâmicos baseados no tipo selecionado -->
                    <div id="campos_dinamicos" style="display: none;">
                        <hr>
                        <h6 class="mb-3">Campos Específicos do Tipo</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered table-sm" id="campos_dinamicos_container">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 30%;">Campo</th>
                                        <th style="width: 70%;">Valor</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Campos serão renderizados dinamicamente via JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="documentos" class="form-label">Documentos Anexos</label>
                            <input type="file" class="form-control" id="documentos" name="documento_0" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                            <small class="text-muted">Você pode selecionar múltiplos arquivos</small>
                        </div>
                    </div>
                    
                    <div class="row mb-3" id="dados_adicionais_container" style="display: none;">
                        <div class="col-md-12">
                            <label for="dados_adicionais" class="form-label">Dados Adicionais (JSON)</label>
                            <textarea class="form-control" id="dados_adicionais" name="dados_adicionais" rows="5" placeholder='{"campo1": "valor1", "campo2": "valor2"}'></textarea>
                            <small class="text-muted" id="dados_adicionais_help">Este campo é preenchido automaticamente com os campos específicos</small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    // Função para renderizar campos dinâmicos baseados no tipo
    function renderizarCamposDinamicos(campos) {
        const container = document.querySelector('#campos_dinamicos_container tbody');
        const camposDiv = document.getElementById('campos_dinamicos');
        
        if (!container || !camposDiv) return;
        
        // Limpar campos anteriores
        container.innerHTML = '';
        
        if (!campos || campos.length === 0) {
            camposDiv.style.display = 'none';
            return;
        }
        
        camposDiv.style.display = 'block';
        
        campos.forEach(campo => {
            const campoNome = campo.nome || '';
            const campoLabel = campo.label || campoNome;
            const campoTipo = campo.tipo || 'text';
            const campoObrigatorio = campo.obrigatorio || false;
            
            const row = document.createElement('tr');
            
            let inputHtml = '';
            const inputId = `campo_${campoNome}`;
            const inputName = `campo_${campoNome}`;
            const requiredAttr = campoObrigatorio ? 'required' : '';
            
            switch(campoTipo) {
                case 'textarea':
                    inputHtml = `<textarea class="form-control form-control-sm" id="${inputId}" name="${inputName}" rows="2" ${requiredAttr}></textarea>`;
                    break;
                case 'number':
                    inputHtml = `<input type="number" class="form-control form-control-sm" id="${inputId}" name="${inputName}" step="any" ${requiredAttr}>`;
                    break;
                case 'date':
                    inputHtml = `<input type="date" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr}>`;
                    break;
                case 'email':
                    inputHtml = `<input type="email" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr}>`;
                    break;
                case 'tel':
                    inputHtml = `<input type="tel" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr}>`;
                    break;
                case 'url':
                    inputHtml = `<input type="url" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr}>`;
                    break;
                case 'select':
                case 'lista':
                    let opcoesHtml = '<option value="">Selecione...</option>';
                    if (campo.opcoes && Array.isArray(campo.opcoes)) {
                        campo.opcoes.forEach(opcao => {
                            const opcaoValue = opcao.value || opcao.valor || '';
                            const opcaoLabel = opcao.label || opcao.texto || opcaoValue;
                            opcoesHtml += `<option value="${opcaoValue}">${opcaoLabel}</option>`;
                        });
                    }
                    inputHtml = `<select class="form-select form-select-sm" id="${inputId}" name="${inputName}" ${requiredAttr}>${opcoesHtml}</select>`;
                    break;
                default:
                    inputHtml = `<input type="text" class="form-control form-control-sm" id="${inputId}" name="${inputName}" ${requiredAttr}>`;
            }
            
            row.innerHTML = `
                <td>
                    <label for="${inputId}" class="form-label mb-0 fw-normal">${campoLabel}${campoObrigatorio ? ' <span class="text-danger">*</span>' : ''}</label>
                </td>
                <td>
                    ${inputHtml}
                </td>
            `;
            
            container.appendChild(row);
        });
    }

    // Função para carregar campos do tipo selecionado
    function carregarCamposTipo(tipoId) {
        if (!tipoId) {
            document.getElementById('campos_dinamicos').style.display = 'none';
            document.getElementById('tipo').value = '';
            return;
        }
        
        fetch(`{{ url_for('certificado.get_campos_tipo', tipo_id=0) }}`.replace('0', tipoId))
            .then(response => response.json())
            .then(data => {
                // Atualizar nome do tipo no campo hidden
                const tipoSelect = document.getElementById('tipo_id');
                const tipoHidden = document.getElementById('tipo');
                if (tipoSelect && tipoHidden) {
                    const selectedOption = tipoSelect.options[tipoSelect.selectedIndex];
                    tipoHidden.value = selectedOption ? selectedOption.text : '';
                }
                
                // Renderizar campos dinâmicos
                renderizarCamposDinamicos(data.campos);
            })
            .catch(error => {
                console.error('Erro ao carregar campos do tipo:', error);
            });
    }

    // Função para coletar dados dos campos dinâmicos
    function coletarDadosDinamicos() {
        const dados = {};
        const campos = document.querySelectorAll('#campos_dinamicos_container input, #campos_dinamicos_container textarea, #campos_dinamicos_container select');
        
        campos.forEach(campo => {
            const name = campo.name;
            if (name && name.startsWith('campo_')) {
                const campoNome = name.replace('campo_', '');
                dados[campoNome] = campo.value;
            }
        });
        
        return dados;
    }

    // Inicializar quando o modal for aberto
    document.addEventListener('DOMContentLoaded', function() {
        const tipoSelect = document.getElementById('tipo_id');
        if (tipoSelect) {
            tipoSelect.addEventListener('change', function() {
                carregarCamposTipo(this.value);
            });
        }
        
        // Formatar dados antes de enviar formulário
        const formNovo = document.getElementById('form-novo-certificado');
        if (formNovo) {
            formNovo.addEventListener('submit', function(e) {
                const dadosDinamicos = coletarDadosDinamicos();
                const dadosAdicionaisInput = document.getElementById('dados_adicionais');
                if (dadosAdicionaisInput && Object.keys(dadosDinamicos).length > 0) {
                    dadosAdicionaisInput.value = JSON.stringify(dadosDinamicos);
                }
            });
        }
    });
})();
</script>
