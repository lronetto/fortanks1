<!-- Modal para Adicionar Item ao Inventário -->
<div class="modal fade" id="modalAdicionarItem" tabindex="-1" role="dialog" aria-labelledby="modalAdicionarItemLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalAdicionarItemLabel">
                    <i class="fas fa-plus"></i> Adicionar Item ao Inventário
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Fechar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="buscaItemInventario">Buscar Item</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="buscaItemInventario" 
                               placeholder="Digite o nome ou código do item (mínimo 3 caracteres)">
                        <div class="input-group-append">
                            <button class="btn btn-primary" type="button" id="btnBuscarItemInventario">
                                <i class="fas fa-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                </div>
                
                <div id="resultadosBuscaInventario" class="d-none mt-3">
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm">
                            <thead class="thead-light">
                                <tr>
                                    <th style="width: 5%">
                                        <input type="checkbox" id="selecionarTodosItens" title="Selecionar todos">
                                    </th>
                                    <th style="width: 15%">Código</th>
                                    <th style="width: 30%">Nome</th>
                                    <th style="width: 15%">Tipo</th>
                                    <th style="width: 15%">Localização</th>
                                    <th style="width: 20%">Qtd. Sistema</th>
                                </tr>
                            </thead>
                            <tbody id="resultadosItensInventario">
                                <!-- Resultados da busca serão inseridos aqui -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <div id="mensagemBuscaInventario" class="alert alert-info d-none mt-3">
                    <i class="fas fa-info-circle"></i> <span id="textoMensagemBusca"></span>
                </div>
            </div>
            <div class="modal-footer">
                <div class="mr-auto">
                    <span id="contadorItensSelecionados" class="badge badge-info" style="display: none;">0 itens selecionados</span>
                </div>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="btnAdicionarItemInventario" disabled>
                    <i class="fas fa-plus"></i> Adicionar Itens Selecionados
                </button>
            </div>
        </div>
    </div>
</div>
