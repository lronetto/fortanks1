<!-- Modal de Criação de Unidade -->
<div class="modal fade" id="modalCriarUnidade" tabindex="-1" aria-labelledby="modalCriarUnidadeLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formCriarUnidade" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCriarUnidadeLabel">
                        <i class="fas fa-plus"></i> Nova Unidade
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nome_criar" class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nome_criar" name="nome" 
                            maxlength="10" required>
                        <div class="form-text">Nome da unidade (máximo 10 caracteres). Ex: KG, L, M, etc.</div>
                        <div class="invalid-feedback">
                            Por favor, informe o nome da unidade.
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="descricao_criar" class="form-label">Descrição</label>
                        <input type="text" class="form-control" id="descricao_criar" name="descricao" 
                            maxlength="100">
                        <div class="form-text">Descrição detalhada da unidade. Ex: Quilograma, Litro, Metro.</div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="padrao_criar" name="padrao">
                        <label class="form-check-label" for="padrao_criar">Definir como unidade padrão</label>
                        <div class="form-text">A unidade padrão será usada quando nenhuma outra for especificada.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
