<div class="modal fade" id="modalTransporte" tabindex="-1" aria-labelledby="modalTransporteLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <style>
        .select2-container--bootstrap-5 .select2-dropdown {
          max-height: 300px;
          overflow-y: auto;
        }
        #modalTransporte .select2-container {
          z-index: 9999;
        }
        #modalTransporte .select2-dropdown {
          z-index: 9999;
        }
      </style>
      <form id="formTransporte" method="post" action="{{ url_for('acabamento_transporte.transporte') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="peca_ids" id="peca_ids">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTransporteLabel">Registrar Transporte</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transporte-tanque_id" class="form-label">Tanque</label>
            <select class="form-select" id="transporte-tanque_id" name="transporte-tanque_ids[]" required>
                <!-- As opções serão carregadas via AJAX pelo select2 -->
            </select>
          </div>
          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="1" id="transporte-apenasAcabadas">
              <label class="form-check-label" for="transporte-apenasAcabadas">
                Mostrar apenas peças acabadas
              </label>
            </div>
          </div>
          <div class="mb-3">
            <label for="transporte-peca_id" class="form-label">Peça(s) (pesquise pelo nome)</label>
            <select class="form-select" id="transporte-peca_id" name="transporte-peca_ids[]" required style="width: 100%" multiple>
                <!-- As opções serão carregadas via AJAX pelo select2 -->
            </select>
          </div>
          <div class="mb-3">
            <label for="nota_fiscal" class="form-label">Nota Fiscal</label>
            <input type="text" class="form-control" id="nota_fiscal" name="nota_fiscal" required>
          </div>
          <div class="mb-3">
            <label for="placa_carreta" class="form-label">Placa da Carreta</label>
            <input type="text" class="form-control" id="placa_carreta" name="placa_carreta" required>
          </div>
          <div class="mb-3">
            <label for="data_transporte" class="form-label">Data do Transporte</label>
            <input type="date" class="form-control" id="data_transporte" name="data_transporte" value="{{ now}}">
          </div>
          <div class="mb-3">
            <label for="transportadora" class="form-label">Transportadora</label>
            <input type="text" class="form-control" id="transportadora" name="transportadora" required>
          </div>
          
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
