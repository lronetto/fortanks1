<!-- Modal de Exclusão -->
<div class="modal fade" id="modalExcluir" tabindex="-1" aria-labelledby="modalExcluirLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalExcluirLabel">Confirmar Exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja excluir esta concretagem?</p>
                <input type="hidden" id="concretagem_id" name="id">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btnConfirmarExclusao">Excluir</button>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#btnConfirmarExclusao').on('click', function() {
            const id = $('#concretagem_id').val();
            
            $.ajax({
                url: `/concretagens/api/${id}/excluir`,
                method: 'POST',
                headers: {
                    'X-CSRFToken': $('#csrf_token_global').val()
                },
                success: function(response) {
                    if (response.success) {
                        $('#modalExcluir').modal('hide');
                        $('#tabelaConcretagens').DataTable().ajax.reload();
                        alert('Concretagem excluída com sucesso!');
                    } else {
                        alert('Erro: ' + (response.message || 'Erro ao excluir concretagem'));
                    }
                },
                error: function() {
                    alert('Erro ao excluir concretagem. Tente novamente.');
                }
            });
        });
    });
</script>
