<!-- Modal de Redosagem -->
<style>
    /* Garantir que o modal de redosagem apareça acima de outros modais sem desabilitá-los */
    #modalRedosagem {
        z-index: 1065 !important;
    }
    #modalRedosagem.show {
        z-index: 1065 !important;
    }
    body.modal-open #modalRedosagem {
        z-index: 1065 !important;
    }
    /* Não adicionar backdrop adicional - usar o backdrop do modal pai */
    #modalRedosagem + .modal-backdrop {
        display: none !important;
    }
    /* Garantir que o modal de redosagem seja clicável mesmo com backdrop do modal pai */
    #modalRedosagem .modal-dialog {
        pointer-events: auto !important;
    }
    #modalRedosagem .modal-content {
        pointer-events: auto !important;
    }
</style>
<div class="modal fade" id="modalRedosagem" tabindex="-1" aria-labelledby="modalRedosagemLabel" aria-hidden="true" data-bs-backdrop="false">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalRedosagemLabel">Redosagem de Materiais</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Mensagens de erro/sucesso -->
                <div id="mensagemRedosagem" class="alert d-none" role="alert"></div>
                
                <!-- Informações do traço e volume -->
                <div class="row mb-3">
                    <div class="col-12">
                        <div class="card bg-light">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <strong>Traço:</strong> <span id="redosagemTracoNome">-</span>
                                    </div>
                                    <div class="col-md-6">
                                        <strong>Volume (m³):</strong> <span id="redosagemVolume">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Tabela de materiais -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Material</th>
                                <th>Quantidade Base (por m³)</th>
                                <th>Quantidade Total</th>
                                <th>Unidade</th>
                                <th>Quantidade Redosada</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaMateriaisRedosagem">
                            <tr>
                                <td colspan="5" class="text-center text-muted">
                                    <i class="fas fa-spinner fa-spin"></i> Carregando materiais...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnSalvarRedosagem">
                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    Salvar Redosagem
                </button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    let materiaisRedosagem = [];
    let volumeAtual = 0;
    
    // Função para carregar materiais do traço
    function carregarMateriaisTraco(produtoCompostoId, volume, usinagemId = null) {
        if (!produtoCompostoId || !volume || volume <= 0) {
            $('#mensagemRedosagem').removeClass('d-none alert-success').addClass('alert-danger');
            $('#mensagemRedosagem').html('<i class="fas fa-exclamation-circle"></i> Selecione um traço e informe o volume antes de abrir a redosagem.');
            $('#tabelaMateriaisRedosagem').html('<tr><td colspan="5" class="text-center text-muted">Nenhum material disponível.</td></tr>');
            return;
        }
        
        volumeAtual = parseFloat(volume) || 0;
        $('#redosagemVolume').text(volumeAtual.toFixed(2));
        
        // Construir URL do endpoint com usinagem_id se fornecido
        let urlEndpoint = '/usinagem-concreto/api/materiais-traco/' + produtoCompostoId;
        if (usinagemId) {
            urlEndpoint += '?usinagem_id=' + usinagemId;
        }
        
        $.ajax({
            url: urlEndpoint,
            method: 'GET',
            success: function(response) {
                if (response.success && response.materiais && response.materiais.length > 0) {
                    materiaisRedosagem = response.materiais;
                    $('#redosagemTracoNome').text(response.traco_nome || '-');
                    
                    // Renderizar tabela diretamente (backend já aplicou a redosagem)
                    renderizarTabelaMateriais();
                } else {
                    $('#mensagemRedosagem').removeClass('d-none alert-success').addClass('alert-warning');
                    $('#mensagemRedosagem').html('<i class="fas fa-info-circle"></i> Nenhum material encontrado para este traço.');
                    $('#tabelaMateriaisRedosagem').html('<tr><td colspan="5" class="text-center text-muted">Nenhum material disponível.</td></tr>');
                }
            },
            error: function(xhr) {
                var errorMsg = 'Erro ao carregar materiais do traço.';
                if (xhr.responseJSON && xhr.responseJSON.error) {
                    errorMsg = xhr.responseJSON.error;
                }
                $('#mensagemRedosagem').removeClass('d-none alert-success').addClass('alert-danger');
                $('#mensagemRedosagem').html('<i class="fas fa-exclamation-circle"></i> ' + errorMsg);
                $('#tabelaMateriaisRedosagem').html('<tr><td colspan="5" class="text-center text-muted">Erro ao carregar materiais.</td></tr>');
            }
        });
    }
    
    // Função para renderizar a tabela de materiais
    function renderizarTabelaMateriais() {
        if (!materiaisRedosagem || materiaisRedosagem.length === 0) {
            $('#tabelaMateriaisRedosagem').html('<tr><td colspan="5" class="text-center text-muted">Nenhum material disponível.</td></tr>');
            return;
        }
        
        // quantidade_base = quantidade por m³ (sempre do traço)
        // quantidade_redosada_total = quantidade total já com volume aplicado (se houver redosagem)
        let html = '';
        materiaisRedosagem.forEach(function(material, index) {
            const quantidadeBase = parseFloat(material.quantidade_base) || 0; // Por m³
            const quantidadeTotalCalculada = quantidadeBase * volumeAtual; // Total calculado do traço
            
            // Se houver redosagem, usar a quantidade_redosada_total (já é o total)
            // Senão, usar a quantidade total calculada
            const quantidadeTotal = material.quantidade_redosada_total !== null && material.quantidade_redosada_total !== undefined
                ? parseFloat(material.quantidade_redosada_total)
                : quantidadeTotalCalculada;
            
            // quantidadeInicial é a quantidade total (redosada se houver, senão calculada)
            const quantidadeInicial = quantidadeTotal;
            
            html += `
                <tr data-material-id="${material.material_id}">
                    <td>
                        <strong>${material.material_nome}</strong>
                        ${material.material_codigo ? '<br><small class="text-muted">' + material.material_codigo + '</small>' : ''}
                    </td>
                    <td class="text-end">${quantidadeBase.toFixed(4)}</td>
                    <td class="text-end">
                        <strong id="qtdTotal_${material.material_id}">${quantidadeTotalCalculada.toFixed(4)}</strong>
                    </td>
                    <td>KG</td>
                    <td>
                        <input type="number" 
                               step="0.0001" 
                               min="0" 
                               class="form-control form-control-sm quantidade-redosada" 
                               data-material-id="${material.material_id}"
                               data-quantidade-base="${quantidadeBase}"
                               data-quantidade-total="${quantidadeTotalCalculada}"
                               value="${quantidadeInicial.toFixed(4)}"
                               id="qtdRedosada_${material.material_id}">
                    </td>
                </tr>
            `;
        });
        
        $('#tabelaMateriaisRedosagem').html(html);
        
        // Adicionar listener para recalcular quando o volume mudar (tanto nova quanto edição)
        $('#volume, #edit_volume').on('change', function() {
            const novoVolume = parseFloat($(this).val()) || 0;
            if (novoVolume > 0 && materiaisRedosagem.length > 0) {
                volumeAtual = novoVolume;
                $('#redosagemVolume').text(volumeAtual.toFixed(2));
                atualizarQuantidadesTotais();
            }
        });
    }
    
    // Função para atualizar quantidades totais quando o volume mudar
    function atualizarQuantidadesTotais() {
        materiaisRedosagem.forEach(function(material) {
            const quantidadeBase = parseFloat(material.quantidade_base) || 0;
            const quantidadeTotal = quantidadeBase * volumeAtual;
            $('#qtdTotal_' + material.material_id).text(quantidadeTotal.toFixed(4));
            
            // Atualizar o atributo data-quantidade-total para comparação
            const input = $('#qtdRedosada_' + material.material_id);
            input.data('quantidade-total', quantidadeTotal);
            
            // Atualizar o valor do input se não foi alterado manualmente
            if (input.data('auto-update') !== false) {
                input.val(quantidadeTotal.toFixed(4));
            }
        });
    }
    
    // Marcar inputs como alterados manualmente quando o usuário editar
    $(document).on('input', '.quantidade-redosada', function() {
        $(this).data('auto-update', false);
    });
    
    // Função para detectar qual formulário está ativo (nova ou edição)
    function obterFormularioAtivo() {
        // Verificar se o modal de edição está visível ou se o campo de edição existe e tem valor
        const modalEditarVisivel = $('#modalEditarUsinagem').is(':visible') || $('#modalEditarUsinagem').hasClass('show');
        const campoEditExiste = $('#edit_dados_adicionais').length > 0;
        const campoEditTemValor = $('#edit_dados_adicionais').val() && $('#edit_dados_adicionais').val().trim() !== '';
        
        if (modalEditarVisivel || (campoEditExiste && campoEditTemValor)) {
            return {
                tipo: 'editar',
                produtoCompostoId: $('#edit_produto_composto_id').hasClass('select2-hidden-accessible') 
                    ? $('#edit_produto_composto_id').select2('val') 
                    : $('#edit_produto_composto_id').val(),
                volume: $('#edit_volume').val(),
                campoDadosAdicionais: '#edit_dados_adicionais'
            };
        }
        // Caso contrário, assume que é o modal de nova usinagem
        return {
            tipo: 'nova',
            produtoCompostoId: $('#produto_composto_id').hasClass('select2-hidden-accessible') 
                ? $('#produto_composto_id').select2('val') 
                : $('#produto_composto_id').val(),
            volume: $('#volume').val(),
            campoDadosAdicionais: '#dados_adicionais'
        };
    }
    
    // Inicializar quando o modal for aberto
    $('#modalRedosagem').on('show.bs.modal', function() {
        $('#mensagemRedosagem').addClass('d-none').removeClass('alert-success alert-danger alert-warning');
        
        // Pequeno delay para garantir que o modal de edição tenha preenchido os campos
        setTimeout(function() {
            // Obter valores do formulário principal (nova ou edição)
            const formulario = obterFormularioAtivo();
            const produtoCompostoId = formulario.produtoCompostoId;
            const volume = formulario.volume;
            
            // Obter usinagem_id se for edição
            let usinagemId = null;
            if (formulario.tipo === 'editar') {
                usinagemId = $('#usinagem_id').val();
            }
            
            if (produtoCompostoId && volume) {
                carregarMateriaisTraco(produtoCompostoId, volume, usinagemId);
            } else {
                $('#mensagemRedosagem').removeClass('d-none').addClass('alert-warning');
                $('#mensagemRedosagem').html('<i class="fas fa-info-circle"></i> Selecione um traço e informe o volume antes de abrir a redosagem.');
                $('#tabelaMateriaisRedosagem').html('<tr><td colspan="5" class="text-center text-muted">Nenhum material disponível.</td></tr>');
            }
        }, 100); // Pequeno delay para garantir que campos estejam preenchidos
    });
    
    // Limpar ao fechar o modal
    $('#modalRedosagem').on('hidden.bs.modal', function() {
        materiaisRedosagem = [];
        volumeAtual = 0;
        $('#tabelaMateriaisRedosagem').html('<tr><td colspan="5" class="text-center text-muted"><i class="fas fa-spinner fa-spin"></i> Carregando materiais...</td></tr>');
        $('#mensagemRedosagem').addClass('d-none').removeClass('alert-success alert-danger alert-warning');
        
        // Garantir que o modal pai continue funcionando
        // Verificar se há outro modal aberto e manter o backdrop
        if ($('#modalNovaUsinagem').hasClass('show') || $('#modalEditarUsinagem').hasClass('show')) {
            // Garantir que o body tenha a classe modal-open
            $('body').addClass('modal-open');
            // Garantir que haja um backdrop (do modal pai)
            if ($('.modal-backdrop').length === 0) {
                $('body').append('<div class="modal-backdrop fade show"></div>');
            }
        }
    });
    
    // Salvar redosagem
    $('#btnSalvarRedosagem').on('click', function() {
        if (!materiaisRedosagem || materiaisRedosagem.length === 0) {
            $('#mensagemRedosagem').removeClass('d-none alert-success').addClass('alert-danger');
            $('#mensagemRedosagem').html('<i class="fas fa-exclamation-circle"></i> Nenhum material para salvar.');
            return;
        }
        
        const btnSalvar = $(this);
        const spinner = btnSalvar.find('.spinner-border');
        
        // Desabilitar botão e mostrar spinner
        btnSalvar.prop('disabled', true);
        spinner.removeClass('d-none');
        
        // Coletar dados da redosagem - apenas materiais alterados
        const redosagem = {
            materiais: []
        };
        
        // Buscar redosagem anterior para comparar corretamente
        const formularioAtivo = obterFormularioAtivo();
        const campoDadosAdicionaisAtivo = formularioAtivo.campoDadosAdicionais;
        let redosagemAnterior = {};
        
        try {
            const dadosAtuais = $(campoDadosAdicionaisAtivo).val();
            if (dadosAtuais && dadosAtuais.trim()) {
                const dadosAdicionais = JSON.parse(dadosAtuais);
                if (dadosAdicionais.redosagem && dadosAdicionais.redosagem.materiais) {
                    // Criar mapa de material_id -> quantidade_redosada anterior
                    dadosAdicionais.redosagem.materiais.forEach(function(item) {
                        redosagemAnterior[item.material_id] = parseFloat(item.quantidade_redosada) || 0;
                    });
                }
            }
        } catch (e) {
            console.warn('Erro ao parsear dados_adicionais para comparar redosagem:', e);
        }
        
        let temErro = false;
        materiaisRedosagem.forEach(function(material) {
            const input = $('#qtdRedosada_' + material.material_id);
            const quantidadeRedosada = parseFloat(input.val()) || 0;
            
            // Obter quantidade total do traço (base * volume)
            const quantidadeTotalTraco = parseFloat(input.data('quantidade-total')) || (parseFloat(material.quantidade_base) * volumeAtual);
            
            // Obter quantidade redosada anterior (se houver)
            const quantidadeRedosadaAnterior = redosagemAnterior[material.material_id];
            
            // Valor de referência para comparação:
            // - Se houver redosagem anterior, comparar com ela
            // - Senão, comparar com a quantidade do traço
            const valorReferencia = quantidadeRedosadaAnterior !== undefined 
                ? quantidadeRedosadaAnterior 
                : quantidadeTotalTraco;
            
            if (quantidadeRedosada < 0) {
                temErro = true;
                input.addClass('is-invalid');
            } else {
                input.removeClass('is-invalid');
            }
            
            // Salvar apenas se a quantidade foi alterada em relação ao valor de referência
            // Usar uma tolerância pequena para comparação de números decimais
            const diferenca = Math.abs(quantidadeRedosada - valorReferencia);
            if (diferenca > 0.0001) {
                // Material foi alterado - salvar apenas ID e quantidade redosada
                redosagem.materiais.push({
                    material_id: material.material_id,
                    quantidade_redosada: quantidadeRedosada
                });
            } else if (quantidadeRedosadaAnterior !== undefined) {
                // Se não foi alterado mas havia redosagem anterior, manter a redosagem anterior
                // (para não perder a redosagem quando não houver alteração)
                redosagem.materiais.push({
                    material_id: material.material_id,
                    quantidade_redosada: quantidadeRedosadaAnterior
                });
            }
        });
        
        if (temErro) {
            $('#mensagemRedosagem').removeClass('d-none alert-success').addClass('alert-danger');
            $('#mensagemRedosagem').html('<i class="fas fa-exclamation-circle"></i> Corrija os valores inválidos antes de salvar.');
            btnSalvar.prop('disabled', false);
            spinner.addClass('d-none');
            return;
        }
        
        // Se não houver materiais alterados, não salvar redosagem
        if (redosagem.materiais.length === 0) {
            $('#mensagemRedosagem').removeClass('d-none alert-success').addClass('alert-warning');
            $('#mensagemRedosagem').html('<i class="fas fa-info-circle"></i> Nenhum material foi alterado. Não há redosagem para salvar.');
            btnSalvar.prop('disabled', false);
            spinner.addClass('d-none');
            return;
        }
        
        // Atualizar o campo dados_adicionais no formulário principal (nova ou edição)
        // Usar as variáveis já declaradas acima (formularioAtivo e campoDadosAdicionaisAtivo)
        
        let dadosAdicionais = {};
        try {
            const dadosAtuais = $(campoDadosAdicionaisAtivo).val();
            if (dadosAtuais && dadosAtuais.trim() && dadosAtuais.trim() !== '{}') {
                try {
                    dadosAdicionais = JSON.parse(dadosAtuais);
                    // Garantir que é um objeto válido
                    if (typeof dadosAdicionais !== 'object' || dadosAdicionais === null) {
                        dadosAdicionais = {};
                    }
                } catch (parseError) {
                    console.warn('Erro ao parsear dados_adicionais existentes, usando objeto vazio:', parseError);
                    dadosAdicionais = {};
                }
            }
        } catch (e) {
            console.warn('Erro ao ler dados_adicionais existentes:', e);
            dadosAdicionais = {};
        }
        
        // Salvar apenas a redosagem (materiais alterados)
        // Garantir que redosagem.materiais seja um array válido
        if (!redosagem.materiais || !Array.isArray(redosagem.materiais)) {
            console.error('DEBUG redosagem - redosagem.materiais não é um array válido:', redosagem);
            redosagem.materiais = [];
        }
        
        dadosAdicionais.redosagem = redosagem;
        
        // Validar JSON antes de salvar
        let dadosAdicionaisString = '';
        try {
            dadosAdicionaisString = JSON.stringify(dadosAdicionais);
            // Validar se o JSON é válido tentando parsear novamente
            JSON.parse(dadosAdicionaisString);
        } catch (e) {
            console.error('DEBUG redosagem - Erro ao serializar dados_adicionais:', e);
            console.error('DEBUG redosagem - dadosAdicionais que causou erro:', dadosAdicionais);
            $('#mensagemRedosagem').removeClass('d-none alert-success').addClass('alert-danger');
            $('#mensagemRedosagem').html('<i class="fas fa-exclamation-circle"></i> Erro ao salvar redosagem. Dados inválidos.');
            btnSalvar.prop('disabled', false);
            spinner.addClass('d-none');
            return;
        }
        
        $(campoDadosAdicionaisAtivo).val(dadosAdicionaisString);
        
        // Log para debug
        console.log('DEBUG redosagem - Salvando dados_adicionais no campo:', campoDadosAdicionaisAtivo);
        console.log('DEBUG redosagem - redosagem.materiais.length:', redosagem.materiais.length);
        console.log('DEBUG redosagem - Valor salvo:', dadosAdicionaisString);
        console.log('DEBUG redosagem - Valor verificado no campo:', $(campoDadosAdicionaisAtivo).val());
        
        // Mostrar mensagem de sucesso
        $('#mensagemRedosagem').removeClass('d-none alert-danger').addClass('alert-success');
        $('#mensagemRedosagem').html('<i class="fas fa-check-circle"></i> Redosagem salva com sucesso! Os dados foram atualizados no formulário.');
        
        // Reabilitar botão
        btnSalvar.prop('disabled', false);
        spinner.addClass('d-none');
        
        // Fechar modal após 1 segundo (sem remover backdrop do modal pai)
        setTimeout(function() {
            const modalRedosagemEl = document.getElementById('modalRedosagem');
            if (modalRedosagemEl) {
                const modalInstance = bootstrap.Modal.getInstance(modalRedosagemEl);
                if (modalInstance) {
                    // Fechar sem remover o backdrop do modal pai
                    modalInstance.hide();
                    // Garantir que o body ainda tenha a classe modal-open se houver outro modal aberto
                    if ($('#modalNovaUsinagem').hasClass('show') || $('#modalEditarUsinagem').hasClass('show')) {
                        $('body').addClass('modal-open');
                    }
                } else {
                    $('#modalRedosagem').modal('hide');
                }
            }
        }, 1500);
    });
})();
</script>
