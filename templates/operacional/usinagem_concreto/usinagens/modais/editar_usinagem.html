<!-- Modal de Editar Usinagem -->
<div class="modal fade" id="modalEditarUsinagem" tabindex="-1" aria-labelledby="modalEditarUsinagemLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEditarUsinagemLabel">Editar Usinagem de Concreto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formEditarUsinagem">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="usinagem_id" name="usinagem_id">
                <div class="modal-body">
                    <!-- Mensagens de erro/sucesso -->
                    <div id="mensagemEditarUsinagem" class="alert d-none" role="alert"></div>
                    
                    <!-- Série -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="edit_serie" class="form-label fw-bold">Série *</label>
                            <input type="text" class="form-control" id="edit_serie" name="serie" required maxlength="100" placeholder="Ex: US-2024-001">
                            <small class="form-text text-muted">Identificador único da usinagem</small>
                        </div>
                    </div>

                    <!-- Data/Hora e Traço -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="edit_data_usinagem" class="form-label fw-bold">Data/Hora de Usinagem *</label>
                            <input type="datetime-local" class="form-control" id="edit_data_usinagem" name="data_usinagem" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="edit_produto_composto_id" class="form-label fw-bold">Traço *</label>
                            <select class="form-control" id="edit_produto_composto_id" name="produto_composto_id" required>
                                <option value="">Selecione um traço</option>
                                {% for traco in tracos %}
                                <option value="{{ traco.id }}">{{ traco.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Volume e Flow -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="edit_volume" class="form-label fw-bold">Volume (m³) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="edit_volume" name="volume" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="edit_flow" class="form-label fw-bold">Flow</label>
                            <input type="text" class="form-control" id="edit_flow" name="flow" maxlength="50" placeholder="Ex: 650/650">
                        </div>
                    </div>

                    <!-- NF e Redosagem -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="edit_nf" class="form-label fw-bold">Nota Fiscal</label>
                            <input type="text" class="form-control" id="edit_nf" name="nf" maxlength="50">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold">Redosagem</label>
                            <div>
                                <button type="button" class="btn btn-outline-primary" id="btnAbrirRedosagemEditar" title="Abrir redosagem de materiais">
                                    <i class="fas fa-calculator"></i> Configurar Redosagem
                                </button>
                            </div>
                            <small class="form-text text-muted">Configure as quantidades de materiais para redozagem</small>
                        </div>
                    </div>

                    <!-- Observação -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="edit_observacao" class="form-label fw-bold">Observação</label>
                            <textarea class="form-control" id="edit_observacao" name="observacao" rows="3" maxlength="500" placeholder="Digite observações sobre a usinagem..."></textarea>
                            <small class="form-text text-muted">Opcional: informações adicionais sobre a usinagem</small>
                        </div>
                    </div>
                    
                    <!-- Campo oculto para dados adicionais -->
                    <div class="d-none">
                        <input type="text" class="form-control" id="edit_dados_adicionais" name="dados_adicionais" placeholder='{"campo": "valor"}'>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSalvarEditarUsinagem">
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    // Inicializar quando o modal for aberto
    $('#modalEditarUsinagem').on('show.bs.modal', function(event) {
        var button = $(event.relatedTarget);
        var usinagemId = button.data('usinagem-id');
        var serie = button.data('serie') || '';
        var dataUsinagem = button.data('data-usinagem') || '';
        var produtoCompostoId = button.data('produto-composto-id') || '';
        var volume = button.data('volume') || '';
        var flow = button.data('flow') || '';
        var nf = button.data('nf') || '';
        // Obter dados_adicionais - pode vir como atributo data ou como objeto parseado pelo jQuery
        var dadosAdicionais = button.data('dados-adicionais');
        
        // Se vier vazio/null/undefined, tentar obter diretamente do atributo HTML
        if (!dadosAdicionais || dadosAdicionais === '' || dadosAdicionais === null) {
            const dadosAdicionaisAttr = button.attr('data-dados-adicionais');
            if (dadosAdicionaisAttr && dadosAdicionaisAttr !== '' && dadosAdicionaisAttr !== 'null') {
                try {
                    dadosAdicionais = JSON.parse(dadosAdicionaisAttr);
                } catch (e) {
                    // Se não conseguir parsear, usar como string se não for vazio
                    if (dadosAdicionaisAttr.trim() !== '') {
                        dadosAdicionais = dadosAdicionaisAttr;
                    } else {
                        dadosAdicionais = null;
                    }
                }
            } else {
                dadosAdicionais = null;
            }
        }
        
        // Preencher campos do formulário
        $('#usinagem_id').val(usinagemId);
        $('#edit_serie').val(serie);
        $('#edit_data_usinagem').val(dataUsinagem);
        $('#edit_produto_composto_id').val(produtoCompostoId);
        $('#edit_volume').val(volume);
        $('#edit_flow').val(flow);
        $('#edit_nf').val(nf);
        
        // Preencher dados adicionais (pode ser string JSON ou objeto)
        console.log('DEBUG editar_usinagem modal - dadosAdicionais recebido:', dadosAdicionais);
        console.log('DEBUG editar_usinagem modal - Tipo:', typeof dadosAdicionais);
        
        if (dadosAdicionais) {
            let dadosAdicionaisStr = '';
            let dadosParsed = null;
            
            if (typeof dadosAdicionais === 'string') {
                // Se já é string, verificar se é JSON válido
                try {
                    dadosParsed = JSON.parse(dadosAdicionais);
                    dadosAdicionaisStr = dadosAdicionais;
                    console.log('DEBUG editar_usinagem modal - String JSON válida, usando diretamente');
                } catch (e) {
                    // Se não for JSON válido, tentar stringify
                    dadosAdicionaisStr = JSON.stringify(dadosAdicionais);
                    try {
                        dadosParsed = JSON.parse(dadosAdicionaisStr);
                    } catch (e2) {
                        dadosParsed = dadosAdicionais;
                    }
                    console.log('DEBUG editar_usinagem modal - String não é JSON válido, convertendo para JSON');
                }
            } else {
                dadosParsed = dadosAdicionais;
                dadosAdicionaisStr = JSON.stringify(dadosAdicionais);
                console.log('DEBUG editar_usinagem modal - Objeto convertido para JSON string');
            }
            
            // Preencher campo de observação se existir nos dados
            if (dadosParsed && dadosParsed.observacao) {
                $('#edit_observacao').val(dadosParsed.observacao);
                console.log('DEBUG editar_usinagem modal - Observação carregada:', dadosParsed.observacao);
            } else {
                $('#edit_observacao').val('');
                console.log('DEBUG editar_usinagem modal - Nenhuma observação nos dados');
            }
            
            console.log('DEBUG editar_usinagem modal - Valor a ser salvo no campo:', dadosAdicionaisStr);
            $('#edit_dados_adicionais').val(dadosAdicionaisStr);
            
            // Verificar se foi salvo corretamente
            const valorVerificado = $('#edit_dados_adicionais').val();
            console.log('DEBUG editar_usinagem modal - Valor verificado no campo após salvar:', valorVerificado);
            
            // Verificar se há redosagem nos dados
            if (dadosParsed) {
                if (dadosParsed.redosagem) {
                    console.log('DEBUG editar_usinagem modal - Redosagem encontrada nos dados:', dadosParsed.redosagem);
                } else {
                    console.log('DEBUG editar_usinagem modal - Nenhuma redosagem nos dados');
                }
            }
        } else {
            $('#edit_dados_adicionais').val('');
            $('#edit_observacao').val('');
            console.log('DEBUG editar_usinagem modal - dadosAdicionais vazio, campo limpo');
        }
        
        // Limpar mensagens
        $('#mensagemEditarUsinagem').addClass('d-none').removeClass('alert-success alert-danger');
        
        // Inicializar select2 se disponível
        if ($.fn.select2 && !$('#edit_produto_composto_id').hasClass('select2-hidden-accessible')) {
            $('#edit_produto_composto_id').select2({
                dropdownParent: $('#modalEditarUsinagem'),
                width: '100%'
            });
        }
    });
    
    // Limpar formulário ao fechar o modal
    $('#modalEditarUsinagem').on('hidden.bs.modal', function() {
        $('#formEditarUsinagem')[0].reset();
        $('#edit_observacao').val('');
        $('#mensagemEditarUsinagem').addClass('d-none').removeClass('alert-success alert-danger');
        $('#formEditarUsinagem').find('.is-invalid').removeClass('is-invalid');
        
        // Destruir select2 se foi inicializado
        if ($.fn.select2 && $('#edit_produto_composto_id').hasClass('select2-hidden-accessible')) {
            $('#edit_produto_composto_id').select2('destroy');
        }
    });
    
    // Submeter formulário via AJAX
    $('#formEditarUsinagem').on('submit', function(e) {
        e.preventDefault();
        
        var form = $(this);
        var btnSubmit = $('#btnSalvarEditarUsinagem');
        var spinner = btnSubmit.find('.spinner-border');
        var mensagem = $('#mensagemEditarUsinagem');
        var usinagemId = $('#usinagem_id').val();
        
        // Desabilitar botão e mostrar spinner
        btnSubmit.prop('disabled', true);
        spinner.removeClass('d-none');
        
        // Limpar mensagens anteriores
        mensagem.addClass('d-none').removeClass('alert-success alert-danger');
        form.find('.is-invalid').removeClass('is-invalid');
        
        // Validar campos obrigatórios no cliente antes de enviar
        var serie = $('#edit_serie').val().trim();
        var dataUsinagem = $('#edit_data_usinagem').val().trim();
        var produtoCompostoId = $('#edit_produto_composto_id').hasClass('select2-hidden-accessible') 
            ? $('#edit_produto_composto_id').select2('val') 
            : $('#edit_produto_composto_id').val();
        var volume = $('#edit_volume').val().trim();
        
        if (!serie || !dataUsinagem || !produtoCompostoId || !volume) {
            var camposFaltando = [];
            if (!serie) camposFaltando.push('Série');
            if (!dataUsinagem) camposFaltando.push('Data/Hora');
            if (!produtoCompostoId) camposFaltando.push('Traço');
            if (!volume) camposFaltando.push('Volume');
            
            mensagem.removeClass('d-none alert-success').addClass('alert-danger');
            mensagem.html('<i class="fas fa-exclamation-circle"></i> Preencha os campos obrigatórios: ' + camposFaltando.join(', '));
            btnSubmit.prop('disabled', false);
            spinner.addClass('d-none');
            return;
        }
        
        // Preparar dados do formulário
        var formData = new FormData(this);
        
        // Remover dados_adicionais do FormData se existir (vamos adicionar manualmente apenas se válido)
        if (formData.has('dados_adicionais')) {
            formData.delete('dados_adicionais');
        }
        
        // Garantir que dados_adicionais seja enviado mesmo se estiver oculto
        // Ler o campo diretamente pelo ID para garantir que pegue o valor atual
        var campoDadosAdicionais = document.getElementById('edit_dados_adicionais');
        var dadosAdicionais = campoDadosAdicionais ? campoDadosAdicionais.value : '';
        
        // Obter observação do campo
        var observacao = $('#edit_observacao').val().trim();
        
        console.log('DEBUG editar - Campo dados_adicionais encontrado:', !!campoDadosAdicionais);
        console.log('DEBUG editar - Valor do campo dados_adicionais:', dadosAdicionais);
        console.log('DEBUG editar - Observação:', observacao);
        
        // Preparar objeto dados_adicionais mesclando dados existentes com observação
        var dadosAdicionaisObj = {};
        
        // Se existir dados_adicionais, tentar parsear e mesclar
        if (dadosAdicionais && dadosAdicionais.trim() && dadosAdicionais.trim() !== '{}') {
            // Verificar se não é JSON incompleto (começa com { mas não termina com })
            if (dadosAdicionais.trim().startsWith('{') && !dadosAdicionais.trim().endsWith('}')) {
                console.warn('DEBUG editar - JSON incompleto detectado, criando novo objeto apenas com observação');
                // Criar novo objeto apenas com observação
                if (observacao) {
                    dadosAdicionaisObj.observacao = observacao;
                }
            } else {
                // Validar se dados_adicionais é JSON válido antes de enviar
                try {
                    // Tentar parsear para validar que é JSON válido
                    var parsed = JSON.parse(dadosAdicionais);
                    
                    // Verificar se é um objeto válido (não string, array, etc)
                    if (typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)) {
                        // Mesclar dados existentes com observação
                        dadosAdicionaisObj = Object.assign({}, parsed);
                        if (observacao) {
                            dadosAdicionaisObj.observacao = observacao;
                        } else if (dadosAdicionaisObj.observacao) {
                            // Manter observação existente se não foi alterada
                            // (já está no objeto parsed)
                        }
                    } else {
                        console.warn('DEBUG editar - dados_adicionais parseado mas não é um objeto válido:', typeof parsed);
                        // Criar novo objeto apenas com observação
                        if (observacao) {
                            dadosAdicionaisObj.observacao = observacao;
                        }
                    }
                } catch (e) {
                    console.error('DEBUG editar - dados_adicionais contém JSON inválido:', e);
                    // Criar novo objeto apenas com observação
                    if (observacao) {
                        dadosAdicionaisObj.observacao = observacao;
                    }
                }
            }
        } else {
            // Se estiver vazio, criar novo objeto apenas com observação
            if (observacao) {
                dadosAdicionaisObj.observacao = observacao;
            }
        }
        
        // Enviar dados_adicionais apenas se tiver conteúdo
        if (Object.keys(dadosAdicionaisObj).length > 0) {
            var dadosAdicionaisFinal = JSON.stringify(dadosAdicionaisObj);
            formData.set('dados_adicionais', dadosAdicionaisFinal);
            console.log('DEBUG editar - Enviando dados_adicionais:', dadosAdicionaisFinal);
        } else {
            console.log('DEBUG editar - dados_adicionais vazio, não enviando (backend manterá existentes)');
        }
        
        // Verificar se o campo foi adicionado ao FormData
        console.log('DEBUG editar - FormData contém dados_adicionais:', formData.has('dados_adicionais'));
        if (formData.has('dados_adicionais')) {
            console.log('DEBUG editar - Valor no FormData:', formData.get('dados_adicionais'));
        }
        
        // Debug: log dos dados sendo enviados
        console.log('Dados do formulário de edição:', {
            serie: serie,
            data_usinagem: dataUsinagem,
            produto_composto_id: produtoCompostoId,
            volume: volume,
            observacao: observacao,
            dados_adicionais: formData.has('dados_adicionais') ? formData.get('dados_adicionais') : 'não enviado'
        });
        
        // Enviar via AJAX
        $.ajax({
            url: '/usinagem-concreto/usinagens/' + usinagemId + '/editar',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            success: function(response) {
                if (response.success) {
                    // Mostrar mensagem de sucesso
                    mensagem.removeClass('d-none alert-danger').addClass('alert-success');
                    mensagem.html('<i class="fas fa-check-circle"></i> ' + (response.message || 'Usinagem atualizada com sucesso!'));
                    
                    // Fechar modal após 1 segundo e recarregar página
                    setTimeout(function() {
                        $('#modalEditarUsinagem').modal('hide');
                        // Recarregar a página para atualizar a lista
                        window.location.reload();
                    }, 1000);
                } else {
                    // Mostrar erro
                    mensagem.removeClass('d-none alert-success').addClass('alert-danger');
                    mensagem.html('<i class="fas fa-exclamation-circle"></i> ' + (response.error || 'Erro ao atualizar usinagem.'));
                    btnSubmit.prop('disabled', false);
                    spinner.addClass('d-none');
                }
            },
            error: function(xhr) {
                var errorMsg = 'Erro ao atualizar usinagem.';
                
                console.error('Erro ao editar usinagem:', xhr);
                
                if (xhr.responseJSON) {
                    if (xhr.responseJSON.error) {
                        errorMsg = xhr.responseJSON.error;
                    } else if (xhr.responseJSON.message) {
                        errorMsg = xhr.responseJSON.message;
                    }
                } else if (xhr.status === 400) {
                    errorMsg = 'Dados inválidos. Verifique os campos obrigatórios.';
                } else if (xhr.status === 500) {
                    errorMsg = 'Erro interno do servidor. Verifique o console para mais detalhes.';
                } else if (xhr.status === 0) {
                    errorMsg = 'Erro de conexão. Verifique sua internet.';
                } else {
                    errorMsg = 'Erro ao atualizar usinagem. Status: ' + xhr.status;
                }
                
                mensagem.removeClass('d-none alert-success').addClass('alert-danger');
                mensagem.html('<i class="fas fa-exclamation-circle"></i> ' + errorMsg);
                btnSubmit.prop('disabled', false);
                spinner.addClass('d-none');
            }
        });
    });
    
    // Abrir modal de redosagem no modal de edição - usar delegação de eventos
    $(document).on('click', '#btnAbrirRedosagemEditar', function() {
        // Verificar se traço e volume estão preenchidos
        const produtoCompostoId = $('#edit_produto_composto_id').hasClass('select2-hidden-accessible') 
            ? $('#edit_produto_composto_id').select2('val') 
            : $('#edit_produto_composto_id').val();
        const volume = $('#edit_volume').val();
        
        if (!produtoCompostoId) {
            $('#mensagemEditarUsinagem').removeClass('d-none alert-success').addClass('alert-warning');
            $('#mensagemEditarUsinagem').html('<i class="fas fa-info-circle"></i> Selecione um traço antes de abrir a redosagem.');
            return;
        }
        
        if (!volume || parseFloat(volume) <= 0) {
            $('#mensagemEditarUsinagem').removeClass('d-none alert-success').addClass('alert-warning');
            $('#mensagemEditarUsinagem').html('<i class="fas fa-info-circle"></i> Informe o volume antes de abrir a redosagem.');
            return;
        }
        
        // Garantir que o campo dados_adicionais esteja preenchido antes de abrir
        // Ler o campo diretamente pelo ID
        const campoDadosAdicionais = document.getElementById('edit_dados_adicionais');
        let valorCampo = campoDadosAdicionais ? campoDadosAdicionais.value : '';
        
        console.log('DEBUG btnAbrirRedosagemEditar - Valor atual do campo:', valorCampo);
        
        // Se estiver vazio, tentar obter novamente do botão que abriu o modal
        if (!valorCampo || !valorCampo.trim()) {
            console.log('DEBUG btnAbrirRedosagemEditar - Campo vazio, tentando obter do botão');
            // Buscar o botão que abriu o modal de edição
            const usinagemId = $('#usinagem_id').val();
            const botaoEditar = $('[data-bs-target="#modalEditarUsinagem"][data-usinagem-id="' + usinagemId + '"]').first();
            
            if (botaoEditar.length) {
                let dadosAdicionais = botaoEditar.data('dados-adicionais') || '';
                
                // Se vier vazio, tentar obter diretamente do atributo HTML
                if (!dadosAdicionais) {
                    const dadosAdicionaisAttr = botaoEditar.attr('data-dados-adicionais');
                    console.log('DEBUG btnAbrirRedosagemEditar - Dados do atributo:', dadosAdicionaisAttr);
                    if (dadosAdicionaisAttr) {
                        try {
                            dadosAdicionais = JSON.parse(dadosAdicionaisAttr);
                        } catch (e) {
                            dadosAdicionais = dadosAdicionaisAttr;
                        }
                    }
                }
                
                if (dadosAdicionais) {
                    let dadosAdicionaisStr = '';
                    if (typeof dadosAdicionais === 'string') {
                        dadosAdicionaisStr = dadosAdicionais;
                    } else {
                        dadosAdicionaisStr = JSON.stringify(dadosAdicionais);
                    }
                    $('#edit_dados_adicionais').val(dadosAdicionaisStr);
                    console.log('DEBUG btnAbrirRedosagemEditar - Campo preenchido com:', dadosAdicionaisStr);
                } else {
                    console.warn('DEBUG btnAbrirRedosagemEditar - Nenhum dado encontrado no botão');
                }
            } else {
                console.warn('DEBUG btnAbrirRedosagemEditar - Botão de editar não encontrado');
            }
        } else {
            console.log('DEBUG btnAbrirRedosagemEditar - Campo já tem valor, usando esse valor');
        }
        
        // Pequeno delay para garantir que o campo esteja preenchido
        setTimeout(function() {
            // Abrir modal de redosagem sem adicionar novo backdrop
            const modalRedosagemEl = document.getElementById('modalRedosagem');
            if (modalRedosagemEl) {
                // Usar Bootstrap 5 sem criar novo backdrop
                let modalRedosagem = bootstrap.Modal.getInstance(modalRedosagemEl);
                if (!modalRedosagem) {
                    modalRedosagem = new bootstrap.Modal(modalRedosagemEl, {
                        backdrop: false,  // Não criar novo backdrop
                        keyboard: true
                    });
                }
                modalRedosagem.show();
                
                // Ajustar z-index manualmente para garantir que apareça acima
                $(modalRedosagemEl).css('z-index', '1065');
            }
        }, 100);
    });
})();
</script>
