<div class="modal fade" id="modalTransporte" tabindex="-1" aria-labelledby="modalTransporteLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down modal-lg">
    <div class="modal-content ft-modal-transporte">
      <form id="formTransporte" method="post" action="{{ url_for('acabamento_transporte.transporte') }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="peca_ids" id="peca_ids">
        <div class="modal-header border-bottom">
          <h5 class="modal-title" id="modalTransporteLabel">Registrar Transporte</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body ft-modal-transporte-body">
          <div class="mb-3">
            <label for="transporte-tanque_id" class="form-label">Tanque</label>
            <select class="form-select" id="transporte-tanque_id" name="transporte-tanque_ids[]" required>
            </select>
          </div>
          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="1" id="transporte-apenasAcabadas">
              <label class="form-check-label" for="transporte-apenasAcabadas">
                Mostrar apenas peças acabadas
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="1" id="transporte-disponiveisTransporte">
              <label class="form-check-label" for="transporte-disponiveisTransporte">
                Peças disponíveis (concretadas, acabadas e não transportadas)
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="1" id="transporte-naoTransportadas">
              <label class="form-check-label" for="transporte-naoTransportadas">
                Apenas peças não transportadas
              </label>
            </div>
          </div>
          <div class="mb-3">
            <label for="transporte-peca_id" class="form-label">Peça(s) (pesquise pelo nome)</label>
            <select class="form-select" id="transporte-peca_id" name="transporte-peca_ids[]" required style="width: 100%" multiple>
            </select>
          </div>
          <div class="mb-3">
            <label for="nota_fiscal" class="form-label">Nota Fiscal (venda matriz)</label>
            <input type="text" class="form-control" id="nota_fiscal" name="nota_fiscal" required placeholder="Digite o número da NF para buscar" autocomplete="off" inputmode="numeric">
            <input type="hidden" id="nota_fiscal_chave" name="nota_fiscal_chave" value="">
            <small class="text-muted">Busca por notas de venda emitidas pela matriz.</small>
          </div>
          <div class="mb-3">
            <label for="cte_frete" class="form-label">CT-e / Frete (vinculado à NF)</label>
            <input type="text" class="form-control" id="cte_frete" name="cte_frete" placeholder="Selecione a nota acima para carregar CT-e" autocomplete="off" readonly>
            <small class="text-muted">CT-e vinculado à nota fiscal selecionada. Ao selecionar, placa e transportadora são preenchidos.</small>
          </div>
          <div class="mb-3">
            <label for="placa_carreta" class="form-label">Placa da Carreta</label>
            <input type="text" class="form-control text-uppercase" id="placa_carreta" name="placa_carreta" required autocomplete="off" autocapitalize="characters">
          </div>
          <div class="mb-3">
            <label for="data_transporte" class="form-label">Data do Transporte</label>
            <input type="date" class="form-control" id="data_transporte" name="data_transporte" value="{{ now}}">
          </div>
          <div class="mb-3">
            <label for="transportadora" class="form-label">Transportadora</label>
            <input type="text" class="form-control" id="transportadora" name="transportadora" required autocomplete="organization">
          </div>

          <div class="mb-3 ft-transporte-foto">
            <label class="form-label">Foto do transporte <span class="text-muted fw-normal">(opcional)</span></label>
            <input type="file" id="transporte-foto-input" name="foto_transporte" accept="image/*" capture="environment" class="d-none">
            <div class="d-flex flex-wrap align-items-center gap-2">
              <button type="button" class="btn btn-outline-secondary btn-sm flex-grow-1 flex-sm-grow-0" id="transporte-foto-btn" aria-label="Tirar ou escolher foto">
                <i class="fas fa-camera me-1"></i><span class="d-none d-sm-inline">Tirar ou </span>adicionar foto
              </button>
              <button type="button" class="btn btn-outline-danger btn-sm d-none" id="transporte-foto-remover">
                <i class="fas fa-times me-1"></i>Remover foto
              </button>
            </div>
            <div id="transporte-foto-preview-wrap" class="mt-2 d-none text-center">
              <img id="transporte-foto-preview" class="ft-transporte-foto-thumb img-fluid rounded border mx-auto d-block" alt="">
            </div>
          </div>

          <div class="mb-3">
            <label for="transporte-observacao" class="form-label">Observação</label>
            <textarea class="form-control" id="transporte-observacao" name="observacao" rows="2" placeholder="Observações sobre o envio ou a carga" maxlength="4000"></textarea>
          </div>

          <div class="mb-0">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="1" id="transporte-enviar-whatsapp" name="enviar_whatsapp">
              <label class="form-check-label" for="transporte-enviar-whatsapp">
                Enviar pelo WhatsApp
              </label>
              <span class="badge bg-secondary ms-1 align-middle">em breve</span>
            </div>
            <small class="text-muted d-block mt-1">A flag é salva no cadastro; o envio automático será configurado posteriormente.</small>
          </div>
        </div>
        <div class="modal-footer flex-column flex-sm-row gap-2 border-top">
          <button type="button" class="btn btn-secondary order-2 order-sm-1 w-100 w-sm-auto" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary order-1 order-sm-2 w-100 w-sm-auto">
            <i class="fas fa-save me-1"></i>Salvar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
$(function() {
  function transporteLimparFoto() {
    var $inp = $('#transporte-foto-input');
    $inp.val('');
    $('#transporte-foto-preview-wrap').addClass('d-none');
    $('#transporte-foto-preview').removeAttr('src');
    $('#transporte-foto-remover').addClass('d-none');
  }

  $('#transporte-foto-btn').on('click', function() {
    $('#transporte-foto-input').trigger('click');
  });

  $('#transporte-foto-input').on('change', function() {
    var f = this.files && this.files[0];
    if (!f || !f.type || f.type.indexOf('image/') !== 0) {
      transporteLimparFoto();
      return;
    }
    var r = new FileReader();
    r.onload = function(ev) {
      $('#transporte-foto-preview').attr('src', ev.target.result);
      $('#transporte-foto-preview-wrap').removeClass('d-none');
      $('#transporte-foto-remover').removeClass('d-none');
    };
    r.readAsDataURL(f);
  });

  $('#transporte-foto-remover').on('click', function() {
    transporteLimparFoto();
  });

  $('#formTransporte').on('submit', function(e) {
    e.preventDefault();
    var form = this;
    var fd = new FormData(form);
    $.ajax({
      url: $(form).attr('action'),
      type: 'POST',
      data: fd,
      processData: false,
      contentType: false,
      headers: { 'X-CSRFToken': $('input[name="csrf_token"]', form).val() }
    })
      .done(function(resp) {
        if (resp.success) {
          alert('Transporte registrado com sucesso!');
          location.reload();
        } else {
          alert(resp.message || 'Erro ao registrar transporte.');
        }
      })
      .fail(function(xhr) {
        alert('Erro ao registrar transporte: ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'Erro desconhecido.'));
      });
  });

  $('#transportadora').on('focus', function() {
    var tval = $('#transporte-tanque_id').val();
    var tanque_ids = tval ? (Array.isArray(tval) ? tval : [tval]) : [];
    if (!tanque_ids.length) return;
    $.ajax({
      url: '{{ url_for("acabamento_transporte.api_transportadoras") }}',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ tanque_ids: tanque_ids }),
      headers: { 'X-CSRFToken': $('input[name="csrf_token"]').val() },
      success: function(data) {
        $('#transportadora').autocomplete({ source: data.map(function(p) { return p; }), minLength: 2 });
      }
    });
  });

  $('#transporte-peca_id').select2({
    dropdownParent: $('#modalTransporte'),
    theme: 'bootstrap-5',
    placeholder: 'Pesquise a peça pelo nome',
    allowClear: true,
    multiple: true,
    scrollAfterSelect: true,
    dropdownAutoWidth: true,
    ajax: {
      url: '{{ url_for("acabamento_transporte.api_pecas") }}',
      method: 'GET',
      dataType: 'json',
      delay: 250,
      data: function(params) {
        var tval = $('#transporte-tanque_id').val();
        var csv = Array.isArray(tval) ? tval.join(',') : (tval || '');
        var disponiveis = $('#transporte-disponiveisTransporte').is(':checked');
        var soNaoTransportadas = $('#transporte-naoTransportadas').is(':checked');
        return {
          tanque_ids: csv,
          nome: params.term || '',
          apenas_concretadas: soNaoTransportadas && !disponiveis ? 0 : 1,
          apenas_acabadas: $('#transporte-apenasAcabadas').is(':checked') ? 1 : 0,
          nao_acabadas: 0,
          apenas_disponiveis_transporte: disponiveis ? 1 : 0,
          apenas_nao_transportadas: soNaoTransportadas ? 1 : 0
        };
      },
      processResults: function(data) {
        return {
          results: data.map(function(peca) {
            return { id: peca.id, text: peca.tanque_nome + ' - ' + peca.nome, tanque_nome: peca.tanque_nome };
          })
        };
      },
      cache: true
    },
    minimumInputLength: 2
  });

  $('#transporte-apenasAcabadas, #transporte-disponiveisTransporte, #transporte-naoTransportadas').on('change', function() {
    $('#transporte-peca_id').val(null).trigger('change');
  });

  $('#transporte-tanque_id').select2({
    dropdownParent: $('#modalTransporte'),
    theme: 'bootstrap-5',
    placeholder: 'Selecione o(s) tanque(s)',
    allowClear: true,
    multiple: true,
    ajax: {
      url: '{{ url_for("acabamento_transporte.api_tanques") }}',
      method: 'GET',
      dataType: 'json',
      delay: 250,
      processResults: function(data) {
        return {
          results: data.map(function(tanque) {
            return { id: tanque.id, text: tanque.nome };
          })
        };
      },
      cache: true
    }
  });

  $('#transporte-tanque_id').on('change', function() {
    $('#transporte-peca_id').val(null).trigger('change');
  });

  $('#nota_fiscal').autocomplete({
    source: function(request, response) {
      $.get('{{ url_for("acabamento_transporte.api_notas_venda_matriz") }}', { q: request.term || '' }, function(data) {
        var list = Array.isArray(data) ? data : (data && typeof data === 'object' && !Array.isArray(data) ? [data] : []);
        var items = list.map(function(n) {
          var num = n.numero_nf != null ? String(n.numero_nf) : '';
          var dest = (n.nome_destinatario || '').substring(0, 40);
          var dataEmissao = n.data_emissao || '';
          return {
            label: 'NF ' + num + ' - ' + dest + (dataEmissao ? ' (' + dataEmissao + ')' : ''),
            value: num,
            chave_acesso: n.chave_acesso || '',
            numero_nf: num
          };
        });
        response(items);
      }).fail(function() { response([]); });
    },
    minLength: 0,
    delay: 0,
    appendTo: '#modalTransporte .modal-body',
    select: function(event, ui) {
      $('#nota_fiscal').val(ui.item.numero_nf);
      $('#nota_fiscal_chave').val(ui.item.chave_acesso || '');
      $.get('{{ url_for("acabamento_transporte.api_transporte_por_nota") }}', { nota_fiscal: ui.item.numero_nf }, function(prev) {
        if (prev) {
          if (prev.placa_carreta) $('#placa_carreta').val(prev.placa_carreta);
          if (prev.transportadora) $('#transportadora').val(prev.transportadora);
          if (prev.data_transporte) $('#data_transporte').val(prev.data_transporte);
        }
      });
      $('#cte_frete').val('').prop('readonly', false).attr('placeholder', 'Carregando CT-e...');
      var chave = ui.item.chave_acesso;
      if (chave) {
        $.get('{{ url_for("acabamento_transporte.api_cte_por_nota") }}', { chave_nf: chave }, function(ctes) {
          if ($('#cte_frete').autocomplete('instance')) {
            $('#cte_frete').autocomplete('destroy');
          }
          var itensCte = (ctes || []).map(function(c) {
            var desc = 'CT-e ' + c.numero_nf;
            if (c.placa) desc += ' - Placa ' + c.placa;
            if (c.nome_emitente) desc += ' - ' + c.nome_emitente;
            var dataIso = '';
            if (c.data_emissao) {
              var p = c.data_emissao.split('/');
              if (p.length === 3) dataIso = p[2] + '-' + p[1] + '-' + p[0];
            }
            return { label: desc, value: String(c.numero_nf), placa: c.placa || '', transportadora: c.nome_emitente || '', data_emissao: dataIso };
          });
          if (itensCte.length === 0) {
            $('#cte_frete').attr('placeholder', 'Nenhum CT-e vinculado a esta NF');
            return;
          }
          if (itensCte.length === 1) {
            var unico = itensCte[0];
            $('#cte_frete').val(unico.value);
            if (unico.placa) $('#placa_carreta').val(unico.placa);
            if (unico.transportadora) $('#transportadora').val(unico.transportadora);
            if (unico.data_emissao) $('#data_transporte').val(unico.data_emissao);
            return;
          }
          $('#cte_frete').attr('placeholder', 'Selecione o CT-e (opcional)');
          $('#cte_frete').autocomplete({
            source: itensCte,
            minLength: 0,
            appendTo: '#modalTransporte .modal-body',
            select: function(ev, u) {
              if (u.item.placa) $('#placa_carreta').val(u.item.placa);
              if (u.item.transportadora) $('#transportadora').val(u.item.transportadora);
              if (u.item.data_emissao) $('#data_transporte').val(u.item.data_emissao);
            }
          });
          $('#cte_frete').autocomplete('search', '');
        }).fail(function() {
          $('#cte_frete').attr('placeholder', 'Erro ao carregar CT-e');
        });
      } else {
        $('#cte_frete').attr('placeholder', 'Selecione a nota acima para carregar CT-e');
      }
      return false;
    }
  });

  $('#nota_fiscal').on('focus', function() {
    var $el = $(this);
    if ($el.autocomplete('instance')) { $el.autocomplete('search', $el.val() || ''); }
  });
  $('#cte_frete').on('focus', function() {
    var $el = $(this);
    if ($el.autocomplete('instance')) { $el.autocomplete('search', $el.val() || ''); }
  });

  $('#modalTransporte').on('show.bs.modal', function() {
    $('#nota_fiscal_chave').val('');
    $('#cte_frete').val('').prop('readonly', true).attr('placeholder', 'Selecione a nota acima para carregar CT-e');
    if ($('#cte_frete').autocomplete('instance')) { $('#cte_frete').autocomplete('destroy'); }
    $('#transporte-observacao').val('');
    $('#transporte-enviar-whatsapp').prop('checked', false);
    $('#transporte-disponiveisTransporte').prop('checked', false);
    $('#transporte-naoTransportadas').prop('checked', false);
    transporteLimparFoto();
  });
});
</script>
