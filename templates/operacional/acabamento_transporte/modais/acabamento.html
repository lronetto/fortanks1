<div class="modal fade" id="modalAcabamento" tabindex="-1" aria-labelledby="modalAcabamentoLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formAcabamento" method="post" action="{{ url_for('acabamento_transporte.acabamento') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="modal-header">
          <h5 class="modal-title" id="modalAcabamentoLabel">Registrar Acabamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="acabamento-tanque_id" class="form-label">Tanque</label>
            <select class="form-select" id="acabamento-tanque_id" name="acabamento-tanque_id" required>
              <option value="">Selecione...</option>
              {% for tanque in tanques %}
                <option value="{{ tanque.id }}">{{ tanque.nome }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label for="acabamento-peca_id" class="form-label">Peça(s) (pesquise pelo nome)</label>
            <select class="form-select" id="acabamento-peca_id" name="acabamento-peca_ids[]" required style="width: 100%" multiple>
                <!-- As opções serão carregadas via AJAX pelo select2 -->
            </select>
          </div>
          <div class="mb-3">
            <label for="data_acabamento" class="form-label">Data do Acabamento</label>
            <input type="date" class="form-control" id="data_acabamento" name="data_acabamento" value="{{ now }}">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
$(function() {
  $('#formAcabamento').on('submit', function(e) {
    e.preventDefault();
    var form = $(this);
    $.post(form.attr('action'), form.serialize())
      .done(function(resp) {
        if (resp.success) {
          alert('Acabamento registrado com sucesso!');
          location.reload();
        } else {
          alert(resp.message || 'Erro ao registrar acabamento.');
        }
      })
      .fail(function(xhr) {
        alert('Erro ao registrar acabamento: ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'Erro desconhecido.'));
      });
  });

  $('#acabamento-peca_id').select2({
    dropdownParent: $('#modalAcabamento'),
    theme: 'bootstrap-5',
    placeholder: 'Pesquise a peça pelo nome',
    allowClear: true,
    multiple: true,
    width: '100%',
    scrollAfterSelect: true,
    dropdownAutoWidth: true,
    ajax: {
      url: '{{ url_for("acabamento_transporte.api_pecas") }}',
      method: 'GET',
      dataType: 'json',
      delay: 250,
      data: function(params) {
        return {
          tanque_ids: [$('#acabamento-tanque_id').val()],
          nome: params.term || '',
          apenas_concretadas: 1,
          apenas_acabadas: 0,
          nao_acabadas: 1
        };
      },
      processResults: function(data) {
        return {
          results: data.map(function(peca) {
            return { id: peca.id, text: peca.nome + ' (' + peca.numero_sequencial + ')', tanque_nome: peca.tanque_nome };
          })
        };
      },
      cache: true
    },
    minimumInputLength: 2
  });

  $('#peca_nome').autocomplete && $('#peca_nome').autocomplete('destroy');
  $('#datalistPecas').remove();
});
</script>
