<!-- Modal Resetar Senha -->
<div class="modal fade" id="modalResetarSenha" tabindex="-1" aria-labelledby="modalResetarSenhaLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalResetarSenhaLabel"><i class="fas fa-key"></i> Resetar Senha</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <form id="formResetarSenha" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="usuario_id" id="resetar_usuario_id">
                <div class="modal-body">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> Você está resetando a senha do usuário: <strong id="resetar_nome_usuario"></strong>
                    </div>
                    <div class="mb-3">
                        <label for="resetar_nova_senha" class="form-label">Nova Senha <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="resetar_nova_senha" name="nova_senha" required>
                        <small class="text-muted">A senha deve ter no mínimo 6 caracteres.</small>
                    </div>
                    <div class="mb-3">
                        <label for="resetar_confirmar_senha" class="form-label">Confirmar Senha <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="resetar_confirmar_senha" name="confirmar_senha" required>
                    </div>
                    <div id="resetar_senha_alert" class="alert d-none" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-warning">Resetar Senha</button>
                </div>
            </form>
        </div>
    </div>
</div>
