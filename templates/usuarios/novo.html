{% extends 'common/base.html' %}

{% block title %}Novo Usuário - Sistema de Gestão - Pré-moldados{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3"><i class="fas fa-user-plus"></i> Novo Usuário</h1>
        <a href="{{ url_for('usuario.index') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Cadastro de Usuário</h6>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('usuario.novo') }}" id="form-usuario">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" required>
                        <div class="form-text">A senha deve ter pelo menos 8 caracteres.</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmar_senha" class="form-label">Confirmar Senha</label>
                        <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha"
                            required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="departamento" class="form-label">Departamento</label>
                        <select class="form-select" id="departamento" name="departamento" required>
                            <option value="" selected disabled>Selecione um departamento</option>
                            {% for departamento in departamentos %}
                            <option value="{{ departamento.nome }}">{{ departamento.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="cargo" class="form-label">Cargo</label>
                        <select class="form-select" id="cargo" name="cargo" required>
                            <option value="" selected disabled>Selecione um cargo</option>
                            {% for cargo in cargos %}
                            <option value="{{ cargo.nome }}">{{ cargo.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="reset" class="btn btn-secondary me-md-2">
                        <i class="fas fa-eraser"></i> Limpar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Validação do formulário
    document.getElementById('form-usuario').addEventListener('submit', function (e) {
        const senha = document.getElementById('senha').value;
        const confirmarSenha = document.getElementById('confirmar_senha').value;

        // Verifica se as senhas coincidem
        if (senha !== confirmarSenha) {
            e.preventDefault();
            alert('As senhas não coincidem!');
            return false;
        }

        // Verifica o tamanho mínimo da senha
        if (senha.length < 8) {
            e.preventDefault();
            alert('A senha deve ter pelo menos 8 caracteres!');
            return false;
        }

        return true;
    });
</script>
{% endblock %}
