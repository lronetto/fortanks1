<!-- Modal para Nova Unidade -->
<div class="modal fade" id="novaUnidadeModal" tabindex="-1" aria-labelledby="novaUnidadeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="novaUnidadeModalLabel">Adicionar Nova Unidade</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="form-group mb-3">
                    <label for="nova-unidade" class="form-label">Nome da Unidade <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="nova-unidade" placeholder="Ex: kg, m³, l">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btn-adicionar-unidade">Adicionar</button>
            </div>
        </div>
    </div>
</div>
