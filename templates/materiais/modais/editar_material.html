<!-- Modal de Edição de Material -->
<div class="modal fade" id="modalEditarMaterial" tabindex="-1" aria-labelledby="modalEditarMaterialLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalEditarMaterialLabel"><i class="fas fa-edit"></i> Editar Material</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form id="form-editar-material" method="POST">
                    <input type="hidden" id="edit_id" name="material_id">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="edit_codigo" class="form-label">Código SOX</label>
                            <input type="text" class="form-control" id="edit_codigo" name="edit_codigo">
                            <small class="text-muted">Código interno ou SKU do material</small>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="edit_codigo_erp" class="form-label">Código ERP</label>
                            <input type="text" class="form-control" id="edit_codigo_erp" name="edit_codigo_erp">
                            <small class="text-muted">Código usado no sistema ERP (opcional)</small>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="edit_categoria" class="form-label">Categoria</label>
                            <select class="form-select" id="edit_categoria" name="edit_categoria" required>
                                <option value="" disabled>Selecione uma categoria</option>
                                <option value="Matéria-prima">Matéria-prima</option>
                                <option value="Insumo">Insumo</option>
                                <option value="Ferramenta">Ferramenta</option>
                                <option value="Equipamento">Equipamento</option>
                                <option value="Material de Escritório">Material de Escritório</option>
                                <option value="Serviço">Serviço</option>
                                <option value="EPI">EPI</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label for="edit_nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="edit_nome" name="edit_nome" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="edit_unidade" class="form-label">Unidade de Medida</label>
                            <select class="form-select" id="edit_unidade" name="edit_unidade">
                                <option value="">Selecione uma unidade</option>
                                {% for unidade in unidades %}
                                <option value="{{ unidade.id }}">{{ unidade.nome }}</option>
                                {% endfor %}
                            </select>
                            
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="edit_plano_conta" class="form-label">Plano de Conta</label>
                            <select class="form-select select2-plano-conta" id="edit_plano_conta" name="edit_plano_conta">
                                <option value="">Selecione o plano de conta (opcional)</option>
                                {% for plano in planos_conta %}
                                <option value="{{ plano.codigo }}">
                                    {{ plano.codigo }} - {{ plano.descricao }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label for="edit_descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="edit_descricao" name="edit_descricao" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div id="modal-mensagens"></div>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btn-salvar-edicao">
                    <i class="fas fa-save"></i> Salvar Alterações
                </button>
            </div>
        </div>
    </div>
</div> 
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Configurar o botão de alternar unidade
    const btnAlternarUnidade = document.getElementById('btn-alternar-unidade');
    const unidadeSelect = document.getElementById('edit_unidade');
    const unidadeTexto = document.getElementById('unidade_texto');
    
    if (btnAlternarUnidade && unidadeSelect && unidadeTexto) {
        btnAlternarUnidade.addEventListener('click', function() {
            if (unidadeTexto.style.display === 'none') {
                unidadeSelect.style.display = 'none';
                unidadeTexto.style.display = 'block';
                unidadeTexto.value = unidadeSelect.value;
                btnAlternarUnidade.textContent = 'Usar opções pré-definidas';
            } else {
                unidadeTexto.style.display = 'none';
                unidadeSelect.style.display = 'block';
                btnAlternarUnidade.textContent = 'Digitar unidade manualmente';
            }
        });
    }

    // Manipulação do Modal de Edição
    const modal = new bootstrap.Modal(document.getElementById('modalEditarMaterial'));
    // Preencher o modal com os dados do material
    function preencherModal(material) {
        if (!material) {
            console.error('Dados do material não encontrados!');
            return;
        }
        try {
            document.getElementById('edit_id').value = material.id || '';
            document.getElementById('edit_codigo').value = material.codigo || '';
            document.getElementById('edit_codigo_erp').value = material.codigo_erp || '';
            document.getElementById('edit_nome').value = material.nome || '';
            document.getElementById('edit_descricao').value = material.descricao || '';
            const categoriaSelect = document.getElementById('edit_categoria');
            if (categoriaSelect) {
                categoriaSelect.value = material.categoria || '';
            }
            const planoContaSelect = document.getElementById('edit_plano_conta');
            if (planoContaSelect) {
                planoContaSelect.value = material.plano_conta || '';
                try { $(planoContaSelect).trigger('change'); } catch (e) {}
            }
                
            unidadeSelect.value = material.unidade || '';
                
            
        } catch (error) {
            console.error('Erro ao preencher o modal:', error);
        }
    }
    // Adicionar evento para o botão de editar
    const editButtons = document.querySelectorAll('.btn-editar');
    editButtons.forEach(button => {
        button.addEventListener('click', function() {
            try {
                const materialId = this.getAttribute('data-id');
                if (this.dataset) {
                    const material = {
                        id: this.dataset.id,
                        codigo: this.dataset.codigo || '',
                        codigo_erp: this.dataset.codigoErp || '',
                        nome: this.dataset.nome || '',
                        descricao: this.dataset.descricao || '',
                        categoria: this.dataset.categoria || '',
                        plano_conta: this.dataset.planoConta || '',
                        unidade: this.dataset.unidade || ''
                    };
                    preencherModal(material);
                    return;
                }
                const url = `/materiais/obter-ajax/${materialId}`;
                fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => {
                    if (response.headers.get('content-type').includes('application/json')) {
                        return response.json();
                    } else {
                        return response.text().then(text => { throw new Error('Resposta do servidor não é JSON válido'); });
                    }
                })
                .then(data => {
                    if (data.success) {
                        preencherModal(data.material);
                    } else {
                        alert('Erro ao carregar os dados do material: ' + (data.error || 'Erro desconhecido'));
                    }
                })
                .catch(error => {
                    alert('Erro ao carregar os dados do material: ' + error.message);
                });
            } catch (error) {
                alert('Ocorreu um erro ao processar sua solicitação');
            }
        });
    });
    // Adicionar evento para o botão de salvar edição
    const btnSalvarEdicao = document.getElementById('btn-salvar-edicao');
    if (btnSalvarEdicao) {
        btnSalvarEdicao.addEventListener('click', function() {
            try {
                const materialId = document.getElementById('edit_id').value;
                const unidadeSelect = document.getElementById('edit_unidade');
                const unidadeTexto = document.getElementById('unidade_edit');
                const categoriaSelect = document.getElementById('edit_categoria');
                if (!categoriaSelect.value) {
                    alert('A categoria é obrigatória. Por favor, selecione uma categoria para o material.');
                    categoriaSelect.focus();
                    return;
                }
                const nomeInput = document.getElementById('edit_nome');
                if (!nomeInput.value.trim()) {
                    alert('O nome do material é obrigatório. Por favor, preencha o nome do material.');
                    nomeInput.focus();
                    return;
                }
                const form = document.getElementById('form-editar-material');
                const formData = new FormData(form);
                const url = `/material/editar-material-ajax/${materialId}`;
                const xhr = new XMLHttpRequest();
                xhr.open('POST', url, true);
                xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                const resposta = JSON.parse(xhr.responseText);
                                if (resposta.success) {
                                    window.location.reload();
                                } else {
                                    alert(resposta.message || resposta.error || 'Erro ao salvar o material.');
                                }
                            } catch (e) {
                                alert('Erro ao processar resposta do servidor. Verifique o console para mais detalhes.');
                            }
                        } else {
                            alert('Erro ao enviar requisição para o servidor. Status: ' + xhr.status);
                        }
                    }
                };
                xhr.onerror = function() {
                    alert('Erro de conexão ao tentar salvar. Verifique sua conexão de internet.');
                };
                xhr.send(formData);
            } catch (error) {
                alert('Ocorreu um erro ao processar sua solicitação: ' + error.message);
            }
        });
    }
    // Validação do formulário de edição
    $('#form-editar-material').submit(function(e) {
        const nome = $('#edit_nome').val().trim();
        const categoria = $('#edit_categoria').val();
        if (!nome) {
            e.preventDefault();
            alert('O nome do material é obrigatório!');
            $('#edit_nome').focus();
            return false;
        }
        if (!categoria) {
            e.preventDefault();
            alert('A categoria do material é obrigatória!');
            $('#edit_categoria').focus();
            return false;
        }
        return true;
    });
});
</script>
{% endblock %}
