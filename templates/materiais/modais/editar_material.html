<!-- Modal de Edição de Material -->
<div class="modal fade" id="modalEditarMaterial" tabindex="-1" aria-labelledby="modalEditarMaterialLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalEditarMaterialLabel"><i class="fas fa-edit"></i> Editar Material</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form id="form-editar-material" method="POST">
                    <input type="hidden" id="edit_id" name="material_id">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="edit_codigo" class="form-label">Código SOX</label>
                            <input type="text" class="form-control" id="edit_codigo" name="edit_codigo">
                            <small class="text-muted">Código interno ou SKU do material</small>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="edit_codigo_erp" class="form-label">Código ERP</label>
                            <input type="text" class="form-control" id="edit_codigo_erp" name="edit_codigo_erp">
                            <small class="text-muted">Código usado no sistema ERP (opcional)</small>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="edit_categoria" class="form-label">Categoria</label>
                            <select class="form-select" id="edit_categoria" name="edit_categoria" required>
                                <option value="" disabled>Selecione uma categoria</option>
                                <option value="Matéria-prima">Matéria-prima</option>
                                <option value="Insumo">Insumo</option>
                                <option value="Ferramenta">Ferramenta</option>
                                <option value="Equipamento">Equipamento</option>
                                <option value="Material de Escritório">Material de Escritório</option>
                                <option value="Serviço">Serviço</option>
                                <option value="EPI">EPI</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label for="edit_nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="edit_nome" name="edit_nome" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="edit_unidade" class="form-label">Unidade de Medida</label>
                            <select class="form-select" id="edit_unidade" name="edit_unidade">
                                <option value="">Selecione uma unidade</option>
                                {% for unidade in unidades %}
                                <option value="{{ unidade.id }}">{{ unidade.nome }}</option>
                                {% endfor %}
                            </select>
                            
                            <!-- Campo alternativo de texto para unidade, inicialmente oculto -->
                            <input type="text" id="unidade_texto" name="unidade_texto" class="form-control mt-2" style="display:none;">
                            
                            <!-- Botão para alternar para input de texto se o select não funcionar -->
                            <button type="button" id="btn-alternar-unidade" class="btn btn-sm btn-outline-secondary mt-2">
                                Digitar unidade manualmente
                            </button>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="edit_plano_conta" class="form-label">Plano de Conta</label>
                            <select class="form-select select2-plano-conta" id="edit_plano_conta" name="edit_plano_conta">
                                <option value="">Selecione o plano de conta (opcional)</option>
                                {% for plano in planos_conta %}
                                <option value="{{ plano.codigo }}">
                                    {{ plano.codigo }} - {{ plano.descricao }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label for="edit_descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="edit_descricao" name="edit_descricao" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div id="modal-mensagens"></div>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btn-salvar-edicao">
                    <i class="fas fa-save"></i> Salvar Alterações
                </button>
            </div>
        </div>
    </div>
</div> 
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Configurar o botão de alternar unidade
    const btnAlternarUnidade = document.getElementById('btn-alternar-unidade');
    const unidadeSelect = document.getElementById('edit_unidade');
    const unidadeTexto = document.getElementById('unidade_texto');
    
    if (btnAlternarUnidade && unidadeSelect && unidadeTexto) {
        btnAlternarUnidade.addEventListener('click', function() {
            if (unidadeTexto.style.display === 'none') {
                unidadeSelect.style.display = 'none';
                unidadeTexto.style.display = 'block';
                unidadeTexto.value = unidadeSelect.value;
                btnAlternarUnidade.textContent = 'Usar opções pré-definidas';
            } else {
                unidadeTexto.style.display = 'none';
                unidadeSelect.style.display = 'block';
                btnAlternarUnidade.textContent = 'Digitar unidade manualmente';
            }
        });
    }

    // Manipulação do Modal de Edição
    const modal = new bootstrap.Modal(document.getElementById('modalEditarMaterial'));
    // Preencher o modal com os dados do material
    function preencherModal(material) {
        if (!material) {
            console.error('Dados do material não encontrados!');
            return;
        }
        // ... (restante da função preencherModal igual ao index.html)
    }
    // Adicionar evento para o botão de editar
    const editButtons = document.querySelectorAll('.btn-editar');
    editButtons.forEach(button => {
        button.addEventListener('click', function() {
            // ... (lógica de click igual ao index.html)
        });
    });
    // Adicionar evento para o botão de salvar edição
    const btnSalvarEdicao = document.getElementById('btn-salvar-edicao');
    if (btnSalvarEdicao) {
        btnSalvarEdicao.addEventListener('click', function() {
            // ... (lógica de salvar igual ao index.html)
        });
    }
    // Validação do formulário de edição
    $('#form-editar-material').submit(function(e) {
        const nome = $('#edit_nome').val().trim();
        const categoria = $('#edit_categoria').val();
        if (!nome) {
            e.preventDefault();
            alert('O nome do material é obrigatório!');
            $('#edit_nome').focus();
            return false;
        }
        if (!categoria) {
            e.preventDefault();
            alert('A categoria do material é obrigatória!');
            $('#edit_categoria').focus();
            return false;
        }
        return true;
    });
});
</script>
{% endblock %}
