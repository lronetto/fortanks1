<!-- Modal de Visualização de Grupo de Materiais -->
<div class="modal fade" id="modalVisualizarGrupo" tabindex="-1" aria-labelledby="modalVisualizarGrupoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title" id="modalVisualizarGrupoLabel"><i class="fas fa-eye"></i> Detalhes do Grupo</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6 class="text-primary">Informações Básicas</h6>
                        <table class="table table-sm">
                            <tr>
                                <td><strong>Nome:</strong></td>
                                <td id="view_nome">-</td>
                            </tr>
                            <tr>
                                <td><strong>Status:</strong></td>
                                <td id="view_status">-</td>
                            </tr>
                            <tr>
                                <td><strong>Total de Materiais:</strong></td>
                                <td id="view_total_materiais">-</td>
                            </tr>
                        </table>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-primary">Identificação Visual</h6>
                        <table class="table table-sm">
                            <tr>
                                <td><strong>Cor:</strong></td>
                                <td id="view_cor">-</td>
                            </tr>
                            <tr>
                                <td><strong>Ícone:</strong></td>
                                <td id="view_icone">-</td>
                            </tr>
                        </table>
                    </div>
                </div>
                
                <div class="row mt-3">
                    <div class="col-md-12">
                        <h6 class="text-primary">Descrição</h6>
                        <div id="view_descricao" class="alert alert-light">
                            -
                        </div>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-6">
                        <h6 class="text-primary">Informações de Criação</h6>
                        <table class="table table-sm">
                            <tr>
                                <td><strong>Criado em:</strong></td>
                                <td id="view_criado_em">-</td>
                            </tr>
                            <tr>
                                <td><strong>Criado por:</strong></td>
                                <td id="view_criado_por">-</td>
                            </tr>
                        </table>
                    </div>
                </div>

                <!-- Preview Visual -->
                <div class="row mt-3">
                    <div class="col-md-12">
                        <h6 class="text-primary">Preview Visual</h6>
                        <div class="card">
                            <div class="card-body">
                                <div class="d-flex align-items-center" id="preview-grupo">
                                    <i class="fas fa-layer-group fa-2x me-3"></i>
                                    <div>
                                        <h5 class="mb-0">Nome do Grupo</h5>
                                        <small class="text-muted">Código do Grupo</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-primary" id="btn-editar-apos-visualizar">
                    <i class="fas fa-edit"></i> Editar
                </button>
                <a href="#" class="btn btn-warning" id="btn-ver-materiais">
                    <i class="fas fa-boxes"></i> Ver Materiais
                </a>
            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Função para preencher o modal de visualização
    function preencherModalVisualizacao(grupo) {
        if (!grupo) {
            console.error('Dados do grupo não encontrados!');
            return;
        }
        
        try {
            // Informações básicas
            document.getElementById('view_nome').textContent = grupo.nome || '-';
            document.getElementById('view_status').innerHTML = grupo.ativo === 'true' || grupo.ativo === true ?
                '<span class="badge bg-success">Ativo</span>' :
                '<span class="badge bg-secondary">Inativo</span>';
            document.getElementById('view_total_materiais').textContent = grupo.total_materiais || '0';
            
            // Identificação visual
            const cor = grupo.cor || '#007bff';
            document.getElementById('view_cor').innerHTML = `
                <span class="badge" style="background-color: ${cor}; color: white;">${cor}</span>
            `;
            
            const icone = grupo.icone || 'fas fa-layer-group';
            document.getElementById('view_icone').innerHTML = `<i class="${icone}"></i> ${icone}`;
            
            // Descrição
            const descricao = document.getElementById('view_descricao');
            if (grupo.descricao && grupo.descricao.trim() !== '') {
                descricao.textContent = grupo.descricao;
                descricao.className = 'alert alert-light';
            } else {
                descricao.textContent = 'Nenhuma descrição fornecida';
                descricao.className = 'alert alert-secondary';
            }
            
            // Informações de criação
            document.getElementById('view_criado_em').textContent = grupo.criado_em || '-';
            document.getElementById('view_criado_por').textContent = grupo.criado_por || '-';
            
            // Atualizar preview visual
            const preview = document.getElementById('preview-grupo');
            const iconeElement = preview.querySelector('i');
            const nomeElement = preview.querySelector('h5');
            
            iconeElement.className = `${icone} fa-2x me-3`;
            iconeElement.style.color = cor;
            nomeElement.textContent = grupo.nome || 'Nome do Grupo';
            
        } catch (error) {
            console.error('Erro ao preencher o modal de visualização:', error);
        }
    }

    // Adicionar evento para o botão de visualizar
    const viewButtons = document.querySelectorAll('.btn-visualizar-grupo');
    viewButtons.forEach(button => {
        button.addEventListener('click', function() {
            try {
                const grupo = {
                    id: this.dataset.id,
                    nome: this.dataset.nome,
                    descricao: this.dataset.descricao,
                    cor: this.dataset.cor,
                    icone: this.dataset.icone,
                    ativo: this.dataset.ativo,
                    total_materiais: this.dataset.totalMateriais,
                    criado_em: this.dataset.criadoEm,
                    criado_por: this.dataset.criadoPor
                };
                
                preencherModalVisualizacao(grupo);
            } catch (error) {
                alert('Ocorreu um erro ao processar sua solicitação');
            }
        });
    });

    // Botão para editar após visualizar
    $('#btn-editar-apos-visualizar').click(function() {
        $('#modalVisualizarGrupo').modal('hide');
        // Aqui você pode implementar a lógica para abrir o modal de edição
        // com os dados já carregados
    });

    // Botão para ver materiais
    $('#btn-ver-materiais').click(function() {
        const grupoId = $('#view_nome').attr('data-grupo-id');
        if (grupoId) {
            window.location.href = `/grupos-materiais/${grupoId}/materiais`;
        }
    });
});
</script>
{% endblock %}
