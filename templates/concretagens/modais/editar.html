<!-- Modal de Edição de Concretagem -->
<div class="modal fade" id="modalEditarConcretagem" tabindex="-1" aria-labelledby="modalEditarConcretagemLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formEditarConcretagem">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="edit_id" name="id">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarConcretagemLabel">Editar Concretagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="edit_data_concretagem" class="form-label fw-bold">Data *</label>
                        <input type="date" class="form-control" id="edit_data_concretagem" name="data_concretagem" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit_pista" class="form-label fw-bold">Pista *</label>
                        <select class="form-select" id="edit_pista" name="pista" required>
                            <option value="">Selecione a pista</option>
                            <option value="001">001</option>
                            <option value="002">002</option>
                            <option value="001-PF">001-PF</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#formEditarConcretagem').on('submit', function(e) {
            e.preventDefault();
            
            const id = $('#edit_id').val();
            const formData = {
                csrf_token: $('#csrf_token_global').val(),
                data_concretagem: $('#edit_data_concretagem').val(),
                pista: $('#edit_pista').val()
            };

            $.ajax({
                url: `/concretagens/api/${id}/editar`,
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    'X-CSRFToken': $('#csrf_token_global').val()
                },
                data: JSON.stringify(formData),
                success: function(response) {
                    if (response.success) {
                        $('#modalEditarConcretagem').modal('hide');
                        $('#tabelaConcretagens').DataTable().ajax.reload();
                        alert('Concretagem atualizada com sucesso!');
                    } else {
                        alert('Erro: ' + (response.message || 'Erro ao atualizar concretagem'));
                    }
                },
                error: function() {
                    alert('Erro ao atualizar concretagem. Tente novamente.');
                }
            });
        });
    });
</script>
