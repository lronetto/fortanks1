<!-- Modal de Referência de Usinagem -->
<div class="modal fade" id="modalReferenciarUsinagem" tabindex="-1" aria-labelledby="modalReferenciarUsinagemLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="formReferenciarUsinagem" method="POST" action="">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalReferenciarUsinagemLabel">Referenciar Usinagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> Selecione a usinagem que foi utilizada para as peças da concretagem <strong id="concretagem-info-usinagem"></strong>
                    </div>
                    <!-- Seleção da Usinagem -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="usinagem_id" class="form-label fw-bold">Usinagem *</label>
                            <select class="form-select form-control" id="usinagem_id" name="usinagem_id" required>
                                <option value="">Selecione uma usinagem</option>
                                {% for usinagem in usinagens %}
                                <option value="{{ usinagem.id }}">{{ usinagem.data_usinagem.strftime('%d/%m/%Y') }} - NBT: {{ usinagem.nbt }} - Nota: {{ usinagem.nota }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <!-- Tabela de Peças da Concretagem -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label class="form-label fw-bold">Peças da concretagem</label>
                            <div class="alert alert-info py-2" id="alerta-carregando-pecas-usinagem">
                                <i class="fas fa-spinner fa-spin"></i> Carregando peças...
                            </div>
                            <div id="div-pecas-usinagem" style="display: none;">
                                <div class="table-responsive" style="max-height: 350px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 4px;">
                                    <table class="table table-sm table-bordered table-hover" id="tabelaPecasUsinagem">
                                        <thead class="sticky-top bg-white">
                                            <tr>
                                                <th width="5%" class="align-middle text-center">
                                                    <input type="checkbox" class="form-check-input" id="selecionar-todas-pecas">
                                                </th>
                                                <th width="15%" class="align-middle">Tanque</th>
                                                <th width="15%" class="align-middle">Tipo</th>
                                                <th width="10%" class="align-middle">Nome</th>
                                                <th width="5%" class="align-middle">Forma</th>
                                                <th width="20%" class="align-middle">Usinagem Atual</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- As peças serão carregadas via JavaScript -->
                                        </tbody>
                                    </table>
                                </div>
                                <!-- Contador de peças selecionadas -->
                                <div class="mt-2 alert alert-info py-2" id="contadorPecasUsinagem">
                                    <i class="fas fa-info-circle"></i> Nenhuma peça selecionada
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Referências</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% block scripts %}
<script>
$(function() {
    // Configuração do modal de referenciar usinagem
    document.addEventListener('DOMContentLoaded', function() {
        $('#selecionar-todas-pecas').click(function() {
            const isChecked = $(this).is(':checked');
            $('#tabelaPecasUsinagem tbody input[name="peca_ids"]').prop('checked', isChecked);
            });
        $('#tabelaPecasUsinagem tbody input[name="peca_ids"]').is(':checked', function() {
            console.log('click');
            $('#contadorPecasUsinagem').text(`${$('#tabelaPecasUsinagem tbody input[name="peca_ids"]:checked').length} peças selecionadas`);
        });
    });
    $('.referenciar-usinagem').click(function() {
        const id = $(this).data('id');
        const tanques = $(this).data('tanques');
        $('#concretagem-info-usinagem').text(`(#${id} - ${tanques})`);
        $('#formReferenciarUsinagem').attr('action', `/concretagens/referenciar-usinagem/${id}`);
        $('#alerta-carregando-pecas-usinagem').show();
        $('#div-pecas-usinagem').hide();
        $('#formReferenciarUsinagem button[type="submit"]').prop('disabled', true);
        const pecasTableBody = $('#tabelaPecasUsinagem tbody');
        pecasTableBody.empty();
        fetch(`/concretagens/api/concretagem/${id}/pecas`)
            .then(response => {
                if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);
                return response.json();
            })
            .then(pecas => {
                if (pecas.length > 0) {
                    pecas.forEach((peca, index) => {
                        const row = `
                            <tr>
                                <td class="text-center">
                                    <input type="checkbox" name="peca_ids" value="${peca.id}" class="form-check-input">
                                </td>
                                <td>${peca.tanque}</td>
                                <td>${peca.tipo}</td>
                                <td>${peca.nome}</td>
                                <td>${peca.forma || '-'}</td>
                                <td>${peca.usinagem_id ? '<span class="badge bg-success">Sim</span>' : '<span class="badge bg-secondary">Não</span>'}</td>
                            </tr>`;
                        pecasTableBody.append(row);
                    });
                    $('#formReferenciarUsinagem button[type="submit"]').prop('disabled', false);
                } else {
                    pecasTableBody.append('<tr><td colspan="5" class="text-center">Nenhuma peça encontrada nesta concretagem</td></tr>');
                    $('#formReferenciarUsinagem button[type="submit"]').prop('disabled', true);
                }
                $('#alerta-carregando-pecas-usinagem').hide();
                $('#div-pecas-usinagem').show();
                const referenciarModal = bootstrap.Modal.getInstance(document.getElementById('modalReferenciarUsinagem')) || new bootstrap.Modal(document.getElementById('modalReferenciarUsinagem'));
                referenciarModal.show();
            })
            .catch(error => {
                console.error('Erro ao carregar peças para referenciar usinagem:', error);
                pecasTableBody.empty().append('<tr><td colspan="5" class="text-center text-danger">Erro ao carregar peças. Tente novamente.</td></tr>');
                $('#alerta-carregando-pecas-usinagem').hide();
                $('#div-pecas-usinagem').show();
                $('#formReferenciarUsinagem button[type="submit"]').prop('disabled', true);
                const referenciarModal = bootstrap.Modal.getInstance(document.getElementById('modalReferenciarUsinagem')) || new bootstrap.Modal(document.getElementById('modalReferenciarUsinagem'));
                referenciarModal.show();
            });
    });
    // Validar formulário de referenciar usinagem
    $('#formReferenciarUsinagem').submit(function(e) {
        const usinagemId = $('#usinagem_id').val();
        const pecasSelecionadas = $('#tabelaPecasUsinagem input[name="peca_ids"]:checked').length;
        if (!usinagemId) {
            e.preventDefault();
            alert('Selecione uma usinagem');
            return false;
        }
        if (pecasSelecionadas === 0) {
            e.preventDefault();
            alert('Selecione pelo menos uma peça');
            return false;
        }
        return true;
    });
});
</script>
{% endblock %}
