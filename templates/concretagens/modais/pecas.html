<!-- Modal de Peças -->
<div class="modal fade" id="modalPecas" tabindex="-1" aria-labelledby="modalPecasLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <form id="formPecas">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="concretagem_id_pecas" name="concretagem_id">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPecasLabel">Cadastrar Peças</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <div class="row">
                            <div class="col-md-4">
                                <label for="filtro_tanque" class="form-label">Filtrar por Tanque</label>
                                <select class="form-select" id="filtro_tanque">
                                    <option value="">Todos os tanques</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered" id="tabelaPecasModal">
                            <thead>
                                <tr>
                                    <th>Tanque</th>
                                    <th>Peça</th>
                                    <th>Forma</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Linhas serão adicionadas dinamicamente -->
                            </tbody>
                        </table>
                    </div>
                    <button type="button" class="btn btn-sm btn-primary mt-2" id="btnAdicionarPeca">
                        <i class="fas fa-plus"></i> Adicionar Peça
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="btnExportarPecasPDF" title="Exportar Peças para PDF">
                        <i class="fas fa-file-pdf"></i> Exportar PDF
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        let tanques = [];
        let pecas = [];
        let contadorPecas = 0;
        let carregandoPecas = false; // Flag para evitar recursão
        let pistaAtual = null; // Variável para armazenar a pista

        // Função para carregar peças existentes: busca todas via API e depois monta o template
        function carregarDadosPecas(id) {
            console.log('Carregando peças para concretagem ID:', id);
            carregandoPecas = true;

            $.get(`/concretagens/api/${id}/pecas`, function(data) {
                if (!data.pecas || data.pecas.length === 0) {
                    console.log('Nenhuma peça encontrada para esta concretagem');
                    carregandoPecas = false;
                    return;
                }

                console.log(`Carregando ${data.pecas.length} peças existentes`);

                // Extrair tanque_ids únicos das peças da concretagem
                const tanqueIdsUnicos = [];
                const visto = {};
                data.pecas.forEach(function(pecaItem) {
                    const tanqueObj = pecaItem.tanque_obj;
                    const tanqueIdObj = pecaItem.tanque_id || pecaItem.tanque || (tanqueObj ? tanqueObj.id : null);
                    if (tanqueIdObj) {
                        const tid = parseInt(tanqueIdObj, 10);
                        if (!visto[tid]) {
                            visto[tid] = true;
                            tanqueIdsUnicos.push(tid);
                        }
                    }
                });

                // Buscar peças de todos os tanques em paralelo (uma requisição por tanque)
                const requisicoes = tanqueIdsUnicos.map(function(tanqueId) {
                    return $.ajax({
                        url: '/concretagens/api/tanque/pecas',
                        method: 'GET',
                        data: {
                            tanque_id: tanqueId,
                            nao_concretadas: false,
                            pista: pistaAtual
                        }
                    }).then(function(pecasData) {
                        return { tanqueId: tanqueId, pecas: Array.isArray(pecasData) ? pecasData : (pecasData || []) };
                    });
                });

                if (requisicoes.length === 0) {
                    carregandoPecas = false;
                    return;
                }

                $.when.apply($, requisicoes).then(function() {
                    const resultados = Array.prototype.slice.call(arguments);
                    const pecasPorTanque = {};
                    resultados.forEach(function(res) {
                        if (res && res.tanqueId != null && res.pecas) {
                            pecasPorTanque[res.tanqueId] = res.pecas;
                        }
                    });

                    // Montar todas as linhas e inserir de uma vez
                    const linhasHtml = [];
                    data.pecas.forEach(function(pecaItem) {
                        const pecaNome = pecaItem.nome || pecaItem.placa;
                        const tanqueIdObj = pecaItem.tanque_id || pecaItem.tanque || (pecaItem.tanque_obj ? pecaItem.tanque_obj.id : null);
                        if (!pecaNome || !tanqueIdObj) {
                            console.warn('Peça ou tanque ausente:', pecaItem);
                            return;
                        }
                        const tanqueId = parseInt(tanqueIdObj, 10);
                        const pecasDoTanque = pecasPorTanque[tanqueId] || [];
                        const formaValue = (pecaItem.forma || 0).toString().replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                        contadorPecas++;
                        const linha = `
                            <tr data-index="${contadorPecas}" data-tanque-id="${tanqueId}">
                                <td>
                                    <select class="form-select form-select-sm peca-tanque" data-index="${contadorPecas}">
                                        <option value="">Selecione o tanque</option>
                                        ${tanques.map(t => `<option value="${t.id}" ${t.id === tanqueId ? 'selected' : ''}>${t.nome}</option>`).join('')}
                                    </select>
                                </td>
                                <td>
                                    <select class="form-select form-select-sm peca-peca" data-index="${contadorPecas}">
                                        <option value="">Selecione a peça</option>
                                        ${pecasDoTanque.map(p => {
                                            const isSelected = p.nome === pecaNome;
                                            return `<option value="${p.id}" data-nome="${p.nome}" ${isSelected ? 'selected' : ''}>${p.nome} (${p.tipo})</option>`;
                                        }).join('')}
                                    </select>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm peca-forma" value="${formaValue}" placeholder="Forma">
                                </td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-danger btn-remover-peca">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                        linhasHtml.push(linha);
                    });

                    $('#tabelaPecasModal tbody').append(linhasHtml.join(''));
                    console.log('Todas as peças carregadas. Total de linhas:', $('#tabelaPecasModal tbody tr').length);
                    carregandoPecas = false;
                    aplicarFiltrosPecas();
                }).fail(function() {
                    console.error('Erro ao carregar peças de algum tanque.');
                    carregandoPecas = false;
                });
            }).fail(function(xhr, status, error) {
                console.error('Erro ao carregar peças da concretagem:', error, xhr.responseText);
                alert('Erro ao carregar peças existentes. Verifique o console para mais detalhes.');
                carregandoPecas = false;
            });
        }

        // Carregar tanques ao abrir o modal
        $('#modalPecas').on('show.bs.modal', function(e) {
            const id = $(this).data('concretagem-id') || $(e.relatedTarget)?.data('id');
            pistaAtual = $(this).data('pista') || $(e.relatedTarget)?.data('pista');
            // Resetar contador e filtro
            contadorPecas = 0;
            $('#tabelaPecasModal tbody').empty();
            carregandoPecas = false;
            $('#filtro_tanque').val('');
            
            if (id) {
                $('#concretagem_id_pecas').val(id);
                
                // Carregar tanques primeiro e depois peças
                carregarTanques(function() {
                    // Após tanques carregarem, carregar peças existentes
                    carregarDadosPecas(id);
                });
            } else {
                // Se não tem ID, apenas carregar tanques (nova concretagem)
                carregarTanques();
            }
        });

        function carregarTanques(callback) {
            $.get('/concretagens/api/tanques', function(data) {
                tanques = data.tanques || [];
                const select = $('#filtro_tanque');
                select.empty().append('<option value="">Todos os tanques</option>');
                tanques.forEach(function(tanque) {
                    select.append(`<option value="${tanque.id}">${tanque.nome}</option>`);
                });
                
                // Executar callback se fornecido
                if (typeof callback === 'function') {
                    callback();
                }
            });
        }

        // Aplicar filtro por tanque na tabela de peças do modal
        function aplicarFiltrosPecas() {
            const filtroTanque = $('#filtro_tanque').val();
            $('#tabelaPecasModal tbody tr').each(function() {
                const tanqueId = $(this).attr('data-tanque-id') || '';
                const show = !filtroTanque || tanqueId === filtroTanque;
                $(this).toggle(show);
            });
        }

        $('#filtro_tanque').on('change', aplicarFiltrosPecas);

        function carregarPecasPorTanque(tanqueId) {
            $.get(`/concretagens/api/tanque/${tanqueId}/pecas`, function(data) {
                pecas = data || [];
            });
        }

        // Adicionar nova linha de peça
        $('#btnAdicionarPeca').on('click', function() {
            contadorPecas++;
            const linha = `
                <tr data-index="${contadorPecas}" data-tanque-id="">
                    <td>
                        <select class="form-select form-select-sm peca-tanque" data-index="${contadorPecas}">
                            <option value="">Selecione o tanque</option>
                            ${tanques.map(t => `<option value="${t.id}">${t.nome}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <select class="form-select form-select-sm peca-peca" data-index="${contadorPecas}" disabled>
                            <option value="">Selecione a peça</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" class="form-control form-control-sm peca-forma" placeholder="Forma">
                    </td>
                    <td>
                        <button type="button" class="btn btn-sm btn-danger btn-remover-peca">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            $('#tabelaPecasModal tbody').append(linha);
            aplicarFiltrosPecas();
        });

        // Quando selecionar tanque, carregar peças e atualizar data-tanque-id para o filtro
        $(document).on('change', '.peca-tanque', function() {
            // Ignorar eventos durante o carregamento inicial para evitar recursão
            if (carregandoPecas) {
                return;
            }
            
            const tanqueId = $(this).val();
            const index = $(this).data('index');
            const selectPeca = $(`.peca-peca[data-index="${index}"]`);
            const linha = $(this).closest('tr');
            linha.attr('data-tanque-id', tanqueId || '');
            const valorAtual = selectPeca.val(); // Salvar valor atual se houver
            
            selectPeca.prop('disabled', !tanqueId);
            selectPeca.empty().append('<option value="">Selecione a peça</option>');
            
            if (tanqueId) {
                $.ajax({
                    url: `/concretagens/api/tanque/pecas`, 
                    method: 'GET',
                    data: {
                        tanque_id: tanqueId,
                        nao_concretadas: true,
                        pista: pistaAtual
                    },
                    success: function(data) {
                        data.forEach(function(peca) {
                            // Selecionar pelo ID (valorAtual é o ID do select)
                            const isSelected = (valorAtual && (peca.id == valorAtual || peca.id === parseInt(valorAtual)));
                            selectPeca.append(`<option value="${peca.id}" data-nome="${peca.nome}" ${isSelected ? 'selected' : ''}>${peca.nome} (${peca.tipo})</option>`);
                        });
                    }
                });
            }
        });

        // Remover linha de peça
        $(document).on('click', '.btn-remover-peca', function() {
            $(this).closest('tr').remove();
        });

        // Salvar peças
        $('#formPecas').on('submit', function(e) {
            e.preventDefault();
            
            const concretagemId = $('#concretagem_id_pecas').val();
            const pecasData = [];
            
            $('#tabelaPecasModal tbody tr').each(function() {
                const tanqueId = $(this).find('.peca-tanque').val();
                const pecaSelect = $(this).find('.peca-peca');
                const pecaId = pecaSelect.val();
                const pecaNome = pecaSelect.find('option:selected').data('nome') || pecaSelect.find('option:selected').text().split(' (')[0]; // Pegar nome da peça
                const forma = $(this).find('.peca-forma').val();
                
                if (pecaId && pecaNome && tanqueId) {
                    pecasData.push({
                        nome: pecaNome, // Novo formato: usar "nome" ao invés de "placa"
                        tanque_id: parseInt(tanqueId), // Novo formato: usar "tanque_id" ao invés de "tanque"
                        forma: forma ? parseInt(forma) : 0 // Garantir que forma seja número
                    });
                }
            });

            const dados = {
                csrf_token: $('#csrf_token_global').val(),
                pecas: JSON.stringify(pecasData)
            };

            $.ajax({
                url: `/concretagens/api/${concretagemId}/pecas`,
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    'X-CSRFToken': $('#csrf_token_global').val()
                },
                data: JSON.stringify(dados),
                success: function(response) {
                    if (response.success) {
                        $('#modalPecas').modal('hide');
                        alert('Peças salvas com sucesso!');
                    } else {
                        alert('Erro: ' + (response.message || 'Erro ao salvar peças'));
                    }
                },
                error: function() {
                    alert('Erro ao salvar peças. Tente novamente.');
                }
            });
        });
        
        // Expor função globalmente para uso externo
        window.carregarDadosPecas = carregarDadosPecas;
        
        // Exportar PDF de peças
        $('#btnExportarPecasPDF').on('click', function() {
            const concretagemId = $('#concretagem_id_pecas').val();
            if (!concretagemId) {
                alert('Nenhuma concretagem selecionada. Por favor, selecione uma concretagem primeiro.');
                return;
            }
            
            // Desabilitar botão durante o processamento
            const btn = $(this);
            const originalHtml = btn.html();
            btn.prop('disabled', true);
            btn.html('<i class="fas fa-spinner fa-spin"></i> Gerando PDF...');
            
            // Redirecionar para a rota de exportação
            window.location.href = `/concretagens/api/${concretagemId}/pecas/exportar-pdf`;
            
            // Reabilitar botão após um tempo (caso haja erro)
            setTimeout(function() {
                btn.prop('disabled', false);
                btn.html(originalHtml);
            }, 5000);
        });
    });
</script>
