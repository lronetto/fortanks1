<!-- Modal de Nova Concretagem -->
<div class="modal fade" id="modalNovaConcretagem" tabindex="-1" aria-labelledby="modalNovaConcretagemLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="formNovaConcretagem" method="POST" action="{{ url_for('concretagem.novo') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNovaConcretagemLabel">Nova Concretagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Primeira linha: Tanques e Data -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="tanque_ids" class="form-label fw-bold">Tanques *</label>
                            <select class="form-select form-control" id="tanque_ids" name="tanque_ids" multiple required>
                                {% for tanque in tanques %}
                                <option value="{{ tanque.id }}">{{tanque.contrato.centro_custo.nome}} - {{ tanque.nome }} ({{ tanque.sistema }})</option>
                                {% endfor %}
                            </select>
                            <small class="form-text text-muted">Segure Ctrl para selecionar múltiplos tanques.</small>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="data_concretagem" class="form-label fw-bold">Data *</label>
                            <input type="date" class="form-control" id="data_concretagem" name="data_concretagem" required>
                            <label for="pista" class="form-label fw-bold">Pista *</label>
                            <select class="form-select form-control" id="pista" name="pista" required>
                                <option value="">Selecione a pista</option>
                                <option value="1">Pista 1</option>
                                <option value="2">Pista 2</option>
                            </select>
                        </div>
                    </div>

                   
                    <!-- Seleção de Peças -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label class="form-label fw-bold">Peças a serem concretadas *</label>
                            <div class="alert alert-info py-2" id="alerta-selecione-tanque">
                                <i class="fas fa-info-circle"></i> Selecione pelo menos um tanque para ver as peças disponíveis.
                            </div>
                            <div id="div-pecas" style="display: none;">
                                <div class="d-flex flex-wrap align-items-center mb-3">
                                    <div class="form-check me-3 mb-2">
                                        <input class="form-check-input" type="checkbox" id="mostrarNaoConcretadas" checked>
                                        <label class="form-check-label" for="mostrarNaoConcretadas">
                                            Apenas peças não concretadas
                                        </label>
                                    </div>
                                    <div class="form-check me-3 mb-2">
                                        <input class="form-check-input" type="checkbox" id="mostrarApenasSelecionadas">
                                        <label class="form-check-label" for="mostrarApenasSelecionadas">
                                            Apenas peças selecionadas
                                        </label>
                                    </div>
                                    <div class="input-group input-group-sm mb-2" style="max-width: 300px;">
                                        <input type="text" id="filtroPecasMobile" class="form-control"
                                            placeholder="Filtrar peças...">
                                    </div>
                                </div>

                                <div class="table-responsive" style="max-height: 350px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 4px;">
                                    <table class="table table-sm table-bordered table-hover" id="tabelaPecas">
                                        <thead class="sticky-top bg-white">
                                            <tr>
                                                <th width="5%" class="align-middle text-center">
                                                    <div class="d-none d-md-block">Sel.</div>
                                                    <div class="d-md-none"><i class="fas fa-check-square"></i></div>
                                                </th>
                                                <th width="30%" class="align-middle">Tanque</th>
                                                <th width="25%" class="align-middle">Tipo</th>
                                                <th width="15%" class="align-middle">Nome</th>
                                                <th width="25%" class="align-middle">Forma</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- As peças serão carregadas via JavaScript -->
                                        </tbody>
                                    </table>
                                </div>

                                <!-- Contador de peças selecionadas -->
                                <div class="mt-2 alert alert-info py-2" id="contadorPecas">
                                    <i class="fas fa-info-circle"></i> Nenhuma peça selecionada
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Concretagem</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% block scripts %}
<script>
// Script para gerenciar a seleção de múltiplos tanques na concretagem

// Função principal para inicializar o módulo
function inicializarMultiTanques() {
    console.log("Inicializando módulo de múltiplos tanques para concretagem");

    // Configurar os selects de tanques para múltipla seleção
    configurarMultiSelect('#tanque_ids');
    configurarMultiSelect('#edit_tanque_ids');

    // Eventos para carregar peças quando os tanques são selecionados
    $('#tanque_ids').change(function() {
        carregarPecasPorTanques();
    });

    $('#edit_tanque_ids').change(function() {
        carregarPecasPorTanques('edit_');
    });

    // Eventos para filtrar peças não concretadas
    $('#mostrarNaoConcretadas').change(function() {
        carregarPecasPorTanques();
    });

    $('#edit_mostrarNaoConcretadas').change(function() {
        carregarPecasPorTanques('edit_');
    });

    // Evento para filtrar peças já associadas (MODAL DE EDIÇÃO)
    $('#edit_mostrarApenasAssociadas').change(function() {
        console.log("(multi-tanques.js) #edit_mostrarApenasAssociadas alterado. Novo estado:", $(this).is(':checked'));
        carregarPecasPorTanques('edit_');
    });

    // Configurar filtros de pesquisa
    $("#filtroPecasMobile").on("keyup", function() {
        const mostrarApenasSelecionadas = $('#mostrarApenasSelecionadas').is(':checked');
        filtrarPecas($(this).val(), "#tabelaPecas");
    });

    $("#edit_filtroPecasMobile").on("keyup", function() {
        const mostrarApenasSelecionadas = $('#edit_mostrarApenasSelecionadas').is(':checked');
        filtrarPecas($(this).val(), "#edit_tabelaPecas");
    });

    // Configurar validação de formulários
    $('#formNovaConcretagem').submit(function(e) {
        return validarFormularioConcretagem(e, '', this);
    });

    $('#formEditarConcretagem').submit(function(e) {
        return validarFormularioConcretagem(e, 'edit_', this);
    });
}

// Função para obter o token CSRF de forma segura
function getCSRFToken() {
    // Tentar obter o token do campo global primeiro
    const tokenGlobal = document.querySelector('#csrf_token_global');
    if (tokenGlobal) {
        console.log('CSRF token obtido do campo global:', tokenGlobal.value);
        return tokenGlobal.value;
    }
    
    // Tentar obter o token de qualquer input de csrf_token na página
    const tokenField = document.querySelector('input[name="csrf_token"]');
    if (tokenField) {
        console.log('CSRF token obtido de input genérico:', tokenField.value);
        return tokenField.value;
    }
    
    // Se não encontrou o token, retornar vazio (será tratado no servidor)
    console.warn('CSRF token não encontrado');
    return '';
}

// Função para obter as peças dos tanques selecionados
function carregarPecasPorTanques(prefixo = '') {
    console.log(`carregarPecasPorTanques chamado de concretagens-multi-tanques.js com prefixo: ${prefixo}`);
    const tanqueIds = $(`#${prefixo}tanque_ids`).val();
    const tabelaPecasElement = $(`#${prefixo}tabelaPecas`); // Referência ao elemento table
    const tabelaPecasTbody = $(`#${prefixo}tabelaPecas tbody`); // Referência ao tbody
    const mostrarNaoConcretadas = $(`#${prefixo}mostrarNaoConcretadas`).is(':checked');
    console.log(`  (multi-tanques.js) Tanque IDs: ${tanqueIds}, Mostrar Não Concretadas: ${mostrarNaoConcretadas}`);

    let mostrarApenasAssociadas = false;
    let pecasAssociadasOriginalmenteIds = []; // Mantenha isso para lógica de filtro

    if (prefixo === 'edit_') {
        mostrarApenasAssociadas = $('#edit_mostrarApenasAssociadas').is(':checked');
        console.log(`  (multi-tanques.js) DENTRO de carregarPecas: Modo Edição - VALOR ATUAL de mostrarApenasAssociadas: ${mostrarApenasAssociadas}`);
        if (window.dadosConcretagemEdicao && window.dadosConcretagemEdicao.pecas) {
            pecasAssociadasOriginalmenteIds = window.dadosConcretagemEdicao.pecas.map(p => p.id);
            console.log("  (multi-tanques.js) Peças Originalmente Associadas IDs:", pecasAssociadasOriginalmenteIds, "Baseado em window.dadosConcretagemEdicao:", window.dadosConcretagemEdicao);
        } else {
            console.warn("  (multi-tanques.js) window.dadosConcretagemEdicao ou suas peças não está definido.");
        }
    }

    const alertaSelecione = $(`#${prefixo === 'edit_' ? 'edit-' : ''}alerta-selecione-tanque`);
    const divPecas = $(`#${prefixo === 'edit_' ? 'edit-' : ''}div-pecas`);
    const contadorPecas = $(`#${prefixo}contadorPecas`);
    
    const csrfToken = getCSRFToken();
    
    // Limpar o tbody e resetar o contador. Destruir DataTable se existir.
    if ($.fn.DataTable.isDataTable(tabelaPecasElement)) {
        console.log(`  (multi-tanques.js) Destruindo DataTable existente para #${prefixo}tabelaPecas.`);
        tabelaPecasElement.DataTable().destroy();
    }
    tabelaPecasTbody.empty(); // Esvaziar o tbody
    contadorPecas.html('<i class="fas fa-info-circle"></i> Carregando peças...');

    if (tanqueIds && tanqueIds.length > 0) {
        divPecas.show();
        alertaSelecione.hide();

        fetch('/concretagens/api/tanques/pecas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ tanque_ids: tanqueIds, nao_concretadas: mostrarNaoConcretadas })
        })
        .then(response => {
            if (!response.ok) throw new Error('Erro ao carregar peças');
            return response.json();
        })
        .then(data => {
            console.log("  (multi-tanques.js) Dados recebidos da API /tanques/pecas:", data);
            let pecasParaExibir = data; 
            console.log("  (multi-tanques.js) Antes do filtro, pecasParaExibir é data (todas da API). Length:", pecasParaExibir.length);

            if (prefixo === 'edit_' && mostrarApenasAssociadas) {
                console.log("  (multi-tanques.js) CONDIÇÃO DE FILTRO ATIVADA (mostrarApenasAssociadas é TRUE). IDs para filtrar:", pecasAssociadasOriginalmenteIds);
                if (pecasAssociadasOriginalmenteIds.length > 0) {
                    pecasParaExibir = data.filter(p_api => pecasAssociadasOriginalmenteIds.includes(p_api.id));
                } else {
                    pecasParaExibir = []; // Se não há peças originalmente associadas, não mostrar nada
                }
                console.log("  (multi-tanques.js) Peças para exibir APÓS filtro 'Apenas Associadas':", pecasParaExibir.length > 0 ? pecasParaExibir : "Array vazio");
            } else if (prefixo === 'edit_' && !mostrarApenasAssociadas) {
                console.log("  (multi-tanques.js) CONDIÇÃO DE FILTRO INATIVA (mostrarApenasAssociadas é FALSE). pecasParaExibir deve permanecer como todas as peças da API.");
                // pecasParaExibir já é 'data'
            }

            if (pecasParaExibir.length > 0) {
                let dtModalOptionsCMT = {
                    data: pecasParaExibir,
                    columns: [
                        { // Coluna 0: Checkbox
                            data: null,
                            orderable: false,
                            className: 'text-center',
                            render: function(data, type, row, meta) {
                                const isPecaOriginalmenteAssociada = prefixo === 'edit_' && window.dadosConcretagemEdicao && window.dadosConcretagemEdicao.pecas && window.dadosConcretagemEdicao.pecas.find(p_original => p_original.id === row.id);
                                const isChecked = isPecaOriginalmenteAssociada ? 'checked' : '';
                                // Se a peça não estava originalmente associada E estamos no modo de filtro "apenas associadas", não deve ser marcada.
                                // (a lógica de filtragem de 'pecasParaExibir' já cuida disso)
                                return `<input type="checkbox" name="peca_ids" value="${row.id}" class="checkbox-peca form-check-input" ${isChecked}>`;
                            }
                        },
                        { data: 'tanque_nome', title: 'Tanque' },
                        { data: 'tipo', title: 'Tipo' },
                        { data: 'nome', title: 'Nome' },
                        { // Coluna 4: Forma (Input)
                            data: null, // Usaremos 'row' para obter dados no render
                            orderable: false,
                            render: function(data, type, row, meta) {
                                const isPecaOriginalmenteAssociada = prefixo === 'edit_' && window.dadosConcretagemEdicao && window.dadosConcretagemEdicao.pecas && window.dadosConcretagemEdicao.pecas.find(p_original => p_original.id === row.id);
                                const formaValue = isPecaOriginalmenteAssociada ? (isPecaOriginalmenteAssociada.forma || '') : '';
                                // O input só é habilitado se a peça estiver marcada (controlado pelo listener do checkbox)
                                // Inicialmente, se a peça estava associada, o input é habilitado.
                                const isDisabled = !isPecaOriginalmenteAssociada;
                                return `<input type="text" name="formas" value="${formaValue}" class="form-control form-control-sm forma-input" ${isDisabled ? 'disabled' : ''}>`;
                            }
                        }
                    ],
                    createdRow: function( tr_element, peca_data, dataIndex ) {
                        // 'tr_element' é o elemento TR do DOM, 'peca_data' é o objeto da peça para esta linha
                        const isPecaOriginalmenteAssociada = prefixo === 'edit_' && window.dadosConcretagemEdicao && window.dadosConcretagemEdicao.pecas && window.dadosConcretagemEdicao.pecas.find(p_original => p_original.id === peca_data.id);
                        
                        if (isPecaOriginalmenteAssociada) {
                            const usinagemValue = isPecaOriginalmenteAssociada.usinagem_id || '';
                            if (usinagemValue) {
                                $(tr_element).find('select.usinagem-select').val(usinagemValue.toString());
                            }
                        }
                        // Se a peça foi marcada via checkbox, os inputs são habilitados pelo listener do checkbox.
                        // Se não está marcada (nem originalmente), os inputs/selects devem estar desabilitados.
                        const checkbox = $(tr_element).find('.checkbox-peca');
                        if (!checkbox.is(':checked')) {
                            $(tr_element).find('.forma-input').prop('disabled', true);
                            $(tr_element).find('.usinagem-select').prop('disabled', true);
                        }

                    },
                    responsive: true,
                    pageLength: 1000,
                    lengthMenu: [5, 15, 25, 50],
                    order: [[3, 'asc']], // Ordenar pela coluna Nome da Peça (índice 3)
                    dom: "<'row'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                         "<'row'<'col-sm-12'tr>>" +
                         "<'row'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
                    columnDefs: [
                        { responsivePriority: 1, targets: [0, 1, 2, 3, 4] }, // Todas as colunas importantes no mobile
                        // 'orderable: false' já está nas definições das colunas de checkbox, forma e usinagem
                    ]
                };

                if (window.dataTablePortugueseTranslation) {
                    dtModalOptionsCMT.language = window.dataTablePortugueseTranslation;
                    console.log("(multi-tanques.js) Usando tradução pt-BR para DataTable do modal (nova abordagem).");
                } else {
                    console.warn("(multi-tanques.js) Tradução pt-BR não disponível para DataTable do modal (nova abordagem).");
                }

                // Não precisa mais do setTimeout aqui, DataTables lida com os dados diretamente.
                console.log(`  (multi-tanques.js) Inicializando DataTable para #${prefixo}tabelaPecas com ${pecasParaExibir.length} peças via 'data' option.`);
                tabelaPecasElement.DataTable(dtModalOptionsCMT);
                atualizarContadorPecas(prefixo);

            } else {
                // Caso não tenha peças para exibir após os filtros ou da API
                tabelaPecasTbody.empty(); // Garantir que esteja vazio
                 if ($.fn.DataTable.isDataTable(tabelaPecasElement)) {
                    // Não há necessidade de destruir novamente se já foi feito, mas não custa
                     tabelaPecasElement.DataTable().clear().draw(); // Limpa os dados e redesenha, mostrando msg de tabela vazia
                 } else {
                    // Se o DataTable não foi inicializado (ex: primeira carga sem tanques)
                    tabelaPecasTbody.append(`
                        <tr>
                            <td colspan="6" class="text-center">
                                Nenhuma peça disponível para os tanques selecionados ${mostrarNaoConcretadas ? 'ou todas já foram concretadas' : ''} ${ (prefixo === 'edit_' && mostrarApenasAssociadas) ? 'ou que corresponda ao filtro de associadas.' : ''}
                            </td>
                        </tr>
                    `);
                 }
                contadorPecas.html('<i class="fas fa-info-circle"></i> Nenhuma peça disponível');
                 atualizarContadorPecas(prefixo); // Para resetar o contador visualmente
            }
        })
        .catch(error => {
            console.error('Erro ao carregar peças:', error);
            tabelaPecasTbody.empty();
            if ($.fn.DataTable.isDataTable(tabelaPecasElement)) {
                 tabelaPecasElement.DataTable().clear().draw();
            }
            tabelaPecasTbody.append(`<tr><td colspan="5" class="text-center">Erro ao carregar peças</td></tr>`);
            contadorPecas.html('<i class="fas fa-exclamation-triangle"></i> Erro ao carregar peças');
        });
    } else {
        divPecas.hide();
        alertaSelecione.show();
        if ($.fn.DataTable.isDataTable(tabelaPecasElement)) {
            tabelaPecasElement.DataTable().clear().draw(); // Limpa a tabela se ela existia
        }
        tabelaPecasTbody.empty(); // Garante que o tbody esteja vazio
        contadorPecas.html('<i class="fas fa-info-circle"></i> Selecione pelo menos um tanque');
         atualizarContadorPecas(prefixo); // Para resetar o contador visualmente
    }
}

// Função para atualizar contador de peças selecionadas
// Esta função agora precisa considerar que as peças são renderizadas pelo DataTables
function atualizarContadorPecas(prefixo = '') {
    // A contagem de checkboxes marcados ainda pode ser feita diretamente no DOM,
    // pois o DataTables apenas os renderiza, mas eles existem no DOM.
    const pecasSelecionadas = $(`#${prefixo}tabelaPecas input[name="peca_ids"]:checked`).length;
    const contadorPecas = $(`#${prefixo}contadorPecas`);
    
    if (pecasSelecionadas === 0) {
        contadorPecas.html('<i class="fas fa-info-circle"></i> Nenhuma peça selecionada');
        contadorPecas.removeClass('alert-success').addClass('alert-info');
    } else {
        contadorPecas.html(`<i class="fas fa-check-circle"></i> ${pecasSelecionadas} peça(s) selecionada(s)`);
        contadorPecas.removeClass('alert-info').addClass('alert-success');
    }
}

// Função para configurar o select de múltipla seleção
function configurarMultiSelect(seletor) {
    // Adicionar classe para estilização
    $(seletor).addClass('multi-select');
    
    // Ajustar altura para melhor visualização
    $(seletor).css('height', 'auto');
    $(seletor).css('min-height', '150px');
}

// Função para filtrar peças na tabela
function filtrarPecas(termo, tabelaSeletor) {
    const table = $(tabelaSeletor).DataTable();
    const mostrarApenasSelecionadas = $('#mostrarApenasSelecionadas').is(':checked');
    
    // Limpar filtros anteriores
    table.search('');
    
    // Aplicar filtro de texto
    if (termo) {
        table.search(termo);
    }
    
    // Aplicar filtro de seleção
    if (mostrarApenasSelecionadas) {
        $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
            const row = table.row(dataIndex).node();
            const checkbox = $(row).find('input[type="checkbox"]');
            return checkbox.is(':checked');
        });
    }
    
    // Redesenhar a tabela
    table.draw();
    
    // Remover o filtro personalizado após o draw
    if (mostrarApenasSelecionadas) {
        $.fn.dataTable.ext.search.pop();
    }
    
    // Atualizar o contador de peças selecionadas
    const prefixo = tabelaSeletor === '#edit_tabelaPecas' ? 'edit_' : '';
    atualizarContadorPecas(prefixo);
}

// Eventos para os checkboxes de filtro
$('#mostrarApenasSelecionadas').change(function() {
    const termo = $('#filtroPecasMobile').val();
    filtrarPecas(termo, '#tabelaPecas');
});

$('#edit_mostrarApenasSelecionadas').change(function() {
    const termo = $('#edit_filtroPecasMobile').val();
    filtrarPecas(termo, '#edit_tabelaPecas');
});

// Evento para o campo de busca
$("#filtroPecasMobile").on("keyup", function() {
    const mostrarApenasSelecionadas = $('#mostrarApenasSelecionadas').is(':checked');
    filtrarPecas($(this).val(), "#tabelaPecas");
});

$("#edit_filtroPecasMobile").on("keyup", function() {
    const mostrarApenasSelecionadas = $('#edit_mostrarApenasSelecionadas').is(':checked');
    filtrarPecas($(this).val(), "#edit_tabelaPecas");
});

// Função para validar formulário de concretagem
function validarFormularioConcretagem(e, prefixo, formulario) {
    const tanqueIds = $(`#${prefixo}tanque_ids`).val();
    const dataConcretagem = $(`#${prefixo}data_concretagem`).val();
    const pista = $(`#${prefixo}pista`).val();
    const pecasSelecionadas = $(`#${prefixo}tabelaPecas input[name="peca_ids"]:checked`).length;

    if (!tanqueIds || tanqueIds.length === 0 || !dataConcretagem || !pista) {
        e.preventDefault();
        alert('Por favor, preencha todos os campos obrigatórios.');
        return false;
    }

    if (pecasSelecionadas === 0) {
        e.preventDefault();
        alert('Selecione pelo menos uma peça para concretagem.');
        return false;
    }

    // Garantir que apenas formas de peças selecionadas sejam enviadas
    $('input.forma-input:disabled').removeAttr('name');
    $('select.usinagem-select:disabled').removeAttr('name');

    return true;
}

// Função para gerar opções de usinagem
function gerarOpcoesUsinagem() {
    // Esta função é um placeholder. O conteúdo real será injetado pelo template
    // ao renderizar a página, utilizando os dados disponíveis em usinagens.
    // É importante que ela retorne apenas as <option> e não o <select> inteiro.
    // Exemplo: return '<option value="1">Usinagem A</option><option value="2">Usinagem B</option>';
    
    // Se usinagensGlobais foi definido no escopo global (index.html)
    if (window.usinagensGlobais && Array.isArray(window.usinagensGlobais)) {
        return window.usinagensGlobais.map(u => `<option value="${u.id}">${u.nome}</option>`).join('');
    }
    console.warn("(multi-tanques.js) window.usinagensGlobais não está definido ou não é um array. O select de usinagem pode ficar vazio.");
    return ''; // Retorna string vazia se não houver usinagens
}

// Carregar dados de concretagem para edição
function carregarDadosConcretagem(concretagemId) {
    // Obter o token CSRF
    const csrfToken = getCSRFToken();
    
    fetch(`/concretagens/api/concretagem/${concretagemId}`, {
        headers: {
            'X-CSRFToken': csrfToken
        }
    })
        .then(response => {
            if (!response.ok) {
                throw new Error('Erro ao carregar dados da concretagem');
            }
            return response.json();
        })
        .then(data => {
            // Preencher o formulário com os dados
            $('#edit_data_concretagem').val(data.data_concretagem);
            $('#edit_pista').val(data.pista);
            $('#edit_observacoes').val(data.observacoes);
            
            // Selecionar os tanques
            const tanqueIds = data.tanques.map(t => t.id.toString());
            $('#edit_tanque_ids').val(tanqueIds);
            
            // Carregar peças dos tanques selecionados
            carregarPecasPorTanques('edit_');
            
            // Quando as peças estiverem carregadas, marcar as que fazem parte da concretagem
            // e preencher seus respectivos campos de forma
            const checkInterval = setInterval(() => {
                const pecasRows = $('#edit_tabelaPecas tbody tr.linha-peca');
                if (pecasRows.length > 0) {
                    clearInterval(checkInterval);
                    
                    // Para cada peça da concretagem, marcar a checkbox e preencher a forma
                    data.pecas.forEach(peca => {
                        const checkbox = $(`#edit_tabelaPecas input[name="peca_ids"][value="${peca.id}"]`);
                        if (checkbox.length) {
                            checkbox.prop('checked', true);
                            
                            const row = checkbox.closest('tr');
                            const formaInput = row.find('.forma-input');
                            const usinagemSelect = row.find('.usinagem-select');
                            
                            formaInput.prop('disabled', false).val(peca.forma || '');
                            usinagemSelect.prop('disabled', false).val(peca.usinagem_id || '');
                        }
                    });
                    
                    // Atualizar o contador de peças
                    atualizarContadorPecas('edit_');
                }
            }, 100);
        })
        .catch(error => {
            console.error('Erro ao carregar dados da concretagem:', error);
            alert('Erro ao carregar dados da concretagem. Tente novamente.');
        });
}

// Inicializar quando o documento estiver pronto
$(document).ready(function() {
    inicializarMultiTanques(); // Esta função já tem a lógica inicial.
    
    // Manter uma referência à instância do modal de edição
    let modalEditarInstancia = null;

    // DELEGAÇÃO DE EVENTOS para checkboxes de peças
    $('#tabelaPecas tbody, #edit_tabelaPecas tbody').on('change', '.checkbox-peca', function() {
        const $checkbox = $(this);
        const $tr = $checkbox.closest('tr');
        const $formaInput = $tr.find('.forma-input');
        const $usinagemSelect = $tr.find('.usinagem-select');
        const isChecked = $checkbox.is(':checked');

        $formaInput.prop('disabled', !isChecked);
        $usinagemSelect.prop('disabled', !isChecked);

        if (!isChecked) {
            $formaInput.val('');
            $usinagemSelect.val('');
        }
        const tabelaId = $tr.closest('table').attr('id');
        const prefixo = tabelaId === 'edit_tabelaPecas' ? 'edit_' : '';
        atualizarContadorPecas(prefixo);
    });
    
    $('.editar-concretagem').click(function(e) {
        e.preventDefault();
        const concretagemId = $(this).data('id');
        const formAction = $(this).attr('href');
        
        $('#formEditarConcretagem').attr('action', formAction);
        
        // carregarDadosConcretagem é assíncrono. O ideal é mostrar o modal
        // e talvez um loader dentro dele, e então popular quando os dados chegarem.
        // Por enquanto, chamamos antes.
        carregarDadosConcretagem(concretagemId);
        
        const modalElement = document.getElementById('modalEditarConcretagem');
        if (modalElement) {
            modalEditarInstancia = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
            console.log("(multi-tanques.js) Mostrando modal de edição.");
            modalEditarInstancia.show();
        } else {
            console.error("(multi-tanques.js) Elemento do modal #modalEditarConcretagem não encontrado!");
        }
    });

    // Listeners para eventos do modal de edição para debug
    const modalEditarElement = document.getElementById('modalEditarConcretagem');
    if (modalEditarElement) {
        modalEditarElement.addEventListener('show.bs.modal', function (event) {
            console.log('(multi-tanques.js) Evento: show.bs.modal (Modal de edição está sendo mostrado)');
        });
        modalEditarElement.addEventListener('shown.bs.modal', function (event) {
            console.log('(multi-tanques.js) Evento: shown.bs.modal (Modal de edição FOI mostrado)');
        });
        modalEditarElement.addEventListener('hide.bs.modal', function (event) {
            console.log('(multi-tanques.js) Evento: hide.bs.modal (Modal de edição está sendo escondido)');
        });
        modalEditarElement.addEventListener('hidden.bs.modal', function (event) {
            console.log('(multi-tanques.js) Evento: hidden.bs.modal (Modal de edição FOI escondido)');
            if ($('.modal-backdrop').length) {
                console.warn('(multi-tanques.js) ALERTA: .modal-backdrop AINDA PRESENTE após o evento hidden.bs.modal!');
                // Forçar a remoção do backdrop e restaurar o estado do body
                $('.modal-backdrop').remove();
                $('body').removeClass('modal-open').css('overflow', '').css('padding-right', '');
                console.log('(multi-tanques.js) Remoção forçada do .modal-backdrop e restauração do body aplicadas.');
            } else {
                console.log('(multi-tanques.js) .modal-backdrop não encontrado após hidden.bs.modal (comportamento esperado).');
            }
        });
    }
}); 
</script>
