<!-- Modal de Nova Concretagem -->
<div class="modal fade" id="modalNovaConcretagem" tabindex="-1" aria-labelledby="modalNovaConcretagemLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formNovaConcretagem">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNovaConcretagemLabel">Nova Concretagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="data_concretagem" class="form-label fw-bold">Data *</label>
                        <input type="date" class="form-control" id="data_concretagem" name="data_concretagem" required>
                    </div>
                    <div class="mb-3">
                        <label for="pista" class="form-label fw-bold">Pista *</label>
                        <select class="form-select" id="pista" name="pista" required>
                            <option value="">Selecione a pista</option>
                            <option value="001">001</option>
                            <option value="002">002</option>
                            <option value="001-PF">001-PF</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        // Definir data de hoje como padrão
        $('#data_concretagem').val(new Date().toISOString().split('T')[0]);

        $('#formNovaConcretagem').on('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                csrf_token: $('#csrf_token_global').val(),
                data_concretagem: $('#data_concretagem').val(),
                pista: $('#pista').val()
            };

            $.ajax({
                url: '/concretagens/api/novo',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    'X-CSRFToken': $('#csrf_token_global').val()
                },
                data: JSON.stringify(formData),
                success: function(response) {
                    if (response.success) {
                        $('#modalNovaConcretagem').modal('hide');
                        $('#tabelaConcretagens').DataTable().ajax.reload();
                        alert('Concretagem cadastrada com sucesso!');
                    } else {
                        alert('Erro: ' + (response.message || 'Erro ao cadastrar concretagem'));
                    }
                },
                error: function() {
                    alert('Erro ao cadastrar concretagem. Tente novamente.');
                }
            });
        });
    });
</script>
