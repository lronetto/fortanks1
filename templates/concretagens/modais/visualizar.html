<!-- Modal Visualizar Concretagem -->
<div class="modal fade" id="modalVisualizarConcretagem" tabindex="-1" aria-labelledby="modalVisualizarConcretagemLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalVisualizarConcretagemLabel">
          <i class="fas fa-cubes"></i> Visualizar Concretagem <span id="visualizar-concretagem-id"></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <div id="visualizar-concretagem-loading" class="text-center my-4">
          <i class="fas fa-spinner fa-spin fa-2x"></i> Carregando dados...
        </div>
        <div id="visualizar-concretagem-conteudo" style="display:none;">
          <!-- Conteúdo será preenchido via JS -->
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>
