<!-- Modal de Alongamentos -->
<div class="modal fade" id="modalAlongamentos" tabindex="-1" aria-labelledby="modalAlongamentosLabel" aria-hidden="true">

        <div class="modal-content">

                <input type="hidden" id="concretagem_id_alongamentos" name="concretagem_id">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalAlongamentosLabel">Cadastrar Alongamentos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <div class="row g-2 mb-1 text-center">
                            <div class="col-1 small fw-bold">C-1</div>
                            <div class="col-1 small fw-bold">C-2</div>
                            <div class="col-1 small fw-bold">C-3</div>
                            <div class="col-1 small fw-bold">C-4</div>
                            <div class="col-1 small fw-bold">C-5</div>
                            <div class="col-1 small fw-bold">C-6</div>
                            <div class="col-1 small fw-bold">C-7</div>
                            <div class="col-1 small fw-bold">C-8</div>
                            <div class="col-1 small fw-bold">C-9</div>
                            <div class="col-1 small fw-bold">C-10</div>
                            <div class="col-1 small fw-bold">C-11</div>
                            <div class="col-1 small fw-bold">C-12</div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="1"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="2"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="3"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="4"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="5"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="6"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="7"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="8"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="9"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="10"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="11"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="1" data-pos="12"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="row g-2 mb-1 text-center">
                            <div class="col-1 small fw-bold">C-13</div>
                            <div class="col-1 small fw-bold">C-14</div>
                            <div class="col-1 small fw-bold">C-15</div>
                            <div class="col-1 small fw-bold">C-16</div>
                            <div class="col-1 small fw-bold">C-17</div>
                            <div class="col-1 small fw-bold">C-18</div>
                            <div class="col-1 small fw-bold">C-19</div>
                            <div class="col-1 small fw-bold">C-20</div>
                            <div class="col-1 small fw-bold">C-21</div>
                            <div class="col-1 small fw-bold">C-22</div>
                            <div class="col-1 small fw-bold">C-23</div>
                            <div class="col-1 small fw-bold">C-24</div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="1"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="2"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="3"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="4"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="5"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="6"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="7"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="8"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="9"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="10"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="11"></div>
                            <div class="col-1"><input type="number" class="form-control form-control-sm alongamento-input" data-linha="2" data-pos="12"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <h6>Tabela de Cordoalhas</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered" id="tabelaCordoalhas">
                                <thead>
                                    <tr>
                                        <th>Número</th>
                                        <th>Data Fabricação</th>
                                        <th>Certificado</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Linhas serão adicionadas dinamicamente -->
                                </tbody>
                            </table>
                        </div>
                        <button type="button" class="btn btn-sm btn-primary mt-2" id="btnAdicionarCordoalha">
                            <i class="fas fa-plus"></i> Adicionar Cordoalha
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        let contadorCordoalhas = 0;

        // Adicionar nova linha de cordoalha
        $('#btnAdicionarCordoalha').on('click', function() {
            contadorCordoalhas++;
            const linha = `
                <tr data-index="${contadorCordoalhas}">
                    <td><input type="number" class="form-control form-control-sm cordoalha-numero" placeholder="Número"></td>
                    <td><input type="date" class="form-control form-control-sm cordoalha-data" placeholder="Data"></td>
                    <td><input type="number" class="form-control form-control-sm cordoalha-certificado" placeholder="Certificado"></td>
                    <td>
                        <button type="button" class="btn btn-sm btn-danger btn-remover-cordoalha">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            $('#tabelaCordoalhas tbody').append(linha);
        });

        // Remover linha de cordoalha
        $(document).on('click', '.btn-remover-cordoalha', function() {
            $(this).closest('tr').remove();
        });

        // Salvar alongamentos
        $('#formAlongamentos').on('submit', function(e) {
            e.preventDefault();
            
            const concretagemId = $('#concretagem_id_alongamentos').val();
            
            // Coletar alongamentos das duas linhas
            const alongamentos = {};
            $('.alongamento-input').each(function() {
                const linha = $(this).data('linha');
                const pos = $(this).data('pos');
                const valor = $(this).val();
                if (valor) {
                    // Calcular número do cabo: linha 1 = 1-12, linha 2 = 13-24
                    const numeroCabo = (linha - 1) * 12 + pos;
                    alongamentos[`C-${numeroCabo}`] = parseFloat(valor);
                }
            });

            // Coletar bobinas
            const bobinas = [];
            $('#tabelaCordoalhas tbody tr').each(function() {
                const numero = $(this).find('.cordoalha-numero').val();
                const data = $(this).find('.cordoalha-data').val();
                const certificado = $(this).find('.cordoalha-certificado').val();
                
                if (numero || data || certificado) {
                    const dataFormatada = data ? new Date(data).toLocaleDateString('pt-BR') : '';
                    bobinas.push({
                        numero: numero ? parseInt(numero) : null,
                        data_fabricacao: dataFormatada,
                        certificado: certificado ? parseInt(certificado) : null
                    });
                }
            });

            const dados = {
                csrf_token: $('#csrf_token_global').val(),
                cordoalhas: JSON.stringify({
                    alongamentos: alongamentos,
                    bobinas: bobinas
                })
            };

            $.ajax({
                url: `/concretagens/api/${concretagemId}/alongamentos`,
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    'X-CSRFToken': $('#csrf_token_global').val()
                },
                data: JSON.stringify(dados),
                success: function(response) {
                    if (response.success) {
                        $('#modalAlongamentos').modal('hide');
                        alert('Alongamentos salvos com sucesso!');
                    } else {
                        alert('Erro: ' + (response.message || 'Erro ao salvar alongamentos'));
                    }
                },
                error: function() {
                    alert('Erro ao salvar alongamentos. Tente novamente.');
                }
            });
        });
    });

    function carregarDadosAlongamentos(id) {
        $('#concretagem_id_alongamentos').val(id);
        
        $.get(`/concretagens/api/${id}`, function(data) {
            if (data.cordoalhas) {
                try {
                    const cordoalhas = JSON.parse(data.cordoalhas);
                    
                    // Preencher alongamentos
                    if (cordoalhas.alongamentos) {
                        Object.entries(cordoalhas.alongamentos).forEach(([key, value]) => {
                            const match = key.match(/C-(\d+)/);
                            if (match) {
                                const num = parseInt(match[1]);
                                const linha = Math.ceil(num / 12);
                                const pos = ((num - 1) % 12) + 1;
                                $(`.alongamento-input[data-linha="${linha}"][data-pos="${pos}"]`).val(value);
                            }
                        });
                    }
                    
                    // Preencher bobinas
                    if (cordoalhas.bobinas) {
                        $('#tabelaCordoalhas tbody').empty();
                        cordoalhas.bobinas.forEach(function(bobina) {
                            const dataFormatada = bobina.data_fabricacao ? 
                                bobina.data_fabricacao.split('/').reverse().join('-') : '';
                            const linha = `
                                <tr>
                                    <td><input type="number" class="form-control form-control-sm cordoalha-numero" value="${bobina.numero || ''}"></td>
                                    <td><input type="date" class="form-control form-control-sm cordoalha-data" value="${dataFormatada}"></td>
                                    <td><input type="number" class="form-control form-control-sm cordoalha-certificado" value="${bobina.certificado || ''}"></td>
                                    <td>
                                        <button type="button" class="btn btn-sm btn-danger btn-remover-cordoalha">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            `;
                            $('#tabelaCordoalhas tbody').append(linha);
                        });
                    }
                } catch (e) {
                    console.error('Erro ao parsear cordoalhas:', e);
                }
            }
        });
    }

    // Expor função globalmente
    window.carregarDadosAlongamentos = carregarDadosAlongamentos;
</script>
