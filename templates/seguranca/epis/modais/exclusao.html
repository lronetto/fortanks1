<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Confirmar Exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja excluir o EPI <strong id="epi_nome"></strong>?</p>
                <p class="text-danger mb-0">Esta ação não pode ser desfeita.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form action="" method="post" id="form_excluir_epi" class="d-inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                    <button type="submit" class="btn btn-danger">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var deleteModalEl = document.getElementById('deleteModal');
    if (!deleteModalEl) return;
    var deleteModal = bootstrap.Modal.getOrCreateInstance(deleteModalEl);
    var formExcluir = document.getElementById('form_excluir_epi');

    $(document).on('click', '.btn-excluir-epi', function (e) {
        e.preventDefault();
        var epiId = this.getAttribute('data-epi-id');
        if (!epiId) return;
        fetch('/seguranca/epis/excluir/' + epiId, {
            method: 'GET',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.success) {
                    document.getElementById('epi_nome').textContent = data.epi_nome;
                    formExcluir.action = '/seguranca/epis/excluir/' + data.epi_id;
                    deleteModal.show();
                }
            })
            .catch(function () {
                alert('Não foi possível carregar os dados para exclusão.');
            });
    });

    if (formExcluir) {
        formExcluir.addEventListener('submit', function (e) {
            e.preventDefault();
            var epiId = formExcluir.action.split('/').pop();
            var formData = new FormData(formExcluir);
            fetch('/seguranca/epis/excluir/' + epiId, {
                method: 'POST',
                body: formData,
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var alertsDiv = document.querySelector('.alert-container');
                    if (alertsDiv) {
                        var alert = document.createElement('div');
                        alert.className = 'alert alert-' + (data.success ? 'success' : 'danger') + ' alert-dismissible fade show';
                        alert.innerHTML = (data.message || '') + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
                        alertsDiv.appendChild(alert);
                    }
                    if (data.success) {
                        deleteModal.hide();
                        if (typeof window.reloadEpisDatatable === 'function') window.reloadEpisDatatable();
                        if (typeof window.refreshEpisResumo === 'function') window.refreshEpisResumo();
                    }
                })
                .catch(function () {
                    alert('Erro ao excluir EPI. Tente novamente.');
                });
        });
    }
});
</script>
