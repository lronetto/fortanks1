{# Edição completa de manutenção (modal) #}
<form id="form_editar_manutencao_eq" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <span class="text-muted small">Equipamento</span>
        <p class="fw-semibold mb-0">{{ equipamento.nome }}</p>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="man_ed_tipo" class="form-label">Tipo *</label>
            <select class="form-select" id="man_ed_tipo" name="tipo" required>
                <option value="">Selecione...</option>
                {% if manutencao.tipo and manutencao.tipo not in ['Preventiva', 'Corretiva'] %}
                <option value="{{ manutencao.tipo }}" selected>{{ manutencao.tipo }} (atual)</option>
                {% endif %}
                <option value="Preventiva" {% if manutencao.tipo == 'Preventiva' %}selected{% endif %}>Preventiva</option>
                <option value="Corretiva" {% if manutencao.tipo == 'Corretiva' %}selected{% endif %}>Corretiva</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="man_ed_status" class="form-label">Status *</label>
            <select class="form-select" id="man_ed_status" name="status" required>
                <option value="">Selecione...</option>
                {% if manutencao.status and manutencao.status not in ['Pendente', 'Em Andamento', 'Concluída'] %}
                <option value="{{ manutencao.status }}" selected>{{ manutencao.status }} (atual)</option>
                {% endif %}
                <option value="Pendente" {% if manutencao.status == 'Pendente' %}selected{% endif %}>Pendente</option>
                <option value="Em Andamento" {% if manutencao.status == 'Em Andamento' %}selected{% endif %}>Em Andamento</option>
                <option value="Concluída" {% if manutencao.status == 'Concluída' %}selected{% endif %}>Concluída</option>
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="man_ed_data_inicio" class="form-label">Início *</label>
            <input type="datetime-local" class="form-control" id="man_ed_data_inicio" name="data_inicio"
                   value="{{ manutencao.data_inicio.strftime('%Y-%m-%dT%H:%M') }}" required>
        </div>
        <div class="col-md-6">
            <label for="man_ed_data_fim" class="form-label">Conclusão</label>
            <input type="datetime-local" class="form-control" id="man_ed_data_fim" name="data_fim"
                   value="{{ manutencao.data_fim.strftime('%Y-%m-%dT%H:%M') if manutencao.data_fim else '' }}">
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="man_ed_responsavel" class="form-label">Responsável *</label>
            <input type="text" class="form-control" id="man_ed_responsavel" name="responsavel" value="{{ manutencao.responsavel or '' }}" required>
        </div>
        <div class="col-md-6">
            <label for="man_ed_custo" class="form-label">Custo (R$)</label>
            <input type="number" class="form-control" id="man_ed_custo" name="custo" step="0.01" min="0"
                   value="{% if manutencao.custo is not none %}{{ '%.2f'|format(manutencao.custo) }}{% endif %}">
        </div>
    </div>
    <div class="mb-3">
        <label for="man_ed_nota_fiscal_id" class="form-label">Nota fiscal (opcional)</label>
        <select class="form-select" id="man_ed_nota_fiscal_id" name="nota_fiscal_id">
            <option value="">Nenhuma</option>
            {% for nf in notas %}
            <option value="{{ nf.id }}"{% if manutencao.nota_fiscal_id == nf.id %} selected{% endif %}>
                NF {{ nf.numero_nf }} · {{ nf.data_emissao.strftime('%d/%m/%Y') }} · R$ {{ nf.valor_total }} · {{ (nf.nome_emitente or '')[:45] }}{% if nf.nome_emitente and nf.nome_emitente|length > 45 %}…{% endif %}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="man_ed_descricao" class="form-label">Descrição *</label>
        <textarea class="form-control" id="man_ed_descricao" name="descricao" rows="3" required>{{ manutencao.descricao or '' }}</textarea>
    </div>
    <div class="mb-3">
        <label for="man_ed_observacoes" class="form-label">Observações</label>
        <textarea class="form-control" id="man_ed_observacoes" name="observacoes" rows="2">{{ manutencao.observacoes or '' }}</textarea>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="man_ed_btn_submit">
            <i class="fas fa-save me-1"></i>Salvar
        </button>
    </div>
</form>
