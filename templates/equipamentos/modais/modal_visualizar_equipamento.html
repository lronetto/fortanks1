<div class="modal fade" id="visualizarEquipamentoModal" tabindex="-1" aria-labelledby="visualizarEquipamentoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="visualizarEquipamentoModalLabel">Visualizar equipamento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div id="vis_eq_loading" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando...</span></div>
                </div>
                <div id="vis_eq_body" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    document.addEventListener('DOMContentLoaded', function () {
        var modalEl = document.getElementById('visualizarEquipamentoModal');
        if (!modalEl) return;
        var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        var loading = document.getElementById('vis_eq_loading');
        var body = document.getElementById('vis_eq_body');
        var titleEl = document.getElementById('visualizarEquipamentoModalLabel');
        var tpl = "{{ url_for('equipamento.modal_visualizar_equipamento', id=999001) }}";

        function urlModal(id) {
            return tpl.split('999001').join(String(id));
        }

        function carregar(id) {
            if (!loading || !body) return;
            loading.style.display = 'block';
            body.style.display = 'none';
            body.innerHTML = '';
            fetch(urlModal(id), { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(function (r) {
                    if (!r.ok) throw new Error();
                    return r.text();
                })
                .then(function (html) {
                    body.innerHTML = html;
                    loading.style.display = 'none';
                    body.style.display = 'block';
                    var meta = body.querySelector('#vis_eq_meta');
                    var nome = meta ? meta.getAttribute('data-equip-nome') : '';
                    if (titleEl) titleEl.textContent = nome ? nome : ('Equipamento #' + id);
                })
                .catch(function () {
                    loading.style.display = 'none';
                    body.innerHTML = '<p class="text-danger mb-0">Não foi possível carregar os dados.</p>';
                    body.style.display = 'block';
                });
        }

        window.recarregarModalVisualizarEquipamento = function (equipId) {
            if (equipId) {
                carregar(equipId);
            }
        };

        var tplExcluirChk = "{{ url_for('equipamento.excluir_checklist_equipamento', id=999001, checklist_id=999002) }}";
        function urlExcluirChecklist(eqId, checklistId) {
            return tplExcluirChk.replace('999001', String(eqId)).replace('999002', String(checklistId));
        }

        document.addEventListener('click', function (e) {
            var btn = e.target.closest('.btn-excluir-checklist-equipamento-viz');
            if (!btn) return;
            e.preventDefault();
            var equipId = btn.getAttribute('data-equipamento-id');
            var checklistId = btn.getAttribute('data-checklist-id');
            if (!equipId || !checklistId) return;
            if (!window.confirm('Excluir este registro de checklist? Esta ação não pode ser desfeita.')) return;
            var metaCsrf = document.querySelector('meta[name="csrf-token"]');
            var csrf = metaCsrf ? metaCsrf.getAttribute('content') : '';
            var fd = new FormData();
            fd.append('csrf_token', csrf);
            fetch(urlExcluirChecklist(equipId, checklistId), {
                method: 'POST',
                body: fd,
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
            })
                .then(function (r) {
                    return r.json().then(function (data) {
                        return { ok: r.ok, data: data };
                    }).catch(function () {
                        return { ok: false, data: { message: 'Resposta inválida do servidor.' } };
                    });
                })
                .then(function (out) {
                    if (out.ok && out.data.success) {
                        var alertsDiv = document.querySelector('.alert-container');
                        if (alertsDiv) {
                            var alert = document.createElement('div');
                            alert.className = 'alert alert-success alert-dismissible fade show';
                            alert.innerHTML = (out.data.message || 'Checklist excluído.') +
                                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
                            alertsDiv.appendChild(alert);
                        }
                        window.recarregarModalVisualizarEquipamento(equipId);
                        if (typeof window.reloadEquipamentosDatatable === 'function') {
                            window.reloadEquipamentosDatatable();
                        }
                    } else {
                        window.alert((out.data && out.data.message) ? out.data.message : 'Erro ao excluir checklist.');
                    }
                })
                .catch(function () {
                    window.alert('Erro de rede ao excluir checklist.');
                });
        });

        $(document).on('click', '.btn-visualizar-equipamento', function () {
            var id = this.getAttribute('data-id');
            if (!id) return;
            carregar(id);
            modal.show();
        });

        modalEl.addEventListener('hidden.bs.modal', function () {
            if (body) body.innerHTML = '';
        });
    });
})();
</script>
