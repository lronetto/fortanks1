<div class="modal fade" id="excluirManutencaoEquipModal" tabindex="-1" aria-labelledby="excluirManutencaoEquipModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="excluirManutencaoEquipModalLabel">Excluir manutenção</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">Excluir o registro abaixo?</p>
                <p class="fw-semibold mb-0" id="excluir_man_resumo"></p>
                <p class="text-danger small mb-0 mt-2">Esta ação não pode ser desfeita.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="excluir_man_btn_confirm">
                    <i class="fas fa-trash me-1"></i>Excluir
                </button>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    document.addEventListener('DOMContentLoaded', function () {
        var modalEl = document.getElementById('excluirManutencaoEquipModal');
        if (!modalEl) return;
        var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        var resumoEl = document.getElementById('excluir_man_resumo');
        var btnConfirm = document.getElementById('excluir_man_btn_confirm');
        var tplPost = "{{ url_for('equipamento.excluir_manutencao', id=9000001, manutencao_id=9000002) }}";
        var csrf = "{{ csrf_token() }}";
        var equipIdExcluir = null;
        var manIdExcluir = null;

        function urlExcluir(eid, mid) {
            return tplPost.replace('9000001', String(eid)).replace('9000002', String(mid));
        }

        $(document).on('click', '.btn-excluir-manutencao-eq', function (e) {
            e.preventDefault();
            e.stopPropagation();
            equipIdExcluir = this.getAttribute('data-equipamento-id');
            manIdExcluir = this.getAttribute('data-manutencao-id');
            var resumo = this.getAttribute('data-resumo') || ('Manutenção #' + manIdExcluir);
            if (!equipIdExcluir || !manIdExcluir) return;
            if (resumoEl) resumoEl.textContent = resumo;
            modal.show();
        });

        if (btnConfirm) {
            btnConfirm.addEventListener('click', function () {
                if (!equipIdExcluir || !manIdExcluir) return;
                btnConfirm.disabled = true;
                var fd = new FormData();
                fd.append('csrf_token', csrf);
                fetch(urlExcluir(equipIdExcluir, manIdExcluir), {
                    method: 'POST',
                    body: fd,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                    .then(function (r) {
                        return r.json().then(function (j) {
                            return { ok: r.ok, data: j };
                        }).catch(function () {
                            return { ok: false, data: { success: false, message: 'Resposta inválida do servidor.' } };
                        });
                    })
                    .then(function (out) {
                        var data = out.data;
                        var alertsDiv = document.querySelector('.alert-container');
                        if (alertsDiv && data.message) {
                            var alert = document.createElement('div');
                            alert.className = 'alert alert-' + (data.success ? 'success' : 'danger') + ' alert-dismissible fade show';
                            alert.innerHTML = data.message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
                            alertsDiv.appendChild(alert);
                        }
                        if (data.success) {
                            modal.hide();
                            if (typeof window.reloadEquipamentosDatatable === 'function') {
                                window.reloadEquipamentosDatatable();
                            }
                            if (typeof window.recarregarModalManutencoesEquipamento === 'function') {
                                window.recarregarModalManutencoesEquipamento();
                            }
                        } else if (data.message) {
                            alert(data.message);
                        }
                    })
                    .catch(function () {
                        alert('Erro ao excluir manutenção.');
                    })
                    .finally(function () {
                        btnConfirm.disabled = false;
                    });
            });
        }

        modalEl.addEventListener('hidden.bs.modal', function () {
            equipIdExcluir = null;
            manIdExcluir = null;
        });
    });
})();
</script>
