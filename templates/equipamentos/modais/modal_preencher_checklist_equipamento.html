<div class="modal fade" id="preencherChecklistEquipModal" tabindex="-1" aria-labelledby="preencherChecklistEquipModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="preencherChecklistEquipModalLabel">Preencher checklist</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div id="preencher_chk_loading" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando...</span></div>
                </div>
                <div id="preencher_chk_body" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    document.addEventListener('DOMContentLoaded', function () {
        var modalEl = document.getElementById('preencherChecklistEquipModal');
        if (!modalEl) return;
        var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        var loading = document.getElementById('preencher_chk_loading');
        var body = document.getElementById('preencher_chk_body');
        var titleEl = document.getElementById('preencherChecklistEquipModalLabel');
        var tplGet = "{{ url_for('equipamento.preencher_checklist', id=9000001, checklist_id=9000002) }}";

        function urlPreencher(equipId, checklistId) {
            return tplGet
                .replace('9000001', String(equipId))
                .replace('9000002', String(checklistId));
        }

        function carregar(equipId, checklistId) {
            if (!loading || !body) return;
            loading.style.display = 'block';
            body.style.display = 'none';
            body.innerHTML = '';
            if (titleEl) titleEl.textContent = 'Preencher checklist';
            fetch(urlPreencher(equipId, checklistId), {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(function (r) {
                    if (!r.ok) throw new Error();
                    return r.text();
                })
                .then(function (html) {
                    body.innerHTML = html;
                    loading.style.display = 'none';
                    body.style.display = 'block';
                })
                .catch(function () {
                    loading.style.display = 'none';
                    body.innerHTML = '<p class="text-danger mb-0">Não foi possível carregar o formulário.</p>';
                    body.style.display = 'block';
                });
        }

        window.abrirModalPreencherChecklist = function (equipId, checklistId) {
            if (!equipId || !checklistId) return;
            carregar(equipId, checklistId);
            modal.show();
        };

        $(document).on('click', '.btn-preencher-checklist', function (e) {
            e.preventDefault();
            var equipId = this.getAttribute('data-equipamento-id');
            var checklistId = this.getAttribute('data-checklist-id');
            window.abrirModalPreencherChecklist(equipId, checklistId);
        });

        $(document).on('submit', '#preencher_chk_form', function (e) {
            e.preventDefault();
            var form = this;
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }
            var postUrl = form.getAttribute('data-post-url');
            if (!postUrl) return;
            var btn = document.getElementById('preencher_chk_btn_submit');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Salvando...';
            }
            var fd = new FormData(form);
            fetch(postUrl, {
                method: 'POST',
                body: fd,
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.success) {
                        modal.hide();
                        if (typeof window.onPreencherChecklistSucesso === 'function') {
                            window.onPreencherChecklistSucesso(data);
                        } else {
                            window.location.reload();
                        }
                        return;
                    }
                    alert(data.message || 'Não foi possível salvar o checklist.');
                })
                .catch(function () {
                    alert('Erro de rede ao salvar o checklist.');
                })
                .finally(function () {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-save me-1"></i>Salvar e concluir';
                    }
                });
        });

        modalEl.addEventListener('hidden.bs.modal', function () {
            if (body) body.innerHTML = '';
            if (loading) loading.style.display = 'block';
            var f = document.getElementById('preencher_chk_form');
            if (f) f.classList.remove('was-validated');
        });

        var params = new URLSearchParams(window.location.search);
        var abrirId = params.get('preencher_checklist');
        if (abrirId && /^[0-9]+$/.test(abrirId)) {
            var rootEv = document.querySelector('[data-equipamento-visualizar-id]');
            var equipFromPage = rootEv ? rootEv.getAttribute('data-equipamento-visualizar-id') : null;
            if (equipFromPage) {
                window.abrirModalPreencherChecklist(equipFromPage, abrirId);
                params.delete('preencher_checklist');
                var clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash;
                window.history.replaceState({}, '', clean);
            }
        }
    });
})();
</script>
