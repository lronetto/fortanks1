<!-- Modal de Novo Contrato -->
<div class="modal fade" id="modalNovoContrato" tabindex="-1" aria-labelledby="modalNovoContratoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalNovoContratoLabel">
                    <i class="fas fa-plus-circle"></i> Novo Contrato
                </h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form method="POST" action="{{ url_for('contrato.novo') }}" id="form-novo-contrato">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label for="novo_nome" class="form-label">Nome do Contrato <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="novo_nome" name="nome" required>
                        </div>
                        <div class="col-md-4">
                            <label for="novo_centro_custo_id" class="form-label">Centro de Custo <span class="text-danger">*</span></label>
                            <select class="form-select" id="novo_centro_custo_id" name="centro_custo_id" required>
                                <option value="" selected disabled>Selecione um centro de custo</option>
                                {% for centro in centros_custo %}
                                <option value="{{ centro.id }}">{{ centro.codigo }} - {{ centro.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="novo_descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="novo_descricao" name="descricao" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="novo_cliente_direto_id" class="form-label">Cliente Direto</label>
                            <select class="form-select" id="novo_cliente_direto_id" name="cliente_direto_id">
                                <option value="">Selecione um cliente</option>
                                {% for cliente in clientes %}
                                <option value="{{ cliente.id }}">{{ cliente.nome }} ({{ cliente.cnpj }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="novo_cliente_final_id" class="form-label">Cliente Final</label>
                            <select class="form-select" id="novo_cliente_final_id" name="cliente_final_id">
                                <option value="">Selecione um cliente</option>
                                {% for cliente in clientes %}
                                <option value="{{ cliente.id }}">{{ cliente.nome }} ({{ cliente.cnpj }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="novo_estado" class="form-label">Estado</label>
                            <select class="form-select" id="novo_estado" name="estado">
                                <option value="" selected>Selecione um estado</option>
                                <option value="AC">Acre</option>
                                <option value="AL">Alagoas</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="BA">Bahia</option>
                                <option value="CE">Ceará</option>
                                <option value="DF">Distrito Federal</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="GO">Goiás</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PA">Pará</option>
                                <option value="PB">Paraíba</option>
                                <option value="PR">Paraná</option>
                                <option value="PE">Pernambuco</option>
                                <option value="PI">Piauí</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="RN">Rio Grande do Norte</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="SP">São Paulo</option>
                                <option value="SE">Sergipe</option>
                                <option value="TO">Tocantins</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="novo_cidade" class="form-label">Cidade</label>
                            <input type="text" class="form-control" id="novo_cidade" name="cidade">
                        </div>
                        <div class="col-md-5">
                            <label for="novo_data_base" class="form-label">Data Base</label>
                            <input type="date" class="form-control" id="novo_data_base" name="data_base">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="novo_venda_material" class="form-label">Valor Materiais (R$)</label>
                            <input type="text" class="form-control mascara-moeda" id="novo_venda_material" name="venda_material">
                        </div>
                        <div class="col-md-6">
                            <label for="novo_venda_servico" class="form-label">Valor Serviços (R$)</label>
                            <input type="text" class="form-control mascara-moeda" id="novo_venda_servico" name="venda_servico">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="novo_cnpjs_associados" class="form-label">CNPJs Associados</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="novo_cnpj_input" placeholder="Digite o CNPJ e pressione Enter ou clique em Adicionar">
                                <button type="button" class="btn btn-outline-secondary" id="novo_btn_adicionar_cnpj">
                                    <i class="fas fa-plus"></i> Adicionar
                                </button>
                            </div>
                            <small class="form-text text-muted">Adicione múltiplos CNPJs associados ao contrato</small>
                            <div id="novo_cnpjs_lista" class="mt-2">
                                <!-- CNPJs serão adicionados aqui como tags -->
                            </div>
                            <input type="hidden" id="novo_cnpjs_json" name="cnpjs_associados" value="">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="alert alert-info mb-0">
                                <i class="fas fa-info-circle me-2"></i>
                                <strong>Valor Total do Contrato:</strong>
                                <span id="novo_valor_total" class="ms-2">R$ 0,00</span>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Formatar valores monetários
    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Converter valor formatado em número
    function converterParaNumero(valorFormatado) {
        if (!valorFormatado) return 0;
        return parseFloat(valorFormatado.replace('R$', '')
            .replace(/\./g, '')
            .replace(/,/g, '.')
            .trim());
    }

    // Calcular valor total
    function calcularTotalNovo() {
        const valorMaterial = converterParaNumero(document.getElementById('novo_venda_material').value);
        const valorServico = converterParaNumero(document.getElementById('novo_venda_servico').value);
        const total = valorMaterial + valorServico;
        document.getElementById('novo_valor_total').textContent = formatarMoeda(total);
    }

    // Inicializar máscaras para valores monetários
    if (typeof $.fn.maskMoney !== 'undefined') {
        $('#novo_venda_material, #novo_venda_servico').maskMoney({
            prefix: 'R$ ',
            allowNegative: false,
            thousands: '.',
            decimal: ',',
            affixesStay: true
        });

        // Recalcular total quando os valores são alterados
        $('#novo_venda_material, #novo_venda_servico').on('keyup', calcularTotalNovo);
    }

    // Array para armazenar CNPJs
    let cnpjsAssociadosNovo = [];

    // Função para validar CNPJ
    function validarCNPJNovo(cnpj) {
        // Remove caracteres não numéricos
        cnpj = cnpj.replace(/[^\d]/g, '');
        // Verifica se tem 14 dígitos
        return cnpj.length === 14;
    }

    // Função para formatar CNPJ
    function formatarCNPJNovo(cnpj) {
        cnpj = cnpj.replace(/[^\d]/g, '');
        if (cnpj.length === 14) {
            return cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
        }
        return cnpj;
    }

    // Função para adicionar CNPJ à lista
    function adicionarCNPJNovo(cnpj) {
        const cnpjLimpo = cnpj.replace(/[^\d]/g, '');
        
        if (!cnpjLimpo) {
            alert('Por favor, digite um CNPJ válido.');
            return;
        }

        if (!validarCNPJNovo(cnpjLimpo)) {
            alert('CNPJ inválido. Deve conter 14 dígitos.');
            return;
        }

        if (cnpjsAssociadosNovo.includes(cnpjLimpo)) {
            alert('Este CNPJ já foi adicionado.');
            return;
        }

        cnpjsAssociadosNovo.push(cnpjLimpo);
        atualizarListaCNPJsNovo();
        document.getElementById('novo_cnpj_input').value = '';
    }

    // Função para remover CNPJ da lista
    function removerCNPJNovo(cnpj) {
        cnpjsAssociadosNovo = cnpjsAssociadosNovo.filter(c => c !== cnpj);
        atualizarListaCNPJsNovo();
    }

    // Função para atualizar a lista visual de CNPJs
    function atualizarListaCNPJsNovo() {
        const listaContainer = document.getElementById('novo_cnpjs_lista');
        listaContainer.innerHTML = '';

        cnpjsAssociadosNovo.forEach(cnpj => {
            const tag = document.createElement('span');
            tag.className = 'badge bg-primary me-2 mb-2';
            tag.style.cssText = 'font-size: 0.9em; padding: 0.5em 0.75em; cursor: pointer;';
            tag.innerHTML = `${formatarCNPJNovo(cnpj)} <i class="fas fa-times ms-2" style="cursor: pointer;"></i>`;
            
            tag.addEventListener('click', function(e) {
                if (e.target.classList.contains('fa-times') || e.target.parentElement.classList.contains('fa-times')) {
                    removerCNPJNovo(cnpj);
                }
            });

            listaContainer.appendChild(tag);
        });

        // Atualizar campo hidden com JSON
        document.getElementById('novo_cnpjs_json').value = JSON.stringify(cnpjsAssociadosNovo);
    }

    // Evento para adicionar CNPJ ao pressionar Enter
    document.getElementById('novo_cnpj_input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            adicionarCNPJNovo(this.value);
        }
    });

    // Evento para botão adicionar CNPJ
    document.getElementById('novo_btn_adicionar_cnpj').addEventListener('click', function() {
        const input = document.getElementById('novo_cnpj_input');
        adicionarCNPJNovo(input.value);
    });

    // Limpar lista de CNPJs ao fechar o modal
    document.getElementById('modalNovoContrato').addEventListener('hidden.bs.modal', function () {
        cnpjsAssociadosNovo = [];
        atualizarListaCNPJsNovo();
    });

    // Validação e submit do formulário
    document.getElementById('form-novo-contrato').addEventListener('submit', function (e) {
        e.preventDefault();
        
        const nome = document.getElementById('novo_nome').value.trim();
        const centroCusto = document.getElementById('novo_centro_custo_id').value;

        if (!nome) {
            alert('O nome do contrato é obrigatório!');
            document.getElementById('novo_nome').focus();
            return false;
        }

        if (!centroCusto) {
            alert('O centro de custo é obrigatório!');
            document.getElementById('novo_centro_custo_id').focus();
            return false;
        }

        // Enviar via AJAX
        const form = document.getElementById('form-novo-contrato');
        const formData = new FormData(form);
        
        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => {
            if (response.redirected) {
                window.location.reload();
            } else {
                return response.json();
            }
        })
        .then(data => {
            if (data && data.success) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('modalNovoContrato'));
                if (modal) modal.hide();
                // Recarregar DataTable
                if (typeof $('#dataTable').DataTable !== 'undefined') {
                    $('#dataTable').DataTable().ajax.reload(null, false);
                } else {
                    window.location.reload();
                }
            } else if (data && !data.success) {
                alert(data.error || 'Erro ao salvar o contrato.');
            } else {
                window.location.reload();
            }
        })
        .catch(error => {
            console.error('Erro:', error);
            alert('Erro ao salvar o contrato. Verifique o console para mais detalhes.');
        });
    });

    // Limpar formulário ao fechar o modal
    document.getElementById('modalNovoContrato').addEventListener('hidden.bs.modal', function () {
        document.getElementById('form-novo-contrato').reset();
        document.getElementById('novo_valor_total').textContent = 'R$ 0,00';
    });
});
</script>
