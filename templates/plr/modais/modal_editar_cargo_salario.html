<!-- Modal único: edição preenchida via JS (lista DataTables server-side) -->
<div class="modal fade" id="modalEditarCargoSalario" tabindex="-1" aria-labelledby="modalEditarCargoSalarioLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" id="formEditarCargoSalario" action="#">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarCargoSalarioLabel">Editar Cargo x Salário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Cargo</label>
                        <input type="text" class="form-control" id="cargo_salario_editar_nome" readonly disabled value="">
                        <input type="hidden" name="cargo_id" id="cargo_salario_editar_cargo_id" value="">
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label" for="cargo_salario_editar_mes">Mês *</label>
                            <select class="form-select" name="mes" id="cargo_salario_editar_mes" required>
                                {% for i in range(1, 13) %}
                                <option value="{{ i }}">{{ i }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="cargo_salario_editar_ano">Ano *</label>
                            <input type="number" class="form-control" name="ano" id="cargo_salario_editar_ano" min="2020" max="2030" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="cargo_salario_editar_salario">Salário (R$) *</label>
                        <input type="text" class="form-control" name="salario" id="cargo_salario_editar_salario" placeholder="0,00" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
