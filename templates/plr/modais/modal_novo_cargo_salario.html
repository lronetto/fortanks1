<!-- Modal Novo Cargo x Salário -->
<div class="modal fade" id="modalNovoCargoSalario" tabindex="-1" aria-labelledby="modalNovoCargoSalarioLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('plr.cargo_salario_novo') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNovoCargoSalarioLabel">Novo Cargo x Salário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="cargo_id_novo" class="form-label">Cargo *</label>
                        <select class="form-select" id="cargo_id_novo" name="cargo_id" required>
                            <option value="">Selecione...</option>
                            {% for c in cargos %}
                            <option value="{{ c.id }}">{{ c.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label for="mes_novo" class="form-label">Mês *</label>
                            <select class="form-select" id="mes_novo" name="mes" required>
                                {% for i in range(1, 13) %}
                                <option value="{{ i }}">{{ i }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="ano_novo" class="form-label">Ano *</label>
                            <input type="number" class="form-control" id="ano_novo" name="ano" min="2020" max="2030" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="salario_novo" class="form-label">Salário (R$) *</label>
                        <input type="text" class="form-control" id="salario_novo" name="salario" placeholder="0,00" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
