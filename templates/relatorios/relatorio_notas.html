{% extends 'common/base.html' %}
{% block title %}Relatório de Notas Fiscais de Venda{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <h2 class="mb-4"><i class="fas fa-file-invoice-dollar"></i> Relatório de Notas Fiscais de Venda por Centro de Custo</h2>
    <form id="filtro-relatorio" class="row g-3 mb-4">
        <div class="col-md-3">
            <label for="data_inicio" class="form-label">Data Inicial</label>
            <input type="date" class="form-control" id="data_inicio" name="data_inicio">
        </div>
        <div class="col-md-3">
            <label for="data_fim" class="form-label">Data Final</label>
            <input type="date" class="form-control" id="data_fim" name="data_fim">
        </div>
        <div class="col-md-4">
            <label for="centro_custo" class="form-label">Centro de Custo</label>
            <select class="form-select" id="centro_custo" name="centro_custo" multiple>
                {% for cc in centros_custo %}
                <option value="{{ cc.id }}">{{ cc.codigo }} - {{ cc.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2 align-self-end">
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-search"></i> Filtrar</button>
        </div>
        <div class="col-md-2 align-self-end">
            <button type="button" id="btn-exportar-zip" class="btn btn-info w-100"><i class="fas fa-file-archive"></i> Exportar ZIP</button>
        </div>
        <div class="col-md-2 align-self-end">
            <button type="button" id="btn-exportar-pdf" class="btn btn-danger w-100"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
        </div>
         <div class="col-md-2 align-self-end">
            <button type="button" id="btn-exportar-excel" class="btn btn-success w-100"><i class="fas fa-file-excel"></i> Exportar Excel</button>
        </div>
    </form>
    <div id="relatorio-tabela">

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
$(document).ready(function() {
    $('#centro_custo').select2({
        theme: 'bootstrap4',
        placeholder: 'Selecione um ou mais centros de custo',
        allowClear: true
    });

    carregar_relatorio();
    function carregar_relatorio(){
        let data_inicio = $('#data_inicio').val();
        let data_fim = $('#data_fim').val();
        let centro_custo = $('#centro_custo').val();
        $.ajax({
            url: "{{ url_for('relatorio.relatorio_notas_ajax') }}",
            type: 'GET',
            data: {
                data_inicio: data_inicio,
                data_fim: data_fim,
                centro_custo: centro_custo
            },
            traditional: true,
            success: function(response) {
                $('#relatorio-tabela').html(response);
            },
            error: function() {
                alert('Erro ao buscar dados do relatório.');
            }
        });
    }
    $('#filtro-relatorio').on('submit', function(e) {
        e.preventDefault();
        $('#relatorio-tabela').html('Carregando...');
        carregar_relatorio();
    });

    $('#btn-exportar-zip').on('click', function() {
        let data_inicio = $('#data_inicio').val();
        let data_fim = $('#data_fim').val();
        let centro_custo = $('#centro_custo').val();
        let url = "{{ url_for('relatorio.relatorio_notas_exportar') }}?" +
            $.param({
                data_inicio: data_inicio,
                data_fim: data_fim,
                centro_custo: centro_custo
            }, true);
        window.open(url, '_blank');
    });

    $('#btn-exportar-pdf').on('click', function() {
        let data_inicio = $('#data_inicio').val();
        let data_fim = $('#data_fim').val();
        let centro_custo = $('#centro_custo').val();
        let url = "{{ url_for('relatorio.relatorio_notas_exportar_pdf') }}?" +
            $.param({
                data_inicio: data_inicio,
                data_fim: data_fim,
                centro_custo: centro_custo
            }, true);
        window.open(url, '_blank');
    });

    $('#btn-exportar-excel').on('click', function() {
        let data_inicio = $('#data_inicio').val();
        let data_fim = $('#data_fim').val();
        let centro_custo = $('#centro_custo').val();
        let url = "{{ url_for('relatorio.relatorio_notas_exportar_excel') }}?" +
            $.param({
                data_inicio: data_inicio,
                data_fim: data_fim,
                centro_custo: centro_custo
            }, true);
        window.open(url, '_blank');
    });
});
</script>
{% endblock %}
