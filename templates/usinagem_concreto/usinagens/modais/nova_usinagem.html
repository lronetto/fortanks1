<!-- Modal de Nova Usinagem -->
<div class="modal fade" id="modalNovaUsinagem" tabindex="-1" aria-labelledby="modalNovaUsinagemLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalNovaUsinagemLabel">Nova Usinagem de Concreto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formNovaUsinagem">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body">
                    <!-- Mensagens de erro/sucesso -->
                    <div id="mensagemNovaUsinagem" class="alert d-none" role="alert"></div>
                    
                    <!-- Série -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="serie" class="form-label fw-bold">Série *</label>
                            <input type="text" class="form-control" id="serie" name="serie" required maxlength="100" placeholder="Ex: US-2024-001">
                            <small class="form-text text-muted">Identificador único da usinagem</small>
                        </div>
                    </div>

                    <!-- Data/Hora e Traço -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="data_usinagem" class="form-label fw-bold">Data/Hora de Usinagem *</label>
                            <input type="datetime-local" class="form-control" id="data_usinagem" name="data_usinagem" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="produto_composto_id" class="form-label fw-bold">Traço *</label>
                            <select class="form-control" id="produto_composto_id" name="produto_composto_id" required>
                                <option value="">Selecione um traço</option>
                                {% for traco in tracos %}
                                <option value="{{ traco.id }}">{{ traco.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Volume e Flow -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="volume" class="form-label fw-bold">Volume (m³) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="volume" name="volume" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="flow" class="form-label fw-bold">Flow</label>
                            <input type="text" class="form-control" id="flow" name="flow" maxlength="50" placeholder="Ex: 650/650">
                        </div>
                    </div>

                    <!-- NF e Dados Adicionais -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="nf" class="form-label fw-bold">Nota Fiscal</label>
                            <input type="text" class="form-control" id="nf" name="nf" maxlength="50">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="dados_adicionais" class="form-label fw-bold">Dados Adicionais (JSON)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="dados_adicionais" name="dados_adicionais" placeholder='{"campo": "valor"}'>
                                <button type="button" class="btn btn-outline-secondary" id="btnAbrirRedosagem" title="Abrir redosagem de materiais">
                                    <i class="fas fa-calculator"></i> Redosagem
                                </button>
                            </div>
                            <small class="form-text text-muted">Opcional: dados em formato JSON para uso futuro</small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSalvarNovaUsinagem">
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        Salvar Usinagem
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    // Definir a data e hora atual como padrão para o campo de data de usinagem
    const dataFormatada = '{{ now }}';
    
    // Inicializar quando o modal for aberto
    $('#modalNovaUsinagem').on('show.bs.modal', function() {
        // Definir data atual se não tiver valor
        if (! $('#data_usinagem').val()) {
            $('#data_usinagem').val(dataFormatada);
        }
        $('#mensagemNovaUsinagem').addClass('d-none').removeClass('alert-success alert-danger');
        
        // Inicializar select2 se disponível
        if ($.fn.select2 && !$('#produto_composto_id').hasClass('select2-hidden-accessible')) {
            $('#produto_composto_id').select2({
                dropdownParent: $('#modalNovaUsinagem'),
                width: '100%'
            });
        }
    });
    
    // Limpar formulário ao fechar o modal
    $('#modalNovaUsinagem').on('hidden.bs.modal', function() {
        $('#formNovaUsinagem')[0].reset();
        $('#data_usinagem').val(dataFormatada);
        $('#mensagemNovaUsinagem').addClass('d-none').removeClass('alert-success alert-danger');
        $('#formNovaUsinagem').find('.is-invalid').removeClass('is-invalid');
        
        // Destruir select2 se foi inicializado
        if ($.fn.select2 && $('#produto_composto_id').hasClass('select2-hidden-accessible')) {
            $('#produto_composto_id').select2('destroy');
        }
    });
    
    // Submeter formulário via AJAX
    $('#formNovaUsinagem').on('submit', function(e) {
        e.preventDefault();
        
        var form = $(this);
        var btnSubmit = $('#btnSalvarNovaUsinagem');
        var spinner = btnSubmit.find('.spinner-border');
        var mensagem = $('#mensagemNovaUsinagem');
        
        // Desabilitar botão e mostrar spinner
        btnSubmit.prop('disabled', true);
        spinner.removeClass('d-none');
        
        // Limpar mensagens anteriores
        mensagem.addClass('d-none').removeClass('alert-success alert-danger');
        form.find('.is-invalid').removeClass('is-invalid');
        
        // Validar campos obrigatórios no cliente antes de enviar
        var serie = $('#serie').val().trim();
        var dataUsinagem = $('#data_usinagem').val().trim();
        // Se Select2 estiver ativo, usar o método correto para obter o valor
        var produtoCompostoId = $('#produto_composto_id').hasClass('select2-hidden-accessible') 
            ? $('#produto_composto_id').select2('val') 
            : $('#produto_composto_id').val();
        var volume = $('#volume').val().trim();
        
        if (!serie || !dataUsinagem || !produtoCompostoId || !volume) {
            var camposFaltando = [];
            if (!serie) camposFaltando.push('Série');
            if (!dataUsinagem) camposFaltando.push('Data/Hora');
            if (!produtoCompostoId) camposFaltando.push('Traço');
            if (!volume) camposFaltando.push('Volume');
            
            mensagem.removeClass('d-none alert-success').addClass('alert-danger');
            mensagem.html('<i class="fas fa-exclamation-circle"></i> Preencha os campos obrigatórios: ' + camposFaltando.join(', '));
            btnSubmit.prop('disabled', false);
            spinner.addClass('d-none');
            return;
        }
        
        // Preparar dados do formulário
        var formData = new FormData(this);
        
        // Debug: log dos dados sendo enviados (remover em produção)
        console.log('Dados do formulário:', {
            serie: serie,
            data_usinagem: dataUsinagem,
            produto_composto_id: produtoCompostoId,
            volume: volume
        });
        
        // Enviar via AJAX
        $.ajax({
            url: '{{ url_for("usinagem_concreto.nova_usinagem") }}',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            success: function(response) {
                if (response.success) {
                    // Mostrar mensagem de sucesso
                    mensagem.removeClass('d-none alert-danger').addClass('alert-success');
                    mensagem.html('<i class="fas fa-check-circle"></i> ' + (response.message || 'Usinagem cadastrada com sucesso!'));
                    
                    // Fechar modal após 1 segundo e recarregar página
                    setTimeout(function() {
                        $('#modalNovaUsinagem').modal('hide');
                        // Recarregar a página para atualizar a lista
                        window.location.reload();
                    }, 1000);
                } else {
                    // Mostrar erro
                    mensagem.removeClass('d-none alert-success').addClass('alert-danger');
                    mensagem.html('<i class="fas fa-exclamation-circle"></i> ' + (response.error || 'Erro ao cadastrar usinagem.'));
                    btnSubmit.prop('disabled', false);
                    spinner.addClass('d-none');
                }
            },
            error: function(xhr) {
                var errorMsg = 'Erro ao cadastrar usinagem.';
                
                if (xhr.responseJSON && xhr.responseJSON.error) {
                    errorMsg = xhr.responseJSON.error;
                } else if (xhr.status === 400) {
                    errorMsg = 'Dados inválidos. Verifique os campos obrigatórios.';
                } else if (xhr.status === 500) {
                    errorMsg = 'Erro interno do servidor. Tente novamente.';
                }
                
                mensagem.removeClass('d-none alert-success').addClass('alert-danger');
                mensagem.html('<i class="fas fa-exclamation-circle"></i> ' + errorMsg);
                btnSubmit.prop('disabled', false);
                spinner.addClass('d-none');
            }
        });
    });
    
    // Abrir modal de redosagem
    $('#btnAbrirRedosagem').on('click', function() {
        // Verificar se traço e volume estão preenchidos
        const produtoCompostoId = $('#produto_composto_id').hasClass('select2-hidden-accessible') 
            ? $('#produto_composto_id').select2('val') 
            : $('#produto_composto_id').val();
        const volume = $('#volume').val();
        
        if (!produtoCompostoId) {
            $('#mensagemNovaUsinagem').removeClass('d-none alert-success').addClass('alert-warning');
            $('#mensagemNovaUsinagem').html('<i class="fas fa-info-circle"></i> Selecione um traço antes de abrir a redosagem.');
            return;
        }
        
        if (!volume || parseFloat(volume) <= 0) {
            $('#mensagemNovaUsinagem').removeClass('d-none alert-success').addClass('alert-warning');
            $('#mensagemNovaUsinagem').html('<i class="fas fa-info-circle"></i> Informe o volume antes de abrir a redosagem.');
            return;
        }
        
        // Abrir modal de redosagem
        $('#modalRedosagem').modal('show');
    });
})();
</script>

<!-- Incluir modal de redosagem -->
{% include 'usinagem_concreto/usinagens/modais/redosagem.html' %}
