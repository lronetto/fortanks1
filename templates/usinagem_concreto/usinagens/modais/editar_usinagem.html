<!-- Modal de Editar Usinagem -->
<div class="modal fade" id="modalEditarUsinagem" tabindex="-1" aria-labelledby="modalEditarUsinagemLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEditarUsinagemLabel">Editar Usinagem de Concreto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formEditarUsinagem">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="usinagem_id" name="usinagem_id">
                <div class="modal-body">
                    <!-- Mensagens de erro/sucesso -->
                    <div id="mensagemEditarUsinagem" class="alert d-none" role="alert"></div>
                    
                    <!-- Série -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="edit_serie" class="form-label fw-bold">Série *</label>
                            <input type="text" class="form-control" id="edit_serie" name="serie" required maxlength="100" placeholder="Ex: US-2024-001">
                            <small class="form-text text-muted">Identificador único da usinagem</small>
                        </div>
                    </div>

                    <!-- Data/Hora e Traço -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="edit_data_usinagem" class="form-label fw-bold">Data/Hora de Usinagem *</label>
                            <input type="datetime-local" class="form-control" id="edit_data_usinagem" name="data_usinagem" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="edit_produto_composto_id" class="form-label fw-bold">Traço *</label>
                            <select class="form-control" id="edit_produto_composto_id" name="produto_composto_id" required>
                                <option value="">Selecione um traço</option>
                                {% for traco in tracos %}
                                <option value="{{ traco.id }}">{{ traco.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Volume e Flow -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="edit_volume" class="form-label fw-bold">Volume (m³) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="edit_volume" name="volume" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="edit_flow" class="form-label fw-bold">Flow</label>
                            <input type="text" class="form-control" id="edit_flow" name="flow" maxlength="50" placeholder="Ex: 650/650">
                        </div>
                    </div>

                    <!-- NF e Dados Adicionais -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="edit_nf" class="form-label fw-bold">Nota Fiscal</label>
                            <input type="text" class="form-control" id="edit_nf" name="nf" maxlength="50">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="edit_dados_adicionais" class="form-label fw-bold">Dados Adicionais (JSON)</label>
                            <input type="text" class="form-control" id="edit_dados_adicionais" name="dados_adicionais" placeholder='{"campo": "valor"}'>
                            <small class="form-text text-muted">Opcional: dados em formato JSON para uso futuro</small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSalvarEditarUsinagem">
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    // Inicializar quando o modal for aberto
    $('#modalEditarUsinagem').on('show.bs.modal', function(event) {
        var button = $(event.relatedTarget);
        var usinagemId = button.data('usinagem-id');
        var serie = button.data('serie') || '';
        var dataUsinagem = button.data('data-usinagem') || '';
        var produtoCompostoId = button.data('produto-composto-id') || '';
        var volume = button.data('volume') || '';
        var flow = button.data('flow') || '';
        var nf = button.data('nf') || '';
        
        // Preencher campos do formulário
        $('#usinagem_id').val(usinagemId);
        $('#edit_serie').val(serie);
        $('#edit_data_usinagem').val(dataUsinagem);
        $('#edit_produto_composto_id').val(produtoCompostoId);
        $('#edit_volume').val(volume);
        $('#edit_flow').val(flow);
        $('#edit_nf').val(nf);
        
        // Limpar mensagens
        $('#mensagemEditarUsinagem').addClass('d-none').removeClass('alert-success alert-danger');
        
        // Inicializar select2 se disponível
        if ($.fn.select2 && !$('#edit_produto_composto_id').hasClass('select2-hidden-accessible')) {
            $('#edit_produto_composto_id').select2({
                dropdownParent: $('#modalEditarUsinagem'),
                width: '100%'
            });
        }
    });
    
    // Limpar formulário ao fechar o modal
    $('#modalEditarUsinagem').on('hidden.bs.modal', function() {
        $('#formEditarUsinagem')[0].reset();
        $('#mensagemEditarUsinagem').addClass('d-none').removeClass('alert-success alert-danger');
        $('#formEditarUsinagem').find('.is-invalid').removeClass('is-invalid');
        
        // Destruir select2 se foi inicializado
        if ($.fn.select2 && $('#edit_produto_composto_id').hasClass('select2-hidden-accessible')) {
            $('#edit_produto_composto_id').select2('destroy');
        }
    });
    
    // Submeter formulário via AJAX
    $('#formEditarUsinagem').on('submit', function(e) {
        e.preventDefault();
        
        var form = $(this);
        var btnSubmit = $('#btnSalvarEditarUsinagem');
        var spinner = btnSubmit.find('.spinner-border');
        var mensagem = $('#mensagemEditarUsinagem');
        var usinagemId = $('#usinagem_id').val();
        
        // Desabilitar botão e mostrar spinner
        btnSubmit.prop('disabled', true);
        spinner.removeClass('d-none');
        
        // Limpar mensagens anteriores
        mensagem.addClass('d-none').removeClass('alert-success alert-danger');
        form.find('.is-invalid').removeClass('is-invalid');
        
        // Validar campos obrigatórios no cliente antes de enviar
        var serie = $('#edit_serie').val().trim();
        var dataUsinagem = $('#edit_data_usinagem').val().trim();
        var produtoCompostoId = $('#edit_produto_composto_id').hasClass('select2-hidden-accessible') 
            ? $('#edit_produto_composto_id').select2('val') 
            : $('#edit_produto_composto_id').val();
        var volume = $('#edit_volume').val().trim();
        
        if (!serie || !dataUsinagem || !produtoCompostoId || !volume) {
            var camposFaltando = [];
            if (!serie) camposFaltando.push('Série');
            if (!dataUsinagem) camposFaltando.push('Data/Hora');
            if (!produtoCompostoId) camposFaltando.push('Traço');
            if (!volume) camposFaltando.push('Volume');
            
            mensagem.removeClass('d-none alert-success').addClass('alert-danger');
            mensagem.html('<i class="fas fa-exclamation-circle"></i> Preencha os campos obrigatórios: ' + camposFaltando.join(', '));
            btnSubmit.prop('disabled', false);
            spinner.addClass('d-none');
            return;
        }
        
        // Preparar dados do formulário
        var formData = new FormData(this);
        
        // Enviar via AJAX
        $.ajax({
            url: '/usinagem-concreto/usinagens/' + usinagemId + '/editar',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            success: function(response) {
                if (response.success) {
                    // Mostrar mensagem de sucesso
                    mensagem.removeClass('d-none alert-danger').addClass('alert-success');
                    mensagem.html('<i class="fas fa-check-circle"></i> ' + (response.message || 'Usinagem atualizada com sucesso!'));
                    
                    // Fechar modal após 1 segundo e recarregar página
                    setTimeout(function() {
                        $('#modalEditarUsinagem').modal('hide');
                        // Recarregar a página para atualizar a lista
                        window.location.reload();
                    }, 1000);
                } else {
                    // Mostrar erro
                    mensagem.removeClass('d-none alert-success').addClass('alert-danger');
                    mensagem.html('<i class="fas fa-exclamation-circle"></i> ' + (response.error || 'Erro ao atualizar usinagem.'));
                    btnSubmit.prop('disabled', false);
                    spinner.addClass('d-none');
                }
            },
            error: function(xhr) {
                var errorMsg = 'Erro ao atualizar usinagem.';
                
                if (xhr.responseJSON && xhr.responseJSON.error) {
                    errorMsg = xhr.responseJSON.error;
                } else if (xhr.status === 400) {
                    errorMsg = 'Dados inválidos. Verifique os campos obrigatórios.';
                } else if (xhr.status === 500) {
                    errorMsg = 'Erro interno do servidor. Tente novamente.';
                }
                
                mensagem.removeClass('d-none alert-success').addClass('alert-danger');
                mensagem.html('<i class="fas fa-exclamation-circle"></i> ' + errorMsg);
                btnSubmit.prop('disabled', false);
                spinner.addClass('d-none');
            }
        });
    });
})();
</script>
