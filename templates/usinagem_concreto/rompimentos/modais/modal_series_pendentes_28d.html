<!-- Modal Séries Pendentes 28 dias -->
<div class="modal fade" id="modalSeriesPendentes28d" tabindex="-1" aria-labelledby="modalSeriesPendentes28dLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title" id="modalSeriesPendentes28dLabel">
                    <i class="fas fa-exclamation-triangle"></i> Séries Pendentes de Rompimento 28 dias
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i> 
                    Séries que completaram 28 dias após a moldagem mas ainda não foram rompidas.
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="tabelaSeriesPendentes">
                        <thead>
                            <tr>
                                <th>Número de Série</th>
                                <th>Data de Moldagem</th>
                                <th>Data Prevista 28d</th>
                                <th>Dias Atrasados</th>
                                <th>Quantidade de Rompimentos</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Será preenchido via AJAX -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // Botão para mostrar séries pendentes de 28 dias
    $('#btnSeriesPendentes28d').on('click', function() {
        var modal = $('#modalSeriesPendentes28d');
        var tbody = modal.find('tbody');
        
        // Limpar tabela
        tbody.empty();
        modal.modal('show');
        tbody.html('<tr><td colspan="6" class="text-center"><i class="fas fa-spinner fa-spin"></i> Carregando...</td></tr>');
        
        // Buscar séries pendentes via AJAX
        $.ajax({
            url: '{{ url_for("usinagem_concreto.listar_series_pendentes_28d") }}',
            method: 'GET',
            success: function(response) {
                tbody.empty();
                if (response.success && response.series.length > 0) {
                    response.series.forEach(function(serie) {
                        var row = $('<tr></tr>');
                        var badgeClass = serie.dias_atrasados > 7 ? 'bg-danger' : (serie.dias_atrasados > 3 ? 'bg-warning' : 'bg-info');
                        row.html(
                            '<td><strong>' + serie.numero_serie + '</strong></td>' +
                            '<td>' + serie.data_moldagem + '</td>' +
                            '<td>' + serie.data_prevista_28d + '</td>' +
                            '<td><span class="badge ' + badgeClass + '">' + serie.dias_atrasados + ' dia(s)</span></td>' +
                            '<td>' + serie.quantidade_rompimentos + '</td>' +
                            '<td>' +
                                '<button type="button" class="btn btn-sm btn-primary btn-ver-rompimentos" data-serie="' + serie.numero_serie + '" title="Ver rompimentos da série">' +
                                    '<i class="fas fa-eye"></i> Ver' +
                                '</button>' +
                            '</td>'
                        );
                        tbody.append(row);
                    });
                } else {
                    tbody.html('<tr><td colspan="6" class="text-center text-success"><i class="fas fa-check-circle"></i> Nenhuma série pendente! Todas as séries foram rompidas em 28 dias.</td></tr>');
                }
            },
            error: function() {
                tbody.html('<tr><td colspan="6" class="text-center text-danger">Erro ao carregar séries pendentes.</td></tr>');
            }
        });
    });
});
</script>
