name: Deploy automático via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sfortanks
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/sfortanks/sfortanks
            git pull origin main
            uv sync
            sudo systemctl restart sfortanks.service
            sudo systemctl restart sfortanks-scheduler.service