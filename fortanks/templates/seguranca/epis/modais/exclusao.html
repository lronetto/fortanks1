 <!-- Modais para Exclusão -->
 <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
 <div class="modal-dialog">
     <div class="modal-content">
         <div class="modal-header">
             <h5 class="modal-title" id="deleteModalLabel">Confirmar Exclusão</h5>
             <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
         </div>
         <div class="modal-body">
             <p>Tem certeza que deseja excluir o EPI <span id="epi_nome"></span>?</p>
             <p class="text-danger">Esta ação não pode ser desfeita.</p>
         </div>
         <div class="modal-footer">
             <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
             <form action="" method="post" id="form_excluir">
                 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                 <button type="submit" class="btn btn-danger">Excluir</button>
             </form>
         </div>
     </div>
 </div>
</div>
{% block script %}
<script>
   // ========= EXCLUSÃO DE EPI =========
        // Os modais já existentes para exclusão podem ser adaptados
        // para usar o data-epi-id
        document.querySelectorAll('button[data-bs-target="deleteModal"]').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                const epiId = this.getAttribute('data-epi-id');

                const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
                fetch(`/seguranca/epis/excluir/${epiId}`, {
                    method: 'GET',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        
                        document.getElementById('epi_nome').textContent = data.epi_nome;
                        document.getElementById('form_excluir').action = `/seguranca/epis/excluir/${data.epi_id}`;
                        modal.show();
                    }
                })
               
            });
        });
        document.querySelectorAll('form[action*="excluir"]').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const epiId = this.action.split('/').pop();
                const formData = new FormData(this);
                
                fetch(`/seguranca/epis/excluir/${epiId}`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    // Exibir mensagem
                    const alertsDiv = document.querySelector('.alert-container');
                    if (alertsDiv) {
                        const alert = document.createElement('div');
                        alert.className = `alert alert-${data.success ? 'success' : 'danger'} alert-dismissible fade show`;
                        alert.innerHTML = `
                            ${data.message}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                        `;
                        alertsDiv.appendChild(alert);
                    }
                    
                    // Se foi excluído com sucesso, remover linha da tabela
                    if (data.success) {
                        // Fechar o modal
                        const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal' + epiId));
                        if (modal) modal.hide();
                        
                        // Remover linha da tabela ou recarregar página
                        setTimeout(() => {
                            location.reload();
                        }, 1000);
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    alert('Erro ao excluir EPI. Tente novamente.');
                });
            });
        });
</script>
{% endblock %}
