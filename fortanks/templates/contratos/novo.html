{% extends 'common/base.html' %}

{% block title %}Novo Contrato - Sistema de Gestão - Pré-moldados{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3"><i class="fas fa-plus-circle"></i> Novo Contrato</h1>
        <a href="{{ url_for('contrato.index') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Cadastro de Contrato</h6>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('contrato.novo') }}" id="form-contrato">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="nome" class="form-label">Nome do Contrato</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="centro_custo_id" class="form-label">Centro de Custo</label>
                        <select class="form-select" id="centro_custo_id" name="centro_custo_id" required>
                            <option value="" selected disabled>Selecione um centro de custo</option>
                            {% for centro in centros_custo %}
                            <option value="{{ centro.id }}">{{ centro.codigo }} - {{ centro.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="cliente_direto_id" class="form-label">Cliente Direto</label>
                        <select class="form-select" id="cliente_direto_id" name="cliente_direto_id">
                            <option value="">Selecione um cliente</option>
                            {% for cliente in clientes %}
                            <option value="{{ cliente.id }}">{{ cliente.nome }} ({{ cliente.cnpj }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="cliente_final_id" class="form-label">Cliente Final</label>
                        <select class="form-select" id="cliente_final_id" name="cliente_final_id">
                            <option value="">Selecione um cliente</option>
                            {% for cliente in clientes %}
                            <option value="{{ cliente.id }}">{{ cliente.nome }} ({{ cliente.cnpj }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-select" id="estado" name="estado">
                            <option value="" selected>Selecione um estado</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="cidade" name="cidade">
                    </div>
                    <div class="col-md-5 mb-3">
                        <label for="data_base" class="form-label">Data Base</label>
                        <input type="date" class="form-control" id="data_base" name="data_base">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="venda_material" class="form-label">Valor Materiais (R$)</label>
                        <input type="text" class="form-control mascara-moeda" id="venda_material" name="venda_material">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="venda_servico" class="form-label">Valor Serviços (R$)</label>
                        <input type="text" class="form-control mascara-moeda" id="venda_servico" name="venda_servico">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>Valor Total do Contrato:</strong>
                            <span id="valor_total" class="ms-2">R$ 0,00</span>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="reset" class="btn btn-secondary me-md-2">
                        <i class="fas fa-eraser"></i> Limpar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Formatar valores monetários
    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Converter valor formatado em número
    function converterParaNumero(valorFormatado) {
        if (!valorFormatado) return 0;

        return parseFloat(valorFormatado.replace('R$', '')
            .replace(/\./g, '')
            .replace(/,/g, '.')
            .trim());
    }

    // Calcular valor total
    function calcularTotal() {
        const valorMaterial = converterParaNumero(document.getElementById('venda_material').value);
        const valorServico = converterParaNumero(document.getElementById('venda_servico').value);

        const total = valorMaterial + valorServico;
        document.getElementById('valor_total').textContent = formatarMoeda(total);
    }

    // Inicializar máscaras
    $(document).ready(function () {
        // Máscara para valores monetários
        $('.mascara-moeda').maskMoney({
            prefix: 'R$ ',
            allowNegative: false,
            thousands: '.',
            decimal: ',',
            affixesStay: true
        });

        // Recalcular total quando os valores são alterados
        $('#venda_material, #venda_servico').on('keyup', calcularTotal);
    });

    // Validação do formulário
    document.getElementById('form-contrato').addEventListener('submit', function (e) {
        const nome = document.getElementById('nome').value.trim();
        const centroCusto = document.getElementById('centro_custo_id').value;

        if (!nome) {
            e.preventDefault();
            alert('O nome do contrato é obrigatório!');
            document.getElementById('nome').focus();
            return false;
        }

        if (!centroCusto) {
            e.preventDefault();
            alert('O centro de custo é obrigatório!');
            document.getElementById('centro_custo_id').focus();
            return false;
        }

        return true;
    });
</script>
{% endblock %}
