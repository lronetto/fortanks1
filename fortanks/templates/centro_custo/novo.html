{% extends 'common/base.html' %}

{% block title %}Novo Centro de Custo - Sistema de Gestão - Pré-moldados{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3"><i class="fas fa-plus-circle"></i> Novo Centro de Custo</h1>
        <a href="{{ url_for('centro_custo.index') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Cadastro de Centro de Custo</h6>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('centro_custo.novo') }}" id="form-centro-custo">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="codigo" class="form-label">Código</label>
                        <input type="text" class="form-control" id="codigo" name="codigo" required>
                        <div class="form-text">Código único para identificação do centro de custo</div>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="ativo" name="ativo" checked>
                            <label class="form-check-label" for="ativo">Centro de Custo Ativo</label>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="reset" class="btn btn-secondary me-md-2">
                        <i class="fas fa-eraser"></i> Limpar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Validação do formulário
    document.getElementById('form-centro-custo').addEventListener('submit', function (e) {
        const codigo = document.getElementById('codigo').value.trim();
        const nome = document.getElementById('nome').value.trim();

        if (!codigo) {
            e.preventDefault();
            alert('O código do centro de custo é obrigatório!');
            document.getElementById('codigo').focus();
            return false;
        }

        if (!nome) {
            e.preventDefault();
            alert('O nome do centro de custo é obrigatório!');
            document.getElementById('nome').focus();
            return false;
        }

        return true;
    });
</script>
{% endblock %}
