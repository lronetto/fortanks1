<!-- Modal de Exclusão de Nota Fiscal -->
<div class="modal fade" id="modalExcluirNota" tabindex="-1" aria-labelledby="modalExcluirNotaLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalExcluirNotaLabel">Confirmar Exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle"></i> Tem certeza que deseja excluir a nota fiscal 
                    <strong id="numeroNotaExcluir"></strong>?
                </div>
                <p>Esta ação não poderá ser desfeita. Todos os dados relacionados a esta nota fiscal serão removidos do sistema.</p>
                
                <form id="formExcluirNota">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" id="excluir_nf_id" name="nf_id">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="btnConfirmarExclusao" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Excluir Nota Fiscal
                </button>
            </div>
        </div>
    </div>
</div>
